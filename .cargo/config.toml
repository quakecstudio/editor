[alias]
xtask = "run --quiet --locked --package xtask --"

# A version of a registry package is resolved only once it has been published for a week
# (docs/conventions.md, CONV-4): time for a bad release to be yanked before it reaches the
# lock file. A fix needed sooner is taken with the age set to nothing for that one update:
#   cargo update -p <crate> --config 'registry.global-min-publish-age="0 days"'
[registry]
global-min-publish-age = "7 days"
