# Workspace configuration. The values here are described in docs/conventions.md,
# and `cargo xtask conventions` fails when the two disagree.

[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "2026.10.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99.0"
repository = "https://github.com/quakecstudio/editor"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
non_ascii_idents = "deny"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"

[workspace.lints.clippy]
# Own-crate items are imported with `use`, not spelled inline as deep paths.
# Configured in `.clippy.toml` (`absolute-paths-*`) so only `crate::` and
# `qs_*::` paths are reported.
absolute_paths = "deny"

# Panic prevention. Shipped code must never panic (PRIN-7).
# See: https://blog.reverberate.org/2025/02/03/no-panic-rust.html
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"

# Panic patterns inside Result-returning functions
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
get_unwrap = "deny"

# Indexing can panic: use .get() instead
indexing_slicing = "deny"

# String slicing can panic on non-UTF-8 boundaries
string_slice = "deny"

# `+`, `-`, `*`, `/` and `%` panic or wrap silently. Use checked_*, saturating_*
# or wrapping_* to say which; the VM and compiler must match C exactly.
arithmetic_side_effects = "deny"
integer_division = "deny"
modulo_arithmetic = "deny"

# Numeric `as` casts silently truncate, lose sign, wrap or lose precision.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
checked_conversions = "deny"

# Float comparisons. The VM and compiler compare exactly by specification and
# expect this lint per site with a spec citation (docs/conventions.md).
float_cmp = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
zero_divided_by_zero = "deny"

# Correctness
fallible_impl_from = "deny"
recursive_format_impl = "deny"
infinite_iter = "deny"
unchecked_time_subtraction = "deny"

# Stack-overflow risk
large_stack_arrays = "deny"
large_stack_frames = "deny"

# Undefined behaviour (belt-and-braces alongside unsafe_code = "deny")
mem_replace_with_uninit = "deny"
uninit_assumed_init = "deny"
uninit_vec = "deny"

# Hygiene. Diagnostics belong in `tracing`; a binary's crate root may opt out of
# the print lints.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
let_underscore_must_use = "deny"
map_unwrap_or = "deny"
allow_attributes_without_reason = "deny"

# Concurrency and memory
await_holding_lock = "deny"
large_futures = "deny"
mem_forget = "deny"
mutex_atomic = "deny"
rc_buffer = "deny"

# Functions over 150 lines (threshold in .clippy.toml) need an explicit
# #[expect(clippy::too_many_lines, reason = "...")]; warn is enforced as deny
# by `-D warnings`.
too_many_lines = "warn"

module_name_repetitions = "allow"
similar_names = "allow"

[workspace.dependencies]
cc = { version = "=1.8.0", default-features = false }
criterion = { version = "=0.8.2", default-features = false }
junction = { version = "=2.1.0", default-features = false }
miniz_oxide = { version = "=0.9.1", default-features = false }
proptest = { version = "=1.11.0", default-features = false }
qc-edict = { path = "crates/qc-edict" }
qc-engines = { path = "crates/qc-engines" }
qc-builtins = { path = "crates/qc-builtins" }
qc-diag = { path = "crates/qc-diag" }
qc-lexer = { path = "crates/qc-lexer" }
qc-lno = { path = "crates/qc-lno" }
qc-preproc = { path = "crates/qc-preproc" }
qc-progs = { path = "crates/qc-progs" }
qc-project = { path = "crates/qc-project" }
qc-sema = { path = "crates/qc-sema" }
qc-syntax = { path = "crates/qc-syntax" }
qc-trace = { path = "crates/qc-trace" }
qc-types = { path = "crates/qc-types" }
qc-vm = { path = "crates/qc-vm" }
qs-bsp = { path = "crates/qs-bsp" }
qs-commands = { path = "crates/qs-commands" }
qs-log = { path = "crates/qs-log" }
qs-map = { path = "crates/qs-map" }
qs-mdl = { path = "crates/qs-mdl" }
qs-pak = { path = "crates/qs-pak" }
qs-paths = { path = "crates/qs-paths" }
qs-porting-example = { path = "crates/qs-porting-example" }
qs-settings = { path = "crates/qs-settings" }
qs-vfs = { path = "crates/qs-vfs" }
qs-wad = { path = "crates/qs-wad" }
qs-wav = { path = "crates/qs-wav" }
schemars = { version = "=1.2.2", default-features = false }
serde = { version = "=1.0.229", default-features = false }
serde_json = { version = "=1.0.151", default-features = false }
toml = { version = "=1.1.6", default-features = false }
tracing = { version = "=0.1.44", default-features = false }
tracing-subscriber = { version = "=0.3.23", default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1
# Differs from vouch (abort): the command guard catches a panic in one command
# and keeps the session alive (PRIN-7).
panic = "unwind"
# Differs from vouch ("z"): the editor, compiler and renderer are latency-bound.
opt-level = 3

# CI build-check profile: release codegen without fat LTO and a single codegen
# unit, which dominate wall-clock time.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16

# cargo mutants' profile (xtask readiness `mutation`): one incremental rebuild
# and one test run per mutant. No debug info builds faster, and opt-level 1
# runs the parser's property tests about five times faster than the test
# profile; debug assertions and overflow checks stay on, inherited from `test`.
[profile.mutants]
inherits = "test"
debug = "none"
opt-level = 1
