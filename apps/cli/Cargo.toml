[package]
name = "quakec-ide"
description = "QuakeC Studio's command line: build and check a QuakeC project, and run any command of the IDE by its id"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "quakec_ide"
path = "src/lib.rs"

[[bin]]
name = "quakec-ide"
path = "src/main.rs"

[dependencies]
# The global allocator (P4-18).
mimalloc = { workspace = true }
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
qs-commands = { workspace = true }
# mcp: the agent's tools over the Model Context Protocol (P4-13).
qs-mcp = { workspace = true }
# doctor: the games found, the preview host started on one, and the keychain (P4-18).
qs-engine = { workspace = true }
qs-install = { workspace = true }
qs-models = { workspace = true }
# mcp --connect: the running app's socket.
qs-paths = { workspace = true }
# new: the starter templates (P4-17).
qs-templates = { workspace = true }
qs-workbench = { workspace = true }
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
# The test project's system globals and fields, so the VM takes its program.
qc-edict = { workspace = true }
qc-types = { workspace = true }

[lints]
workspace = true
