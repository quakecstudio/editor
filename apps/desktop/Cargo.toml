[package]
name = "quakec-studio"
description = "QuakeC Studio, the desktop app: the window, its toolbar and its docked panels, on egui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "quakec_studio"
path = "src/lib.rs"

[[bin]]
name = "quakec-studio"
path = "src/main.rs"

[dependencies]
# The game palette the texture import's preview quantizes in (P6-16); the texture browser's
# tests write the WADs they browse (P6-10).
qs-wad = { workspace = true }
# The command line: the project to open.
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
# eframe's defaults without `default_fonts`, whose fonts are not bundled (ADR-0003, ADR-0010),
# with `accesskit` for screen readers (P2-23, #79): its Linux backend pulls in zvariant and
# zbus_names, whose RUSTSEC-2026-0370 to -0372 notices deny.toml ignores with their reasons.
eframe = { workspace = true, features = ["accesskit", "wayland", "wgpu", "x11"] }
# The PNG decoder, for the About window's icon; the map editor's texture import links it already.
image = { workspace = true, features = ["png"] }
# What an agent says is Markdown: the agent panel draws it (L-43).
pulldown-cmark = { workspace = true }
qc-project = { workspace = true }
qs-acp = { workspace = true }
qs-agent = { workspace = true }
# Base64, which a screenshot is attached to a thread in.
qs-bridge = { workspace = true }
# The map editor (P5-06): a shipped map's faces, the open map's brushes, the classes'
# models and the game's files they come from.
qs-bsp = { workspace = true }
qs-commands = { workspace = true }
qs-editor-view = { workspace = true }
# The game run in this window for the embedded game view (ADR-0028).
qs-engine = { workspace = true }
qs-game = { workspace = true }
qs-layout = { workspace = true }
qs-map = { workspace = true }
qs-mdl = { workspace = true }
qs-models = { workspace = true }
qs-log = { workspace = true }
qs-paths = { workspace = true }
qs-render = { workspace = true }
# The user's settings file, which keeps the chosen game folder (P3-44).
qs-settings = { workspace = true }
qs-templates = { workspace = true }
qs-update = { workspace = true }
qs-vfs = { workspace = true }
qs-workbench = { workspace = true }
qs-map-edit = { workspace = true }
qs-map-light = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
# Reads which characters a system font file covers, for the fallback (ADR-0003); egui reads
# fonts with it too.
skrifa = { workspace = true, features = ["std"] }
toml = { workspace = true, features = ["parse", "serde", "std"] }
tracing = { workspace = true, features = ["std"] }

# The system's Open Folder dialog, as Zed uses by default (`use_system_path_prompts`):
# NSOpenPanel on macOS, IFileOpenDialog on Windows, the xdg-desktop-portal file chooser on
# Linux, whose libdbus it loads when the dialog opens.
rfd = { workspace = true, features = ["xdg-portal"] }

[build-dependencies]
# The Windows .exe's icon and version information (build.rs).
winresource = { workspace = true }

[dev-dependencies]
# The offscreen snapshot harness (P2-21): egui's own, rendering through wgpu with no window and
# comparing PNGs.
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
# A level's BSP for a test game folder (the map tab's New Random Map).
qs-map-edit = { workspace = true, features = ["testing"] }
# The PAK that level is in, as the game keeps its levels.
qs-pak = { workspace = true }
# id's system globals and fields, which a program the simulation runs must declare (the Logic
# tab's test project).
qc-edict = { workspace = true }
qc-types = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true }
# The files Finder opens with the app (open_documents.rs): the delegate method winit 0.30 lacks,
# added between building eframe's event loop and running it.
objc2 = { workspace = true, features = ["std"] }
# NSWorkspace's Increase contrast and Reduce motion settings, which the theme follows (display.rs).
objc2-app-kit = { workspace = true, features = ["std", "NSAccessibility", "NSApplication", "NSMenu", "NSResponder", "NSWorkspace"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSEnumerator", "NSProcessInfo", "NSString", "NSURL"] }
winit = { workspace = true }

[lints]
workspace = true
