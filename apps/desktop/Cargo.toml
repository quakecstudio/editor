[package]
name = "quakec-studio"
description = "QuakeC Studio, the desktop app: the window, its toolbar and its docked panels, on egui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "quakec_studio"
path = "src/lib.rs"

[[bin]]
name = "quakec-studio"
path = "src/main.rs"

[dependencies]
# The command line: the project to open.
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
# eframe's defaults without `default_fonts`, whose fonts are not bundled (ADR-0003, ADR-0010),
# with `accesskit` for screen readers (P2-23, #79): its Linux backend pulls in zvariant and
# zbus_names, whose RUSTSEC-2026-0370 to -0372 notices deny.toml ignores with their reasons.
eframe = { workspace = true, features = ["accesskit", "wayland", "wgpu", "x11"] }
qs-agent = { workspace = true }
# The map editor (P5-06): a shipped map's faces, the open map's brushes, the classes'
# models and the game's files they come from.
qs-bsp = { workspace = true }
qs-commands = { workspace = true }
qs-editor-view = { workspace = true }
qs-layout = { workspace = true }
qs-map = { workspace = true }
qs-mdl = { workspace = true }
qs-models = { workspace = true }
qs-log = { workspace = true }
qs-paths = { workspace = true }
qs-render = { workspace = true }
# The user's settings file, which keeps the chosen game folder (P3-44).
qs-settings = { workspace = true }
qs-templates = { workspace = true }
qs-vfs = { workspace = true }
qs-workbench = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
# Reads which characters a system font file covers, for the fallback (ADR-0003); egui reads
# fonts with it too.
skrifa = { workspace = true, features = ["std"] }
toml = { workspace = true, features = ["parse", "serde", "std"] }
tracing = { workspace = true, features = ["std"] }

# The system's Open Folder dialog, as Zed uses by default (`use_system_path_prompts`):
# NSOpenPanel on macOS, IFileOpenDialog on Windows, the xdg-desktop-portal file chooser on
# Linux, whose libdbus it loads when the dialog opens.
rfd = { workspace = true, features = ["xdg-portal"] }

[dev-dependencies]
# The offscreen snapshot harness (P2-21): egui's own, rendering through wgpu with no window and
# comparing PNGs.
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
# The image a test renderer returns to egui_kittest, which the map view's needs to draw with a
# depth buffer.
image = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true }

[lints]
workspace = true
