[package]
name = "qs-workbench"
description = "The open project and file: the file tree, symbols and problems the panels list, and the commands that open a project or a file"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
qc-codegen = { workspace = true }
qc-engines = { workspace = true }
qc-ide = { workspace = true }
qc-progs = { workspace = true }
qc-sema = { workspace = true }
# project.info: the dialect a module is read in.
qc-syntax = { workspace = true }
qc-project = { workspace = true }
qs-commands = { workspace = true }
# checkpoint.*: the project's files as git objects, restored after an agent run (P4-05).
qs-checkpoint = { workspace = true }
qs-git = { workspace = true }
# edit.apply: the hunks of a staged change, the same line diff the editor shows (P4-04).
qs-diff = { workspace = true }
qs-engine = { workspace = true }
qs-install = { workspace = true }
qs-map = { workspace = true }
qs-map-bsp = { workspace = true }
qs-map-light = { workspace = true }
# map.run_profile: vis in a compile profile (P6-20).
qs-map-vis = { workspace = true }
# project.export: the assets packed into pak0.pak, and id's PAKs read to refuse their files
# (P4-28).
qs-pak = { workspace = true }
# scenario.run: the map, the game's files and the server simulation a scenario plays in
# (SCN-2.1).
qs-bsp = { workspace = true }
qs-sim = { workspace = true }
qs-vfs = { workspace = true }
qs-wad = { workspace = true }
image = { workspace = true, features = ["png"] }
# vm.run: a function called in the VM over the mock engine, with no map (P4-02).
qc-builtins = { workspace = true }
qc-edict = { workspace = true }
qc-types = { workspace = true }
qc-vm = { workspace = true }
# project.search: whole words and regular expressions (P4-33).
regex-lite = { workspace = true, features = ["std", "string"] }
schemars = { workspace = true, features = ["derive", "std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
# map.profiles: a project's compile-profiles.toml (P6-20).
toml = { workspace = true, features = ["parse", "serde", "std"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
# A fake preview host for the engine tools' tests, as qs-engine's tests serve one.
interprocess = { workspace = true }
qs-bridge = { workspace = true }
proptest = { workspace = true, features = ["std"] }
# A game folder for the scenario tests: its id1/pak0.pak.
qs-pak = { workspace = true }

[lints]
workspace = true
