[package]
name = "qs-client"
description = "The preview host's client: the server's messages read into entities, lights, particles, the view and the status bar, as id's cl_*.c, r_part.c, view.c and sbar.c keep them"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
qc-builtins = { workspace = true }
qc-vm = { workspace = true }
# A sound's entity, which the mixer takes as the client parses it.
qc-edict = { workspace = true }
# The lit map the light at a point is read from (REND-4.10).
qs-bsp = { workspace = true }
qs-mdl = { workspace = true }
# The protocols the server writes in and their codecs (NET-6), which the client reads.
qs-sim = { workspace = true }

[lints]
workspace = true
