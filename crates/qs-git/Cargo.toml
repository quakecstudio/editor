[package]
name = "qs-git"
description = "Git in the window: status, hunks to stage and unstage, commits, branches, file history, blame and merge conflicts, through the git command line"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# A hunk's and a conflict's index are commands' parameters in JSON.
schemars = { workspace = true, features = ["derive", "std"] }
serde = { workspace = true, features = ["derive", "std"] }

[dev-dependencies]
proptest = { workspace = true, features = ["std"] }

[lints]
workspace = true
