[package]
name = "qs-bench"
description = "The QuakeC Studio performance-budget benchmarks, run by cargo xtask bench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dev-dependencies]
criterion = { workspace = true }
eframe = { workspace = true }
qc-codegen = { workspace = true }
qc-progs = { workspace = true }
qc-project = { workspace = true }
qc-sema = { workspace = true }
quakec-studio = { workspace = true }
# save_to_game: the project built and reloaded in the windowed preview host (P3-12).
qs-workbench = { workspace = true }
# The routes: the preview host's --timerefresh report (P3-29).
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }

[[bench]]
name = "budgets"
harness = false

[lints]
workspace = true
