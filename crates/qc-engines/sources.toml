# The QuakeSpasm lineage's builtin tables, in C: fact-only sources by ADR-0016. Each file
# carries id's header granting the GPL "either version 2 of the License, or (at your option)
# any later version"; each repository's LICENSE.txt is the text of GPL version 2. The tables
# are read from C array initialisers by the columns given here (ENGT-2.11 to ENGT-2.17).
[[source]]
