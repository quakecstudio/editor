# SPDX-License-Identifier: GPL-3.0-or-later
#
# The fact sources of the engine-target database (P2-04, LANG-6). `cargo xtask engines`
# fetches each file at its pinned commit, checks it and its license file against the SHA-256
# below, extracts only facts from it (builtin names, numbers and signatures, and extension
# names) and writes `src/tables.rs`; `cargo xtask engines --check` fails when the checked-in
# tables differ from what the sources give. No comment text or code of these files is
# copied, and none of them is a porting upstream: ADR-0014 and ADR-0015 record the legal
# basis, and docs/spec/engine-targets.md the extraction rules (ENGT-2 to ENGT-4).
#
# `license` is the SPDX identifier of the repository's license file, `license_file`; of the
# source files only the rerelease's carries a license header of its own. Pins recorded on 2026-10-19.
#
# `tables` are the readings of the file: each gives the builtins and extension names of one
# module kind (`ssqc`, `csqc` or `menuqc`, PRJ-3.1), with `defines` the macros defined before
# the file is read, choosing the parts of a file that serves several module kinds for that
# kind (ENGT-2.3, ENGT-2.10).

[[source]]
id = "fteqw"
repo = "fte-team/fteqw"
commit = "f937b9d88f71fc4429db5fe56c6a98d922711b2e"
path = "quakec/menusys/fteextensions.qc"
sha256 = "21322f15aca52dae3a75b98a46be0491ed9a1f5d136511228bf52725ac81ccb0"
license = "GPL-2.0"
license_file = "LICENSE"
license_sha256 = "b1119350db1dc0964bf5a786784632fd7769d958c1166fd1bfc3e873f24ceccb"
tables = [
  { kind = "ssqc", defines = ["NQSSQC", "SSQC"] },
  { kind = "csqc", defines = ["CSQC"] },
  { kind = "menuqc", defines = ["MENU"] },
]

