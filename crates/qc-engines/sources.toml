# SPDX-License-Identifier: GPL-3.0-or-later
#
# The fact sources of the engine-target database (P2-04, LANG-6). `cargo xtask engines`
# fetches each file at its pinned commit, checks it and its license file against the SHA-256
# below, extracts only facts from it (builtin names, numbers and signatures, and extension
# names) and writes `src/tables.rs`; `cargo xtask engines --check` fails when the checked-in
# tables differ from what the sources give. No comment text or code of these files is
# copied, and none of them is a porting upstream: ADR-0014, ADR-0015 and ADR-0016 record the
# legal basis, and docs/spec/engine-targets.md the extraction rules (ENGT-2 to ENGT-4).
#
# `license` is the SPDX identifier of the license the source carries: the repository's
# license file, `license_file`, or the grant in the file's own header where it has one (the
# rerelease's and the C files'). Pins recorded on 2026-10-19.
#
# `tables` are the readings of the file: each gives the builtins and extension names of one
# module kind (`ssqc`, `csqc` or `menuqc`, PRJ-3.1). A QuakeC source's reading gives
# `defines`, the macros defined before the file is read, choosing the parts of a file that
# serves several module kinds for that kind (ENGT-2.3, ENGT-2.10). A C source's reading gives
# the `array` it reads and its columns (ENGT-2.11 to ENGT-2.17): `name`, `function`, `number`,
# `signature` and `extension` are column indices of a row (no `name` makes the array
# positional), `absent` the functions that stand for no builtin, `target` and `target_of` a
# name patch's target and the earlier source it is looked up in, and `extension_array` the
# array that lists extension names.

[[source]]
id = "fteqw"
repo = "fte-team/fteqw"
commit = "f937b9d88f71fc4429db5fe56c6a98d922711b2e"
path = "quakec/menusys/fteextensions.qc"
sha256 = "21322f15aca52dae3a75b98a46be0491ed9a1f5d136511228bf52725ac81ccb0"
license = "GPL-2.0"
license_file = "LICENSE"
license_sha256 = "b1119350db1dc0964bf5a786784632fd7769d958c1166fd1bfc3e873f24ceccb"
tables = [
  { kind = "ssqc", defines = ["NQSSQC", "SSQC"] },
  { kind = "csqc", defines = ["CSQC"] },
  { kind = "menuqc", defines = ["MENU"] },
]

