[package]
name = "qs-agent"
description = "The agent loop: plan, edit, compile, test and propose over the command registry, a run done only when the compile is clean and its tests pass"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# An entity's edict number.
qc-edict = { workspace = true }
qs-commands = { workspace = true }
qs-map = { workspace = true }
# The paths a call's arguments name, worked out by their text.
qs-paths = { workspace = true }
qs-settings = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
qc-types = { workspace = true }
qc-project = { workspace = true }
qs-pak = { workspace = true }
qs-vfs = { workspace = true }
qs-workbench = { workspace = true }

[lints]
workspace = true
