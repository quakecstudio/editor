[package]
name = "qs-render"
description = "The wgpu renderer: a BSP's world surfaces with their textures and lightmaps, drawn through egui_wgpu paint callbacks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
egui-wgpu = { workspace = true }
epaint = { workspace = true }
# The TGA faces of a skybox (REND-8.2), and the TGA, PNG and JPEG skins of an MD5 model
# (REND-12.4).
image = { workspace = true, features = ["jpeg", "png", "tga"] }
qs-bsp = { workspace = true }
qs-client = { workspace = true }
qs-mdl = { workspace = true }
qs-wad = { workspace = true }

[dev-dependencies]
# A headless wgpu device for the GPU tests.
egui_kittest = { workspace = true, features = ["wgpu"] }

[lints]
workspace = true
