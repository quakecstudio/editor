[package]
name = "qs-bridge"
description = "The IDE bridge protocol: framing, JSON-RPC messages, the session and its schemas, shared by the preview host and the IDE's client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Each command's parameters are checked against its schema before it runs (BRIDGE-4.2).
jsonschema = { workspace = true }
# `Applied`, the one type the host writes and the IDE reads and shows in its commands' schemas.
schemars = { workspace = true, features = ["derive", "std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
# The base64 encoder and decoder's round trip.
proptest = { workspace = true, features = ["std"] }

[lints]
workspace = true
