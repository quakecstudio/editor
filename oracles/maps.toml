# The map tool oracles (P6-03): id's qbsp, vis and light from qutils/ of Quake-Tools, and a
# pinned ericw-tools. cargo xtask oracles maps downloads each file or archive at its pinned
# commit and refuses it unless its SHA-256 matches; none of them is committed (LIC-7), and none
# is shipped. qutils/ is read and run here, never ported, until the license review rules on it
# (docs/porting.md, P4-22); ericw-tools is GPL-2.0-or-later and is only ever run. README.md,
# "The map tool oracles", describes the build.

[qutils]
id = "qutils"
repo = "id-Software/Quake-Tools"
commit = "c0d1b91c74eb654365ac7755bc837e497caaca73"

