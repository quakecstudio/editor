# FTEQCC, the command-line compiler of FTE's qclib, built without zlib (P1-26, LIC-8). It compiles
# the rerelease QuakeC, which id's qcc cannot. engine/qclib/LICENSE is the GPL version 2 text and
# the files carry no "or later" grant, so FTEQCC is only ever run as a separate program in CI,
# never linked into or shipped with anything of ours.
[[upstream]]
id = "fteqcc"
repo = "fte-team/fteqw"
commit = "f937b9d88f71fc4429db5fe56c6a98d922711b2e"

