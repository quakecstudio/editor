# pinned commit and refuses it unless its SHA-256 matches; none of them is committed (LIC-7).
# id's commits are the upstreams of docs/porting.md. FTEQCC is built, never ported: its commit is
# the one docs/spec/progs.md and docs/spec/lno.md cite. README.md describes the build.

