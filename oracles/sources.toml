# The VM oracle compiles WinQuake/pr_exec.c whole, and these functions of the other files,
# copied unchanged from the fetched file into a generated source file; oracles/vm/ holds the
# rest. Each is a function the mock engine runs exactly as id's server does (differential.md
# DIFF-1.3).

[[extract]]
file = "WinQuake/pr_edict.c"
functions = [
  "ED_ClearEdict", "ED_Alloc", "ED_Free", "ED_FindField", "ED_FindFunction", "ED_NewString",
  "ED_ParseEdict", "ED_LoadFromFile", "EDICT_NUM", "NUM_FOR_EDICT",
]

[[extract]]
file = "WinQuake/common.c"
functions = [
  "Q_atof", "COM_Parse", "SZ_Write", "MSG_WriteChar", "MSG_WriteByte", "MSG_WriteShort",
  "MSG_WriteLong", "MSG_WriteString", "MSG_WriteCoord", "MSG_WriteAngle",
]

[[extract]]
file = "WinQuake/mathlib.c"
functions = ["AngleVectors", "anglemod", "Length"]

[[extract]]
file = "WinQuake/sv_phys.c"
functions = ["SV_RunThink", "SV_Physics_Pusher"]

[[extract]]
