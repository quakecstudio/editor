# The VM oracle compiles WinQuake/pr_exec.c whole, and these functions of the other files,
# copied unchanged from the fetched file into a generated source file; oracles/vm/ holds the
# rest. Each is a function the mock engine runs exactly as id's server does (differential.md
# DIFF-1.3).

[[extract]]
file = "WinQuake/pr_edict.c"
functions = [
  "ED_ClearEdict", "ED_Alloc", "ED_Free", "ED_FindField", "ED_FindFunction", "ED_NewString",
  "ED_ParseEdict", "ED_LoadFromFile", "EDICT_NUM", "NUM_FOR_EDICT",
]

[[extract]]
file = "WinQuake/common.c"
functions = [
  "Q_atof", "COM_Parse", "SZ_Write", "MSG_WriteChar", "MSG_WriteByte", "MSG_WriteShort",
  "MSG_WriteLong", "MSG_WriteString", "MSG_WriteCoord", "MSG_WriteAngle",
]

[[extract]]
file = "WinQuake/mathlib.c"
functions = ["AngleVectors", "anglemod", "Length"]

[[extract]]
file = "WinQuake/sv_phys.c"
functions = ["SV_RunThink", "SV_Physics_Pusher"]

[[extract]]
file = "WinQuake/sv_main.c"
functions = ["SV_StartParticle", "SV_StartSound", "SV_ModelIndex"]

[[extract]]
file = "WinQuake/pr_cmds.c"
functions = [
  "PF_makevectors", "PF_setorigin", "SetMinMaxSize", "PF_setsize", "PF_setmodel", "PF_bprint",
  "PF_sprint", "PF_centerprint", "PF_normalize", "PF_vlen", "PF_vectoyaw", "PF_vectoangles",
  "PF_random", "PF_particle", "PF_ambientsound", "PF_sound", "PF_traceline", "PF_stuffcmd",
  "PF_localcmd", "PF_cvar", "PF_cvar_set", "PF_findradius", "PF_fabs", "PF_Spawn",
  "PF_Remove", "PF_Find", "PR_CheckEmptyString", "PF_precache_file", "PF_precache_sound",
  "PF_precache_model", "PF_lightstyle", "PF_rint", "PF_floor", "PF_ceil", "PF_checkbottom",
  "PF_pointcontents", "PF_nextent", "PF_changeyaw", "WriteDest", "PF_WriteByte",
  "PF_WriteChar", "PF_WriteShort", "PF_WriteLong", "PF_WriteAngle", "PF_WriteCoord",
  "PF_makestatic", "PF_setspawnparms", "PF_changelevel", "PF_Fixme",
]

# The engine oracle's functions of id's host.c and view.c, which the server calls and which
# their files keep beside the client's (oracles/engine/extracted.h declares what they read at
# file scope).
[[extract]]
oracle = "engine"
file = "WinQuake/host.c"
functions = [
  "SV_ClientPrintf", "SV_BroadcastPrintf", "Host_ClientCommands", "SV_DropClient",
  "Host_ShutdownServer", "Host_ClearMemory",
]

[[extract]]
oracle = "engine"
file = "WinQuake/view.c"
functions = ["V_CalcRoll"]
