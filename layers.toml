# Every workspace crate and its layer. `cargo xtask layers` fails when a crate
# is missing here or depends on a crate in a higher layer; docs/layers.md
# explains the model. Layers rank L0 to L7, then apps; tests and tooling crates
# may depend on anything, and nothing may depend on them.

[crates]
qc-edict = "L1"
qc-engines = "L3"
qc-ide = "L3"
quakec-ide = "apps"
quakec-lsp = "apps"
quakec-studio = "apps"
quakec-engine = "apps"
qc-builtins = "L1"
qc-codegen = "L4"
qs-map-bsp = "L4"
qs-map-light = "L4"
qc-diag = "L0"
qc-lexer = "L2"
qc-lno = "L0"
qc-preproc = "L2"
qc-progs = "L0"
qc-project = "L2"
qc-sema = "L3"
qc-syntax = "L2"
qc-trace = "L1"
qc-types = "L0"
qc-vm = "L1"
qs-bench = "tests"
qs-bsp = "L0"
qs-agent = "L6"
qs-commands = "L5"
qs-templates = "L5"
qs-checkpoint = "L0"
qs-mcp = "L6"
qs-models = "L6"
qs-diff = "L0"
qs-layout = "L5"
qs-settings = "L5"
qs-workbench = "L5"
qs-bridge = "L4"
qs-engine = "L4"
qs-client = "L4"
qs-sim = "L4"
qs-sound = "L4"
qs-differential = "tests"
qs-install = "L0"
qs-git = "L0"
