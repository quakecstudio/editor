title = "Build a donut-shaped room"
template = "id1"
prompt = "maps/donut.map holds only its world. Build a donut-shaped room in it: a closed ring of floor, walls and ceiling around a solid square pillar, with a player start in the ring and four lights, then save the map. It must compile with no leak."
turns = 40
runs = 1
threshold = 1
files = ["maps/donut.map"]

# P6-21, MAP-29: the agent builds level geometry, not only entities. The saved map holds a player
# start and four lights and compiles with no leak (P6-13), which with the start in the ring means
# the ring is sealed and the game has somewhere to put the player.
[[map]]
file = "maps/donut.map"
classname = "info_player_start"
count = 1

[[map]]
file = "maps/donut.map"
classname = "light"
count = 4

[[sealed]]
file = "maps/donut.map"

[[solution]]
file = "maps/donut.map"
find = "\"classname\" \"worldspawn\"\n}\n"
replace = """"classname" "worldspawn"
