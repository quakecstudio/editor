name: release

# The release (P4-18, #129). Its name, `release`, is part of the OIDC subject Azure trusts for
# Windows signing (`...:workflow:release:ref_type:tag`, smoketurner-infra's
# environments/azure/code_signing.tf): the subject names the calling workflow, not the reusable
# one, so renaming this workflow breaks Windows signing. A `v*` tag, or a run started by hand,
# builds and signs every package in the reusable workflow .github/workflows/reusable-build.yml,
# which attests each one; installs each package on a clean runner and checks it there with `quakec-ide doctor`;
# and writes SHA256SUMS. A tag also publishes the packages as a GitHub release, a pre-release
# when the tag has a `-` (v2026.11.1-rc1), and regenerates the compatibility list. A tag
# with no `-` then reaches the package managers too (P4-40): the debs and rpms go to
# packages.quakecstudio.com, the cask to the Homebrew tap and the MSIs to winget. A run by
# hand, or by a pull request that changes the packaging, is the dry run: everything but
# publishing, the packages kept as its `release` artifact.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  # A pull request that changes the packaging runs the dry run, so a change to it is checked
  # before it reaches a tag; a fork's has no signing secrets and fails at the secrets check.
  pull_request:
    paths:
      - packaging/**
      - .github/workflows/release.yml
      - .github/workflows/reusable-build.yml

permissions: {}

# A newer push to a pull request replaces its dry run; a tag's run is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    # The `./` form GitHub documents for a workflow in the same repository and commit;
    # actionlint rejects zizmor's suggested `$/` form.
    uses: ./.github/workflows/reusable-build.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets:
      APPLE_APPLICATION_CERTIFICATE_PEM: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_PEM }}
      APPLE_APPLICATION_KEY_PEM: ${{ secrets.APPLE_APPLICATION_KEY_PEM }}
      APPLE_APPLICATION_IDENTITY: ${{ secrets.APPLE_APPLICATION_IDENTITY }}
      APPLE_INSTALLER_CERTIFICATE_PEM: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PEM }}
      APPLE_INSTALLER_KEY_PEM: ${{ secrets.APPLE_INSTALLER_KEY_PEM }}
      APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      CERTIFICATE_PROFILE: ${{ secrets.CERTIFICATE_PROFILE }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  # LibreQuake's game data, which the install tests start the preview host on.
  game:
    name: Fetch LibreQuake for the install tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - name: Fetch the test assets
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          export QS_TEST_ASSETS="$RUNNER_TEMP_DIR/test-assets"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev
          cargo xtask assets fetch
          mv "$QS_TEST_ASSETS/librequake-lite" librequake-lite
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: librequake-lite
          path: librequake-lite
          if-no-files-found: error

  # Each package installed on a runner that has never built the app, then checked: the
  # preview host started headless on LibreQuake and stopped (`quakec-ide doctor --check
  # host`), and the app's window open after fifteen seconds.
  install-macos:
    name: Install on macOS
    needs: [build, game]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-macos
          path: dist
      - uses: actions/download-artifact@v8.0.2
        with:
          name: librequake-lite
          path: librequake-lite
      # The installer package, checked and installed as a person's double-click would.
      - name: Install the package
        run: |
          pkg=$(ls dist/*.pkg)
          pkgutil --check-signature "$pkg"
          spctl --assess --type install --verbose=4 "$pkg"
          xcrun stapler validate "$pkg"
          sudo installer -pkg "$pkg" -target /
          app="/Applications/QuakeC Studio.app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          # Every executable inside is signed with the hardened runtime, not only the app.
          for name in quakec-studio quakec-engine quakec-ide quakec-lsp; do
            codesign --verify --strict --verbose=2 "$app/Contents/MacOS/$name"
            codesign --display --verbose=2 "$app/Contents/MacOS/$name" 2>&1 | grep -q "flags=.*runtime"
          done
      # quakec-ide runs from the PATH, through the package's link in /usr/local/bin.
      - name: Check the install
        run: |
          test "$(readlink /usr/local/bin/quakec-lsp)" = "/Applications/QuakeC Studio.app/Contents/MacOS/quakec-lsp"
          quakec-ide --version
          quakec-ide doctor --check host --game librequake-lite
      - name: Open the app
        run: |
          open "/Applications/QuakeC Studio.app"
          sleep 15
          pgrep -x quakec-studio
          pkill -x quakec-studio

  install-windows:
    name: Install on Windows (${{ matrix.arch }})
    needs: [build, game]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@v8.0.2
        with:
          name: librequake-lite
          path: librequake-lite
      - name: Install the MSI, as a person does
        run: |
          $msi = (Get-ChildItem dist/*.msi).FullName
          $install = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v msi.log" -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content msi.log -Tail 50; throw "msiexec: $($install.ExitCode)" }
      - name: Check the install
        run: |
          $folder = "$env:ProgramFiles\QuakeC Studio"
          & "$folder\quakec-ide.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "quakec-ide --version: $LASTEXITCODE" }
          & "$folder\quakec-ide.exe" doctor --check host --game librequake-lite
          if ($LASTEXITCODE -ne 0) { throw "quakec-ide doctor: $LASTEXITCODE" }
          $path = [Environment]::GetEnvironmentVariable("PATH", "Machine")
          if (-not $path.Contains($folder)) { throw "the install folder is not on PATH" }
      - name: Open the app
        run: |
          $app = Start-Process "$env:ProgramFiles\QuakeC Studio\quakec-studio.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "the app exited with $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - name: Check the portable zip
        run: |
          Expand-Archive (Get-ChildItem dist/*.zip).FullName -DestinationPath portable
          $ide = (Get-ChildItem portable -Recurse -Filter quakec-ide.exe).FullName
          & $ide doctor --check host --game librequake-lite
          if ($LASTEXITCODE -ne 0) { throw "quakec-ide doctor: $LASTEXITCODE" }

  install-linux:
    name: Install on Linux (${{ matrix.arch }})
    needs: [build, game]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      # The Steam library fixture the Flatpak's check plays in (packaging/linux/steam).
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@v8.0.2
        with:
          name: librequake-lite
          path: librequake-lite
      - name: Install the deb and check it
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/*.deb xvfb mesa-vulkan-drivers
          quakec-ide --version
          quakec-ide doctor --check host --game librequake-lite
      - name: Open the app from the deb
        run: |
          xvfb-run -a quakec-studio &
          sleep 15
          pgrep -x quakec-studio
          pkill -x quakec-studio
      # The rpm's signature is checked against the key packages.quakecstudio.com serves, the
      # one a person's dnf fetches, before the rpm is installed.
      - name: Install the rpm on Fedora and check it
        run: |
          docker run --rm -v "$PWD:/work" -w /work fedora:41 bash -euc '
            rpmkeys --import https://packages.quakecstudio.com/gpg/quakecstudio.asc
            rpm --checksig ./dist/*.rpm
            dnf install -y ./dist/*.rpm
            quakec-ide --version
            quakec-ide doctor --check host --game librequake-lite
          '
      - name: Check the AppImage
        run: |
          appimage=$(echo dist/*.AppImage)
          chmod +x "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" quakec-ide doctor --check host --game librequake-lite
      # From inside the Flatpak's sandbox: Steam's library found (a Steam folder holding
      # LibreQuake as Quake), the preview host started on it, and the keychain through the
      # Secret Service, here gnome-keyring in the session the run starts.
      - name: Install the Flatpak and check it from its sandbox
        run: |
          sudo apt-get install -y --no-install-recommends flatpak gnome-keyring dbus-x11
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive ./dist/*.flatpak
          steam="$HOME/.local/share/Steam"
          mkdir -p "$steam/steamapps/common"
          cp -R librequake-lite "$steam/steamapps/common/Quake"
          sed "s#@STEAM@#$steam#" packaging/linux/steam/libraryfolders.vdf \
            > "$steam/steamapps/libraryfolders.vdf"
          cp packaging/linux/steam/appmanifest_2310.acf "$steam/steamapps/"
          dbus-run-session -- bash -euc '
            # A keyring made with an empty password stays unusable to the Secret Service
            # ("result not returned from SS API"), so this throwaway one gets a password.
            echo -n "install-test" | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            flatpak run --command=quakec-ide com.quakecstudio.QuakeCStudio doctor --require-game
          '

  # Every package's SHA-256; on a tag, the packages published as a release. Each package's
  # attestation is the reusable build's.
  release:
    name: Checksums and publish
    needs: [build, install-macos, install-windows, install-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      macos_sha256: ${{ steps.sums.outputs.macos_sha256 }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      # The macOS package's sum is also the Homebrew cask's.
      - name: Write SHA256SUMS
        id: sums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          echo "macos_sha256=$(awk '$2 ~ /-macos-arm64\.pkg$/ { print $1 }' SHA256SUMS)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release
          path: dist
          if-no-files-found: error
      - name: Publish the release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$REPO" --verify-tag "${prerelease[@]}" \
            --title "QuakeC Studio $TAG" \
            --notes "QuakeC Studio $VERSION, built from $TAG. The source is the tag's commit; every package holds LICENSE, NOTICE and THIRD-PARTY. Check a file with \`gh attestation verify <file> --repo $REPO --signer-workflow $REPO/.github/workflows/reusable-build.yml\`. The Windows executables are signed; the MSI around them is not." \
            dist/*

  # The package managers (P4-40, docs/releasing.md). Each of the three jobs below runs after
  # the GitHub release is made, so none names a file that cannot be downloaded yet, and only
  # a tag with no `-` publishes: a pre-release reaches none of them. The first two also run in
  # the dry run and for a pre-release, doing everything but the push.

  # The debs and rpms added to the APT and YUM/DNF repository in quakecstudio/packages, its
  # metadata written and signed again, and the commit pushed with PACKAGES_DEPLOY_KEY, a
  # deploy key with write access to that one repository. A push made with a deploy key,
  # unlike one made with GITHUB_TOKEN, starts that repository's workflow, which copies it to
  # packages.quakecstudio.com.
  packages:
    name: Add to packages.quakecstudio.com
    needs: [build, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # One tag's push at a time; a dry run never waits on, or replaces, a tag's.
    concurrency:
      group: ${{ github.ref_type == 'tag' && 'release-packages' || format('release-packages-{0}', github.ref) }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PUBLISH: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-linux-*
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v7.0.1
        with: # zizmor: ignore[artipacked] the deploy key pushes the commit below
          repository: quakecstudio/packages
          ssh-key: ${{ secrets.PACKAGES_DEPLOY_KEY }}
          path: packages-repository
      - name: Install the repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils createrepo-c
      - name: Add the packages and sign the metadata
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: packaging/linux/repository.sh dist packages-repository
      - name: Commit, and push on a release
        working-directory: packages-repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "quakec-studio $VERSION"
          git show --stat --format=%s HEAD
          if [ "$PUBLISH" = true ]; then
            git push
          else
            echo "not a release: the commit is not pushed"
          fi

  # packaging/homebrew/quakec-studio.rb with this release's version and the macOS package's
  # SHA-256, written to Casks/quakec-studio.rb in quakecstudio/homebrew-tap and pushed with
  # HOMEBREW_TAP_DEPLOY_KEY, a deploy key with write access to that one repository.
  homebrew:
    name: Update the Homebrew tap
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.ref_type == 'tag' && 'release-homebrew' || format('release-homebrew-{0}', github.ref) }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      SHA256: ${{ needs.release.outputs.macos_sha256 }}
      PUBLISH: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with: # zizmor: ignore[artipacked] the deploy key pushes the commit below
          repository: quakecstudio/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap
      - name: Write the cask
        run: |
          if ! [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::SHA256SUMS has no sum for the macOS package"
            exit 1
          fi
          cask=homebrew-tap/Casks/quakec-studio.rb
          mkdir -p homebrew-tap/Casks
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA256/" \
            packaging/homebrew/quakec-studio.rb > "$cask"
          if grep -n '@[A-Z0-9]*@' "$cask"; then
            echo "::error::the cask still has a placeholder"
            exit 1
          fi
          ruby -c "$cask"
          cat "$cask"
      - name: Commit, and push on a release
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/quakec-studio.rb
          git commit -m "quakec-studio $VERSION"
          git show --stat --format=%s HEAD
          if [ "$PUBLISH" = true ]; then
            git push
          else
            echo "not a release: the commit is not pushed"
          fi

  # The two MSIs submitted to winget with komac, which writes the manifests from the
  # release's files, pushes them to the fork quakecstudio/winget-pkgs and opens a pull
  # request against microsoft/winget-pkgs as the owner of WINGET_TOKEN. Microsoft reviews
  # and merges that pull request in its own time, so a failure here does not fail the
  # release, and nothing of it can run before the release's files are public: there is no
  # dry run. komac updates a package winget already lists; the first version is submitted by
  # hand (docs/releasing.md).
  winget:
    name: Submit to winget
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions: {}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      KOMAC_VERSION: 2.17.2
      KOMAC_SHA256: b03b020eec98acfb0b53e284a6e21815b884be33de6785b97e7a120f0e748966
      KOMAC_FORK_OWNER: quakecstudio
      KOMAC_CREATED_WITH: quakecstudio/editor release workflow
    steps:
      - name: Install komac
        run: |
          archive="komac-$KOMAC_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/russellbanks/Komac/releases/download/v$KOMAC_VERSION/$archive"
          echo "$KOMAC_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive"
          sudo install -m755 komac /usr/local/bin/komac
          komac --version
      - name: Bring the fork up to date
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: komac sync-fork
      - name: Submit the release
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          files="https://github.com/$REPO/releases/download/$TAG"
          komac update QuakeCStudio.QuakeCStudio --version "$VERSION" \
            --urls "$files/quakec-studio-$VERSION-windows-x64.msi" \
            "$files/quakec-studio-$VERSION-windows-arm64.msi" \
            --release-notes-url "https://github.com/$REPO/releases/tag/$TAG" \
            --submit

  # P4-21 (COMP-9): every release regenerates the compatibility list from the conformance
  # corpus, attaches it, and fails when the list on the tagged commit is out of date, so the
  # list published with a release is the one its code earns. It needs no signing secret.
  compatibility:
    name: Regenerate the compatibility list
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - name: Point QS_TEST_ASSETS outside the source tree
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: echo "QS_TEST_ASSETS=$RUNNER_TEMP_DIR/test-assets" >> "$GITHUB_ENV"
      - name: Fetch the conformance corpus
        run: cargo xtask corpus fetch
      - name: Write the compatibility list
        run: |
          cargo xtask compatibility
          cat docs/compatibility.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: compatibility
          path: docs/compatibility.md
          if-no-files-found: error
      - name: The tagged commit has this list
        run: |
          if ! git diff --exit-code -- docs/compatibility.md; then
            echo "::error::docs/compatibility.md is out of date: commit the list this job attached, then tag again"
            exit 1
          fi
