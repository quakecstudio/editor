name: release

# The release (P4-18, #129). Its name, `release`, is part of the OIDC subject Azure trusts for
# Windows signing (`...:workflow:release:ref_type:tag`, smoketurner-infra's
# environments/azure/code_signing.tf): the subject names the calling workflow, not the reusable
# one, so renaming this workflow breaks Windows signing. A `v*` tag, or a run started by hand,
# builds and signs every package in the reusable workflow .github/workflows/reusable-build.yml,
# which attests each one; installs each package on a clean runner and checks it there with `quakec-ide doctor`;
# and writes SHA256SUMS. A tag also publishes the packages as a GitHub release, a pre-release
# when the tag has a `-` (v2026.11.0-rc1), and regenerates the compatibility list. A run by
# hand, or by a pull request that changes the packaging, is the dry run: everything but
# publishing, the packages kept as its `release` artifact.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  # A pull request that changes the packaging runs the dry run, so a change to it is checked
  # before it reaches a tag; a fork's has no signing secrets and fails at the secrets check.
  pull_request:
    paths:
      - packaging/**
      - .github/workflows/release.yml
      - .github/workflows/reusable-build.yml

permissions: {}

# A newer push to a pull request replaces its dry run; a tag's run is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    # The `./` form GitHub documents for a workflow in the same repository and commit;
    # actionlint rejects zizmor's suggested `$/` form.
    uses: ./.github/workflows/reusable-build.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE_NAME: ${{ secrets.APPLE_CERTIFICATE_NAME }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      CERTIFICATE_PROFILE: ${{ secrets.CERTIFICATE_PROFILE }}

  # LibreQuake's game data, which the install tests start the preview host on.
  game:
    name: Fetch LibreQuake for the install tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - name: Fetch the test assets
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          export QS_TEST_ASSETS="$RUNNER_TEMP_DIR/test-assets"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev
          cargo xtask assets fetch
          mv "$QS_TEST_ASSETS/librequake-lite" librequake-lite
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: librequake-lite
          path: librequake-lite
          if-no-files-found: error

  # Each package installed on a runner that has never built the app, then checked: the
  # preview host started headless on LibreQuake and stopped (`quakec-ide doctor --check
  # host`), and the app's window open after fifteen seconds.
  install-macos:
    name: Install on macOS
    needs: [build, game]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: librequake-lite
          path: librequake-lite
      - name: Install the app from the disk image, as a person does
        run: |
          xcrun stapler validate dist/*.dmg
          hdiutil attach dist/*.dmg -mountpoint /Volumes/QuakeCStudio -nobrowse
          cp -R "/Volumes/QuakeCStudio/QuakeC Studio.app" /Applications/
          hdiutil detach /Volumes/QuakeCStudio
          app="/Applications/QuakeC Studio.app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          # Every executable inside is signed with the hardened runtime, not only the app.
          for name in quakec-studio quakec-engine quakec-ide quakec-lsp; do
            codesign --verify --strict --verbose=2 "$app/Contents/MacOS/$name"
            codesign --display --verbose=2 "$app/Contents/MacOS/$name" 2>&1 | grep -q "flags=.*runtime"
          done
      - name: Check the install
        run: |
          macos="/Applications/QuakeC Studio.app/Contents/MacOS"
          "$macos/quakec-ide" --version
          "$macos/quakec-ide" doctor --check host --game librequake-lite
      - name: Open the app
        run: |
          open "/Applications/QuakeC Studio.app"
          sleep 15
          pgrep -x quakec-studio
          pkill -x quakec-studio

  install-windows:
    name: Install on Windows (${{ matrix.arch }})
    needs: [build, game]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: librequake-lite
          path: librequake-lite
      - name: Install the MSI, as a person does
        run: |
          $msi = (Get-ChildItem dist/*.msi).FullName
          $install = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v msi.log" -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content msi.log -Tail 50; throw "msiexec: $($install.ExitCode)" }
      - name: Check the install
        run: |
          $folder = "$env:ProgramFiles\QuakeC Studio"
          & "$folder\quakec-ide.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "quakec-ide --version: $LASTEXITCODE" }
          & "$folder\quakec-ide.exe" doctor --check host --game librequake-lite
          if ($LASTEXITCODE -ne 0) { throw "quakec-ide doctor: $LASTEXITCODE" }
          $path = [Environment]::GetEnvironmentVariable("PATH", "Machine")
          if (-not $path.Contains($folder)) { throw "the install folder is not on PATH" }
      - name: Open the app
        run: |
          $app = Start-Process "$env:ProgramFiles\QuakeC Studio\quakec-studio.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "the app exited with $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - name: Check the portable zip
        run: |
          Expand-Archive (Get-ChildItem dist/*.zip).FullName -DestinationPath portable
          $ide = (Get-ChildItem portable -Recurse -Filter quakec-ide.exe).FullName
          & $ide doctor --check host --game librequake-lite
          if ($LASTEXITCODE -ne 0) { throw "quakec-ide doctor: $LASTEXITCODE" }

  install-linux:
    name: Install on Linux (${{ matrix.arch }})
    needs: [build, game]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      # The Steam library fixture the Flatpak's check plays in (packaging/linux/steam).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: librequake-lite
          path: librequake-lite
      - name: Install the deb and check it
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/*.deb xvfb mesa-vulkan-drivers
          quakec-ide --version
          quakec-ide doctor --check host --game librequake-lite
      - name: Open the app from the deb
        run: |
          xvfb-run -a quakec-studio &
          sleep 15
          pgrep -x quakec-studio
          pkill -x quakec-studio
      - name: Install the rpm on Fedora and check it
        run: |
          docker run --rm -v "$PWD:/work" -w /work fedora:41 bash -euc '
            dnf install -y ./dist/*.rpm
            quakec-ide --version
            quakec-ide doctor --check host --game librequake-lite
          '
      - name: Check the AppImage
        run: |
          appimage=$(echo dist/*.AppImage)
          chmod +x "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" quakec-ide doctor --check host --game librequake-lite
      # From inside the Flatpak's sandbox: Steam's library found (a Steam folder holding
      # LibreQuake as Quake), the preview host started on it, and the keychain through the
      # Secret Service, here gnome-keyring in the session the run starts.
      - name: Install the Flatpak and check it from its sandbox
        run: |
          sudo apt-get install -y --no-install-recommends flatpak gnome-keyring dbus-x11
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive ./dist/*.flatpak
          steam="$HOME/.local/share/Steam"
          mkdir -p "$steam/steamapps/common"
          cp -R librequake-lite "$steam/steamapps/common/Quake"
          sed "s#@STEAM@#$steam#" packaging/linux/steam/libraryfolders.vdf \
            > "$steam/steamapps/libraryfolders.vdf"
          cp packaging/linux/steam/appmanifest_2310.acf "$steam/steamapps/"
          dbus-run-session -- bash -euc '
            # A keyring made with an empty password stays unusable to the Secret Service
            # ("result not returned from SS API"), so this throwaway one gets a password.
            echo -n "install-test" | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            flatpak run --command=quakec-ide com.quakecstudio.QuakeCStudio doctor --require-game
          '

  # Every package's SHA-256; on a tag, the packages published as a release. Each package's
  # attestation is the reusable build's.
  release:
    name: Checksums and publish
    needs: [build, install-macos, install-windows, install-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist
          if-no-files-found: error
      - name: Publish the release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$REPO" --verify-tag "${prerelease[@]}" \
            --title "QuakeC Studio $TAG" \
            --notes "QuakeC Studio $VERSION, built from $TAG. The source is the tag's commit; every package holds LICENSE and NOTICE. Check a file with \`gh attestation verify <file> --repo $REPO --signer-workflow $REPO/.github/workflows/reusable-build.yml\`. The Windows executables are signed; the MSI around them is not." \
            dist/*

  # P4-21 (COMP-9): every release regenerates the compatibility list from the conformance
  # corpus, attaches it, and fails when the list on the tagged commit is out of date, so the
  # list published with a release is the one its code earns. It needs no signing secret.
  compatibility:
    name: Regenerate the compatibility list
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - name: Point QS_TEST_ASSETS outside the source tree
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: echo "QS_TEST_ASSETS=$RUNNER_TEMP_DIR/test-assets" >> "$GITHUB_ENV"
      - name: Fetch the conformance corpus
        run: cargo xtask corpus fetch
      - name: Write the compatibility list
        run: |
          cargo xtask compatibility
          cat docs/compatibility.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility
          path: docs/compatibility.md
          if-no-files-found: error
      - name: The tagged commit has this list
        run: |
          if ! git diff --exit-code -- docs/compatibility.md; then
            echo "::error::docs/compatibility.md is out of date: commit the list this job attached, then tag again"
            exit 1
          fi
