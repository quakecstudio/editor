name: Sign

# P0-23 (#23): signs the desktop app on macOS (codesign with the hardened runtime, then
# notarytool) and on Windows (Azure Trusted Signing over OIDC through aas-sign), the way
# vouch-sh/vouch's reusable-build.yml does, then attests each signed binary with GitHub's
# artifact attestations. It is a standalone workflow, not one another workflow calls, so that
# every attestation names this file as its signer:
#   gh attestation verify <binary> --repo quakecstudio/editor \
#     --signer-workflow quakecstudio/editor/.github/workflows/sign.yml
# The secrets are the repository-level ones docs/releasing.md lists.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  secrets:
    name: Signing secrets are set
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check each secret docs/releasing.md lists is set, printing no value
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE_NAME: ${{ secrets.APPLE_CERTIFICATE_NAME }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          CERTIFICATE_PROFILE: ${{ secrets.CERTIFICATE_PROFILE }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD \
            APPLE_CERTIFICATE_NAME MACOS_KEYCHAIN_PASSWORD APPLE_ID APPLE_ID_PASSWORD \
            APPLE_TEAM_ID AZURE_CLIENT_ID AZURE_TENANT_ID TRUSTED_SIGNING_ENDPOINT \
            TRUSTED_SIGNING_ACCOUNT CERTIFICATE_PROFILE; do
            if [ -z "${!name}" ]; then
              echo "::error::the secret $name is not set"
              missing=1
            else
              echo "ok    $name is set"
            fi
          done
          exit "$missing"

  macos:
    name: Sign, notarize and attest on macOS
    needs: secrets
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - name: Build the desktop app
        run: cargo build --release --locked -p quakec-studio
      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
      - name: Code sign macOS binaries
        env:
          APPLE_CERTIFICATE_NAME: ${{ secrets.APPLE_CERTIFICATE_NAME }}
        run: |
          /usr/bin/codesign --force --sign "$APPLE_CERTIFICATE_NAME" \
            --options runtime --timestamp target/release/quakec-studio
          /usr/bin/codesign --verify --strict --verbose=2 target/release/quakec-studio
      - name: Notarize macOS binaries
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_ID_PASSWORD"
          mkdir -p notarize-staging
          cp target/release/quakec-studio notarize-staging/
          ditto -c -k --keepParent notarize-staging quakec-studio-notarize.zip
          xcrun notarytool submit quakec-studio-notarize.zip \
            --keychain-profile "notarytool-profile" --wait
          rm -rf notarize-staging quakec-studio-notarize.zip
      - name: Attest the signed binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release/quakec-studio
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quakec-studio-macos
          path: target/release/quakec-studio
          if-no-files-found: error
      - name: Cleanup macOS keychain
        if: ${{ always() }}
        run: security delete-keychain build.keychain 2>/dev/null || true

  windows:
    name: Sign and attest on Windows
    needs: secrets
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - name: Build the desktop app
        run: cargo build --release --locked -p quakec-studio
      # If the OIDC login fails because no federated credential trusts quakecstudio/editor,
      # the subject to add is escalated to Justin (#23), not worked around.
      - name: Code sign Windows binaries
        uses: skeeto/aas-sign@058700fb89886acfce8d1cc511d69a11eb8f9862 # v1.1.1
        with:
          version: v1.1.0
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          account: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          profile: ${{ secrets.CERTIFICATE_PROFILE }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          files: |
            target/release/quakec-studio.exe
      - name: Check the signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature target/release/quakec-studio.exe
          if ($signature.Status -ne 'Valid') { throw "the signature is $($signature.Status)" }
          "ok    signed by $($signature.SignerCertificate.Subject)"
      - name: Attest the signed binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release/quakec-studio.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quakec-studio-windows
          path: target/release/quakec-studio.exe
          if-no-files-found: error
