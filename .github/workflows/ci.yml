# CI for every pull request and every merge-queue group (docs/conventions.md,
# CONV-7). Each job name below is a required status check in the `main` ruleset
# (docs/ci.md), so every job runs on merge_group events and keeps a static name:
# renaming a job means changing the ruleset too.
#
# A change whose every file is on the light allowlist of scripts/ci-changes.sh
# (documentation, the plan, agent files) takes the light path: each required
# job still reports success under its name, but only the cargo xtask ci job and
# xtask's own tests, the only checks that read those files, do their work
# (docs/ci.md, "Light changes").
#
# Caches are saved only by runs on main (github.ref == 'refs/heads/main'): a
# cache saved in a pull request or merge group run is scoped to its ref and no
# other pull request or queue run can restore it. The merge group has already
# checked what lands on main, so a run on main is there to fill the caches: it
# runs the pull request's jobs except Format and cargo-deny, which save none,
# and only when a file that decides a cache key changes (the push paths below
# mirror every key's hashFiles and Swatinem/rust-cache's inputs), weekly in
# case a cache was evicted, and on demand.
name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - fuzz/Cargo.lock
      - "**/Cargo.toml"
      - .cargo/config.toml
      - rust-toolchain.toml
      - oracles/**
      - xtask/src/oracles.rs
      - xtask/src/oracles/**
      - corpus/manifest.toml
      - .github/workflows/ci.yml
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

# A newer push to a pull request supersedes its older run; a run on main is
# never cancelled once it starts, so it finishes saving its caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Deny rustc warnings on plain `cargo build` and `cargo test` without
  # invalidating the build cache, as RUSTFLAGS="-D warnings" would.
  CARGO_BUILD_WARNINGS: deny

jobs:
  # Decides whether this run takes the full path or the light one (docs/ci.md,
  # "Light changes"): light when every changed file is on the allowlist in
  # scripts/ci-changes.sh, full otherwise and whenever the diff cannot be
  # computed. Every other job needs this one and runs unless the run is
  # cancelled, because a job skipped after a job it needs fails reports
  # success; a failed classification leaves the output empty, which is the
  # full path. On the light path a job that is not a matrix skips itself, which
  # reports success, and a matrix job skips its steps, so each entry still
  # reports the exact name the ruleset requires.
  changes:
    name: Classify the change
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      full: ${{ steps.classify.outputs.full }}
      oracles: ${{ steps.classify.outputs.oracles }}
    steps:
      # A pull request checks out its merge commit, whose first parent is the
      # base branch, so a depth of two holds the pull request's whole diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=
          case $EVENT in
          pull_request)
            if git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
            fi
            ;;
          merge_group) base=$GROUP_BASE ;;
          push) base=$PUSH_BEFORE ;;
          esac
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --quiet --no-tags --depth=1 origin "$base" || true
          fi
          verdict=$(bash scripts/ci-changes.sh diff "$base" HEAD)
          echo "$EVENT, base ${base:-unknown}: $verdict"
          if [ "$verdict" = light ]; then
            echo "full=false" >>"$GITHUB_OUTPUT"
          else
            echo "full=true" >>"$GITHUB_OUTPUT"
          fi
          # The live builtin differential runs FTEQCC and qcc on 78870 cases, half an hour on a
          # runner; it says something new only when the oracles, the differential's cases or
          # their recorded outcomes change. Otherwise the outcomes the fixture records stand in
          # for the oracles (`cargo xtask oracles --recorded`), and the nightly Differential
          # workflow runs the live check on main. With no base to compare, it runs live.
          if [ -z "$base" ] || ! git diff --quiet "$base" HEAD -- \
            oracles xtask/src/oracles.rs xtask/src/oracles xtask/fixtures/oracles; then
            echo "oracles=true" >>"$GITHUB_OUTPUT"
          else
            echo "oracles=false" >>"$GITHUB_OUTPUT"
          fi

  fmt:
    name: Format
    needs: changes
    # Saves no cache, so a run on main skips it.
    if: ${{ !cancelled() && needs.changes.outputs.full != 'false' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: Unit Tests (${{ matrix.name }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      # xtask's own tests read the light files (its repository checks, the
      # ratchet's readiness plan, the porting and perf-budget docs), so the
      # light path runs them on every OS and leaves out the other crates'.
      CI_PATH: ${{ needs.changes.outputs.full == 'false' && 'light' || 'full' }}
    strategy:
      # The first OS whose tests fail cancels the other two: the failure is
      # known, and a cancelled job frees its runner (docs/ci.md, "Stopping at
      # the first failure").
      fail-fast: true
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
          - name: macos
            runner: macos-latest
          - name: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      # cargo-nextest stops scheduling tests after the first failure (its
      # fail-fast default), so a job with a failing test ends at that test.
      # The workspace has no doc tests: every rustdoc code block is `text`.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9.148
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: debug-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The UI snapshot harness (P2-21) renders through wgpu with no window: on Linux with
      # Mesa's software Vulkan driver, on macOS with Metal and on Windows with WARP.
      - name: Install a software Vulkan driver for the snapshot harness
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - if: env.CI_PATH == 'full'
        run: cargo nextest run --locked --workspace --all-features
      # A snapshot that does not match leaves its new image and the difference beside the
      # golden; they are kept so the change can be seen.
      - name: Keep the snapshots that did not match
        if: failure() && env.CI_PATH == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshots-${{ matrix.name }}
          path: |
            apps/desktop/snapshots/*.new.png
            apps/desktop/snapshots/*.diff.png
          if-no-files-found: ignore
      - name: Test xtask, whose tests read the light files
        if: env.CI_PATH == 'light'
        run: cargo nextest run --locked -p xtask --all-features
      # P1-11: the oracles (oracles/README.md), built from id's sources fetched by checksum
      # with the system C compiler, then the VM oracle checked against the VM vectors. The
      # fetched sources and binaries are cached; a stamp of every input decides whether the
      # cached binaries are rebuilt.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.CI_PATH == 'full'
        id: oracles-cache
        with:
          path: |
            target/oracles/src
            target/oracles/bin
          key: oracles-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('oracles/**', 'xtask/src/oracles.rs', 'xtask/src/oracles/**') }}
      - name: Build and check the oracles
        if: env.CI_PATH == 'full'
        env:
          LIVE: ${{ needs.changes.outputs.oracles != 'false' }}
        # bash on every OS, Windows included, whose default shell is PowerShell.
        shell: bash
        run: |
          if [ "$LIVE" = true ]; then
            cargo xtask oracles
          else
            cargo xtask oracles --recorded
          fi
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.CI_PATH == 'full' && github.ref == 'refs/heads/main' && steps.oracles-cache.outputs.cache-hit != 'true'
        with:
          path: |
            target/oracles/src
            target/oracles/bin
          key: ${{ steps.oracles-cache.outputs.cache-primary-key }}

  build:
    name: Build (${{ matrix.name }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CI_PATH: ${{ needs.changes.outputs.full == 'false' && 'light' || 'full' }}
    strategy:
      # The first target that fails to build cancels the rest (docs/ci.md,
      # "Stopping at the first failure").
      fail-fast: true
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CI_PATH == 'full'
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        if: env.CI_PATH == 'full'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.CI_PATH == 'full'
        with:
          shared-key: build-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        if: env.CI_PATH == 'full'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --profile ci --locked --workspace --target "$TARGET"

  build-macos:
    name: Build (macos-universal)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.full != 'false' }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: build-apple-darwin
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build aarch64-apple-darwin
        run: cargo build --profile ci --locked --workspace --target aarch64-apple-darwin
      - name: Build x86_64-apple-darwin
        run: cargo build --profile ci --locked --workspace --target x86_64-apple-darwin
      - name: Make universal binaries with lipo
        run: |
          out=target/universal-apple-darwin/ci
          mkdir -p "$out"
          count=0
          for arm in target/aarch64-apple-darwin/ci/*; do
            [ -f "$arm" ] && [ -x "$arm" ] || continue
            name=$(basename "$arm")
            lipo -create -output "$out/$name" "$arm" "target/x86_64-apple-darwin/ci/$name"
            lipo "$out/$name" -verify_arch arm64 x86_64
            lipo -info "$out/$name"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "no binaries to combine" >&2
            exit 1
          fi

  xtask-ci:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2
      # plan/check.py and its tests run inside cargo xtask ci and need PyYAML.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install PyYAML for the plan checks
        run: python -m pip install PyYAML==6.0.3
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: xtask-ci-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The fuzz-build step of cargo xtask ci checks the cargo-fuzz crate,
          # which is its own workspace with its own target dir; cache it too so
          # the step is incremental and the light path stays fast.
          workspaces: |
            . -> target
            fuzz -> fuzz/target
      # Format, Clippy, Unit Tests (linux), cargo-deny and Test Assets (linux)
      # run these steps of cargo xtask ci with the same command, so this job
      # skips them and each runs once (docs/ci.md). Test Assets runs the fast
      # differential suite after it builds the corpus progs. A run on main
      # skips Format and cargo-deny, so there this job runs fmt and deny
      # itself. make ci runs every step.
      - name: cargo xtask ci, less the steps other jobs run
        env:
          SKIP: ${{ github.ref == 'refs/heads/main' && 'clippy,nextest,differential' || 'fmt,clippy,nextest,deny,differential' }}
        run: cargo xtask ci --skip "$SKIP"

  deny:
    name: cargo-deny
    needs: changes
    # Saves no cache, so a run on main skips it.
    if: ${{ !cancelled() && needs.changes.outputs.full != 'false' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The cargo-deny version and command of the deny step of cargo xtask ci,
      # which the cargo xtask ci job skips because this job runs it.
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked --all-features check advisories bans licenses sources

  dependency-review:
    name: Dependency Review
    # The action compares a pull request's base and head; on merge_group events
    # and runs on main the job is skipped, which a required check accepts.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          vulnerability-check: true
          license-check: true

  test-assets:
    name: Test Assets (${{ matrix.name }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
          - name: macos
            runner: macos-latest
          - name: windows
            runner: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CI_PATH: ${{ needs.changes.outputs.full == 'false' && 'light' || 'full' }}
      # The deletion check below runs only in the merge group on Linux, where it takes
      # minutes unoptimized: there the job's one xtask build is optimized. Debug
      # assertions and overflow checks stay on, as in every other run.
      CARGO_PROFILE_DEV_OPT_LEVEL: ${{ github.event_name == 'merge_group' && matrix.name == 'linux' && '3' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CI_PATH == 'full'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: env.CI_PATH == 'full'
        with:
          python-version: "3.12"
      - name: Point QS_TEST_ASSETS outside the source tree
        if: env.CI_PATH == 'full'
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: echo "QS_TEST_ASSETS=$RUNNER_TEMP_DIR/test-assets" >> "$GITHUB_ENV"
      # The archives are pinned by the manifest, so its SHA-256 (hashFiles) is
      # the cache key: a manifest change downloads afresh. Saved at the end of
      # the job, after every fetch, on main only.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.CI_PATH == 'full'
        id: downloads-cache
        with:
          path: ${{ runner.temp }}/test-assets/downloads
          key: test-assets-${{ runner.os }}-${{ hashFiles('corpus/manifest.toml') }}
      - name: Set up the Rust toolchain
        if: env.CI_PATH == 'full'
        run: rustup toolchain install
      - name: Test the language coverage script
        if: env.CI_PATH == 'full'
        working-directory: corpus
        run: python -m unittest test_language_coverage.py
      - name: Check the corpus manifest
        if: env.CI_PATH == 'full'
        run: cargo xtask corpus verify
      # P2-04 (ENGT-1.2): the engine-target tables match what their pinned fact sources give.
      # The sources are the same on every OS, so one runner fetches them.
      - name: Regenerate the engine-target tables and compare
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: cargo xtask engines --check
      - name: Fetch the test assets
        if: env.CI_PATH == 'full'
        run: cargo xtask assets fetch
      - name: Check the rerelease precaches
        if: env.CI_PATH == 'full'
        run: cargo xtask assets precache
      # The source is the same on every OS, so one runner checks it.
      - name: Write id 1.01 to the asset cache
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: cargo xtask corpus fetch id-1.01
      - name: Check the language spec covers id 1.01
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: python corpus/language_coverage.py --source-dir "$QS_TEST_ASSETS/codebase/id-1.01"
      # P1-20: every vanilla corpus file lexes, and progs.src preprocesses, with no errors.
      - name: Lex and preprocess id 1.01
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: cargo xtask lex-corpus "$QS_TEST_ASSETS/codebase/id-1.01"
      # P1-11: id's qcc compiles id 1.01 and the VM oracle traces the result. Unit Tests
      # (linux) saves the oracles under the same key, so this job only restores them.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        with:
          path: |
            target/oracles/src
            target/oracles/bin
          key: oracles-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('oracles/**', 'xtask/src/oracles.rs', 'xtask/src/oracles/**') }}
      - name: Compile and trace id 1.01 with the oracles
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: cargo xtask oracles id101 "$QS_TEST_ASSETS/codebase/id-1.01"
      - name: Write the rerelease and two FTEQCC mods to the asset cache
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: cargo xtask corpus fetch rerelease copper arcane-dimensions
      # P1-21: id 1.01 parses with no errors; every file of each codebase, FTEQCC ones
      # included, round-trips through the tree.
      - name: Parse the corpus
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: |
          cargo xtask parse-corpus --vanilla "$QS_TEST_ASSETS/codebase/id-1.01"
          cargo xtask parse-corpus "$QS_TEST_ASSETS/codebase/rerelease" \
            "$QS_TEST_ASSETS/codebase/copper" "$QS_TEST_ASSETS/codebase/arcane-dimensions"
      # P1-21: every single-token deletion in id 1.01 leaves a local error. It reparses
      # each file once per token, the one step that takes minutes, so it runs in the
      # merge group only, which every change passes before it reaches main.
      - name: Check that deleting any token of id 1.01 leaves a local error
        if: env.CI_PATH == 'full' && runner.os == 'Linux' && github.event_name == 'merge_group'
        run: cargo xtask parse-corpus --deletions "$QS_TEST_ASSETS/codebase/id-1.01"
      # P2-51: the same for the rerelease under the FTEQCC profile.
      - name: Check that deleting any token of the rerelease leaves a local error under FTEQCC
        if: env.CI_PATH == 'full' && runner.os == 'Linux' && github.event_name == 'merge_group'
        run: cargo xtask parse-corpus --fteqcc --deletions "$QS_TEST_ASSETS/codebase/rerelease"
      # P1-26: the pinned FTEQCC compiles the six rerelease codebases to version 6 progs.dat
      # files with vanilla opcodes only, and .lno files. They are kept as oracle artifacts in
      # target/oracles/rerelease, cached on everything that decides their bytes.
      - name: Write the rerelease codebases to the asset cache
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: |
          cargo xtask corpus fetch rerelease rerelease-hipnotic rerelease-rogue rerelease-mg1 \
            rerelease-ctf rerelease-mg3
      # P2-03: every rerelease codebase parses and resolves with zero errors under the FTEQCC
      # profile, and the vanilla profile rejects each extension with a diagnostic.
      - name: Parse and resolve the rerelease under the FTEQCC profile
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: |
          cargo xtask fteqcc-profile \
            "$QS_TEST_ASSETS/codebase/rerelease" \
            "$QS_TEST_ASSETS/codebase/rerelease-hipnotic" \
            "$QS_TEST_ASSETS/codebase/rerelease-rogue" \
            "$QS_TEST_ASSETS/codebase/rerelease-mg1" \
            "$QS_TEST_ASSETS/codebase/rerelease-ctf" \
            "$QS_TEST_ASSETS/codebase/rerelease-mg3"
      # P2-07: every rerelease codebase compiles with our compiler under the FTEQCC profile.
      - name: Compile the rerelease with qc-codegen
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: |
          cargo xtask codegen-corpus \
            "$QS_TEST_ASSETS/codebase/rerelease" \
            "$QS_TEST_ASSETS/codebase/rerelease-hipnotic" \
            "$QS_TEST_ASSETS/codebase/rerelease-rogue" \
            "$QS_TEST_ASSETS/codebase/rerelease-mg1" \
            "$QS_TEST_ASSETS/codebase/rerelease-ctf" \
            "$QS_TEST_ASSETS/codebase/rerelease-mg3"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        id: rerelease-cache
        with:
          path: target/oracles/rerelease
          key: oracle-artifacts-rerelease-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('oracles/**', 'xtask/src/oracles.rs', 'xtask/src/oracles/**', 'corpus/manifest.toml') }}
      - name: Compile the rerelease with FTEQCC
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: cargo xtask oracles rerelease "$QS_TEST_ASSETS/codebase"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.CI_PATH == 'full' && runner.os == 'Linux' && github.ref == 'refs/heads/main' && steps.rerelease-cache.outputs.cache-hit != 'true'
        with:
          path: target/oracles/rerelease
          key: ${{ steps.rerelease-cache.outputs.cache-primary-key }}
      # P1-14: every progs.dat an oracle compiler builds from the corpus (id 1.01 with id's qcc,
      # the rerelease with FTEQCC) is kept in the cache and round-trips through qc-progs.
      - name: Build the corpus progs and round-trip them through qc-progs
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: cargo xtask corpus build
      # P2-54: id 1.01 (vanilla profile) and the rerelease (FTEQCC profile) resolve to the golden
      # indexes in docs/spec/vectors/sema/, and their global definitions agree with the progs
      # the oracle compilers built in the step above (TEST-6).
      - name: Check the semantic model's golden indexes and definitions against the progs
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: |
          cargo xtask sema-corpus \
            "$QS_TEST_ASSETS/codebase/id-1.01=$QS_TEST_ASSETS/progs/id-1.01/progs.dat" \
            "$QS_TEST_ASSETS/codebase/rerelease=$QS_TEST_ASSETS/progs/rerelease/progs.dat"
      # P2-14: the language server, driven over the protocol against the rerelease, gives the
      # answers its golden file records (docs/spec/vectors/lsp/rerelease.txt).
      - name: Drive the language server against the rerelease
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: cargo xtask lsp-corpus "$QS_TEST_ASSETS/codebase/rerelease"
      # P1-13 (FND-8, QA-1): the fast differential subset. Runs id 1.01 end to end
      # in the VM oracle (restored above) and QuakeC Studio's runner and fails on any
      # divergence that DIFF-10.1 does not list (DIFF-10.3). This is the differential VM
      # suite QA-1 names; the cargo xtask ci job skips the `differential` step because this
      # job runs it with the same command (docs/ci.md). The full corpus runs nightly
      # (differential.yml).
      - name: Run the fast differential VM suite on id 1.01
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: cargo xtask differential --fast
      # P2-09 (COMP-4, COMP-7): the compiler differential. id 1.01 compiled by id's qcc and by
      # qc-codegen with --opt fold off and on; every function called in qc-vm on each progs,
      # 32 rounds, with no divergence and at least 90% of qcc's statements executed (DIFF-12).
      # The 128-round run is nightly (differential.yml).
      - name: Run the compiler differential on id 1.01
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: cargo xtask compiler-diff --fast
      # P1-23: every module of each codebase opens with no error in its file graph, and id
      # 1.01's graph has the order of the functions in the progs.dat id's qcc compiled above.
      - name: Open the corpus as projects
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: |
          cargo xtask project-corpus --progs "$QS_TEST_ASSETS/progs/id-1.01/progs.dat" \
            "$QS_TEST_ASSETS/codebase/id-1.01"
          cargo xtask project-corpus "$QS_TEST_ASSETS/codebase/rerelease" \
            "$QS_TEST_ASSETS/codebase/rerelease-hipnotic" \
            "$QS_TEST_ASSETS/codebase/rerelease-rogue" "$QS_TEST_ASSETS/codebase/rerelease-mg1" \
            "$QS_TEST_ASSETS/codebase/rerelease-ctf" "$QS_TEST_ASSETS/codebase/rerelease-mg3" \
            "$QS_TEST_ASSETS/codebase/copper" "$QS_TEST_ASSETS/codebase/arcane-dimensions"
      # P1-33: the pinned FTEQCC runs on every module of each codebase it can compile, and the
      # files it reports compiling and including match the module's graph, in order (a prefix
      # when FTEQCC stops on a compile error or a crash, per PRJ-6). The oracles are restored
      # with the id 1.01 compile step above, so this only builds FTEQCC on a cache miss.
      - name: Check the corpus graph order against FTEQCC
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: |
          cargo xtask project-corpus --fteqcc "$QS_TEST_ASSETS/codebase/id-1.01" \
            "$QS_TEST_ASSETS/codebase/rerelease" \
            "$QS_TEST_ASSETS/codebase/rerelease-hipnotic" \
            "$QS_TEST_ASSETS/codebase/rerelease-rogue" "$QS_TEST_ASSETS/codebase/rerelease-mg1" \
            "$QS_TEST_ASSETS/codebase/rerelease-ctf" "$QS_TEST_ASSETS/codebase/rerelease-mg3" \
            "$QS_TEST_ASSETS/codebase/copper" "$QS_TEST_ASSETS/codebase/arcane-dimensions"
      # P1-34: Xonotic's three modules open through the quakec.toml corpus fetch writes (its
      # archive is only qcsrc/, 2 MB), and FreeCS opens whole in its Nuclide SDK tree, with
      # Rad-Therapy (FreeHL) beside it (about 120 MB in the macOS downloads cache). FreeCS
      # runs on macOS: its shared/defs.h includes "animations.h" and the file is
      # Animations.h, which only a case-insensitive file system opens, as FTEQCC's fopen
      # would (PRJ-7.1); its client and server modules each get warning W0402 there (PRJ-7.2).
      - name: Open Xonotic as a project
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: |
          cargo xtask corpus fetch xonotic
          cargo xtask project-corpus "$QS_TEST_ASSETS/codebase/xonotic"
      - name: Open FreeCS as a project
        if: env.CI_PATH == 'full' && runner.os == 'macOS'
        run: |
          cargo xtask corpus fetch freecs-tree
          cargo xtask project-corpus --expect-warning W0402=2 \
            "$QS_TEST_ASSETS/tree/freecs-tree/cstrike/src"
      # P2-26 (FTEF-1.1): the FTEQCC corpus mods parse and resolve with zero errors under the
      # FTEQCC profile: FreeCS, Rad-Therapy (whose menu module builds Nuclide's menu-vgui) and
      # Nuclide's own menu-fn. They need the case-insensitive file system FreeCS does.
      # Rad-Therapy opens through its project file (corpus/projects/freehl), which gives each
      # module the include directories its Makefiles give FTEQCC (FTEF-14.49).
      # P2-38: so do Copper and Arcane Dimensions, which FTEQCC builds from list-form
      # progs.src files.
      - name: Parse and resolve the FTEQCC corpus mods under the FTEQCC profile
        if: env.CI_PATH == 'full' && runner.os == 'macOS'
        run: |
          cargo xtask corpus fetch copper arcane-dimensions
          cargo xtask fteqcc-profile \
            "$QS_TEST_ASSETS/tree/freecs-tree/cstrike/src" \
            "$QS_TEST_ASSETS/tree/freecs-tree/valve/src" \
            "$QS_TEST_ASSETS/tree/freecs-tree/src/menu-fn" \
            "$QS_TEST_ASSETS/codebase/copper" \
            "$QS_TEST_ASSETS/codebase/arcane-dimensions"
      # P5-02: every map of the corpus reads and writes back byte for byte, and every BSP,
      # .lit, alias model, sprite and sound of the LibreQuake lite asset loads.
      - name: Write the corpus maps to the asset cache
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: |
          awk '/^\[\[/ { map = ($0 == "[[map]]") } map && $1 == "id" { gsub(/"/, "", $3); print $3 }' \
            corpus/manifest.toml | xargs cargo xtask corpus fetch
      - name: Round-trip the corpus maps
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: cargo xtask map-corpus "$QS_TEST_ASSETS/map"
      - name: Decode the LibreQuake lite asset
        if: env.CI_PATH == 'full' && runner.os == 'Linux'
        run: cargo run --release -p qs-vfs --example walk -- -basedir "$QS_TEST_ASSETS/librequake-lite"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.CI_PATH == 'full' && github.ref == 'refs/heads/main' && steps.downloads-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/test-assets/downloads
          key: ${{ steps.downloads-cache.outputs.cache-primary-key }}
