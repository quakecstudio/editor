# Runs every cargo-fuzz target in fuzz/ for 10 minutes each, nightly and on
# demand, with `cargo xtask fuzz` (docs/testing.md, TEST-5), and the VM
# oracle's libFuzzer targets with `cargo xtask oracles fuzz`. A crash fails the
# run and uploads the crashing input as the `fuzz-artifacts` artifact; minimise
# it into a regression test in the crate it found (for `qc-vm`, a case in
# crates/qs-differential/src/generate/tests.rs).
#
# The `qc-vm` target fuzzes QuakeC Studio's VM against the id VM oracle on
# well-formed random progs (FND-10, P1-15): this job builds the oracle
# (`cargo xtask oracles`) and sets QS_VM_ORACLE, so the target compares the two
# VMs' traces (DIFF-9); a divergence fails the run. The acceptance of P1-15, a
# 24-hour clean run before the P1 gate, is this nightly job's over the persisted
# corpus. Without the oracle (a pull-request build) the target still runs
# `qc-vm` over every input and fails on a panic or runaway.
#
# It does not run on pull requests or in the merge queue, and is not a required
# check (docs/ci.md): pull requests still build and test the crates the targets
# call. Fuzzing needs nightly Rust (docs/conventions.md).
name: Fuzz

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    # Twelve targets of ten minutes each, the oracle build and the Rust builds.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchains
        run: |
          rustup toolchain install
          rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fuzz-${{ runner.os }}
          workspaces: |
            .
            fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Point QS_TEST_ASSETS outside the source tree
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: echo "QS_TEST_ASSETS=$RUNNER_TEMP_DIR/test-assets" >> "$GITHUB_ENV"
      # P1-22, P2-51: the parser target's grammar-aware mutator starts from real QuakeC,
      # vanilla and FTEQCC, and parses each input under both profiles.
      - name: Seed the parser corpus with id 1.01, the rerelease and two FTEQCC mods
        run: |
          cargo xtask corpus fetch id-1.01 rerelease copper arcane-dimensions
          mkdir -p fuzz/corpus/parser
          find "$QS_TEST_ASSETS/codebase/id-1.01" "$QS_TEST_ASSETS/codebase/rerelease" \
            "$QS_TEST_ASSETS/codebase/copper" "$QS_TEST_ASSETS/codebase/arcane-dimensions" \
            -type f \( -name '*.qc' -o -name '*.qh' \) -print0 |
            while IFS= read -r -d '' file; do
              name=${file#"$QS_TEST_ASSETS"/codebase/}
              cp "$file" "fuzz/corpus/parser/${name//\//_}"
            done
      # FND-10: the qc-vm target compares against the id VM oracle. Build it
      # (`cargo xtask oracles` fetches id's C by checksum and compiles it) and
      # point QS_VM_ORACLE at the binary, so the target does the differential
      # comparison (DIFF-9) rather than only the no-panic check.
      - name: Build the VM oracle
        run: cargo xtask oracles
      - name: Point QS_VM_ORACLE at the VM oracle binary
        run: echo "QS_VM_ORACLE=$PWD/target/oracles/bin/vm-oracle" >> "$GITHUB_ENV"
      - name: Run every fuzz target
        run: cargo xtask fuzz --time 10m
      - name: Upload crashing inputs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # The VM oracle's readers of files (oracles/README.md, Fuzzing): libFuzzer
  # targets of our C, built with clang's libFuzzer and sanitizers. A crash
  # fails the run and uploads the crashing input as `fuzz-artifacts-oracles`.
  oracles:
    name: Fuzz the oracles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - name: Set up clang with libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fuzz-oracles-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fuzz each target of the oracles
        env:
          CC: clang-18
        run: cargo xtask oracles fuzz all --time 600
      - name: Upload crashing inputs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-oracles
          path: target/oracles/fuzz/*/artifacts/
          if-no-files-found: ignore
