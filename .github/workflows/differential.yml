# Runs the full differential VM corpus (P1-13, FND-8) nightly and on demand
# with `cargo xtask differential --full`: every oracle-built codebase (id 1.01
# built by id's qcc, and the six rerelease codebases built by the pinned
# FTEQCC) run in the VM oracle and in QuakeC Studio's runner, their traces
# compared statement by statement (DIFF-9) and their statement coverage
# measured (DIFF-11). The full run enforces zero divergences on every codebase
# and reports coverage without gating on it (ADR-0013); the fast subset (id
# 1.01) runs on every change in the Test Assets (linux) job of ci.yml. It also
# runs the compiler differential's nightly run (P2-09, P2-10, DIFF-12,
# `cargo xtask compiler-diff --full <codebase>`), one job per codebase in
# parallel over id 1.01, the rerelease and the corpus mods at the bar, each
# publishing its results table in the run's summary (DIFF-12.14), and the
# per-function differential (DIFF-15, `cargo xtask compiler-diff --functions
# <codebase>`), one job per codebase the pinned FTEQCC compiles. It also builds
# the map tool oracles (P6-03, `cargo xtask oracles maps`).
#
# It does not run on pull requests or in the merge queue, and is not a required
# check (docs/ci.md): the full corpus takes minutes and the fast subset already
# guards every change. Nothing else watches it, so run-phase checks the latest
# scheduled run first (.claude/skills/run-phase/SKILL.md).
name: Differential

on:
  schedule:
    - cron: "47 16 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  night:
    name: Night window
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint 1.7.12 does not read the `$/` self-repository form yet.
      - uses: ./.github/actions/night-window # zizmor: ignore[self-repository]
        with:
          check: start
          token: ${{ github.token }}

  deadline:
    name: Morning deadline
    needs: night
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # 19:00 to 07:00 at most.
    timeout-minutes: 720
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint 1.7.12 does not read the `$/` self-repository form yet.
      - uses: ./.github/actions/night-window # zizmor: ignore[self-repository]
        with:
          check: deadline
          token: ${{ github.token }}
          self: Morning deadline

  differential:
    name: Differential
    needs: night
    runs-on: ubuntu-latest
    # Building the oracles and FTEQCC, compiling the corpus and running every
    # codebase twice.
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: differential-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Point QS_TEST_ASSETS outside the source tree
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: echo "QS_TEST_ASSETS=$RUNNER_TEMP_DIR/test-assets" >> "$GITHUB_ENV"
      # The archives are pinned by the manifest, so its SHA-256 (hashFiles) is the cache key.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: downloads-cache
        with:
          path: ${{ runner.temp }}/test-assets/downloads
          key: test-assets-${{ runner.os }}-${{ hashFiles('corpus/manifest.toml') }}
      # The VM oracle and id's qcc, fetched by checksum and built with the system C compiler.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: oracles-cache
        with:
          path: |
            target/oracles/src
            target/oracles/bin
          key: oracles-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('oracles/**', 'xtask/src/oracles.rs', 'xtask/src/oracles/**') }}
      - name: Build and check the oracles
        run: cargo xtask oracles
      # id 1.01 (compiled by id's qcc) and the six rerelease codebases (compiled by FTEQCC).
      - name: Write id 1.01 and the rerelease codebases to the asset cache
        run: |
          cargo xtask corpus fetch id-1.01 rerelease rerelease-hipnotic rerelease-rogue \
            rerelease-mg1 rerelease-ctf rerelease-mg3
      - name: Compile the rerelease with FTEQCC
        run: cargo xtask oracles rerelease "$QS_TEST_ASSETS/codebase"
      # P1-14: every corpus progs.dat round-trips through qc-progs; it also writes the progs the
      # differential runner reads.
      - name: Build the corpus progs
        run: cargo xtask corpus build
      # The full corpus: every oracle-built codebase, enforcing zero divergences and reporting
      # statement coverage (TEST-6, ADR-0013).
      - name: Run the full differential VM suite
        run: cargo xtask differential --full

  # P3-25 (DIFF-16.5): the server simulation differential on every map of LibreQuake's lite
  # asset, on each OS.
  # P6-03: the map tool oracles, id's qbsp, vis and light from qutils and a pinned ericw-tools,
  # fetched by checksum and built here only, each compiling a sealed room (oracles/README.md,
  # "The map tool oracles"). ericw-tools needs CMake, TBB and Embree 4.
  map-tools:
    name: Map tool oracles
    needs: night
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: differential-${{ runner.os }}
          save-if: false
      - name: Install CMake, TBB and Embree
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libtbb-dev libembree-dev
      - name: Build the map tool oracles and compile the room
        run: cargo xtask oracles maps

  sim-diff:
    name: Simulation differential (${{ matrix.os }})
    needs: night
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - name: Point QS_TEST_ASSETS outside the source tree
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: echo "QS_TEST_ASSETS=$RUNNER_TEMP_DIR/test-assets" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-assets/downloads
          key: test-assets-${{ runner.os }}-${{ hashFiles('corpus/manifest.toml') }}
      - name: Fetch the test assets
        run: cargo xtask assets fetch
      - name: Compare qs-sim with id's server on every LibreQuake map
        run: |
          cargo xtask sim-diff oracles/engine/routes/start.route \
            --map start --map dev --map lq_e0m1 --map lq_e0m2 --map lq_e0m3 --map lq_e0m4 \
            --map lq_e0m5 --map lq_e0m6 --map lq_e0m7 --map lq_e0m8 \
            -- -basedir "$QS_TEST_ASSETS/librequake-lite"

  # P3-28 (VIEWDIFF): the preview host's frames and sound against id's whole engine, the view
  # oracle, on every map of LibreQuake's lite asset, on Linux and macOS: id's Windows client
  # needs its DirectX and MGL drivers (VIEWDIFF-2.6).
  view-diff:
    name: View differential (${{ matrix.os }})
    needs: night
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: view-diff-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The host draws offscreen through wgpu: on Linux with Mesa's software Vulkan driver and on
      # macOS with Metal; cpal needs ALSA's headers to build on Linux.
      - name: Install a software Vulkan driver and ALSA's headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev mesa-vulkan-drivers
      - name: Point QS_TEST_ASSETS outside the source tree
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: echo "QS_TEST_ASSETS=$RUNNER_TEMP_DIR/test-assets" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-assets/downloads
          key: test-assets-${{ runner.os }}-${{ hashFiles('corpus/manifest.toml') }}
      - name: Fetch the test assets
        run: cargo xtask assets fetch
      - name: Compare the preview host with id's engine on every LibreQuake map
        run: |
          cargo xtask view-diff \
            --map start --map dev --map lq_e0m1 --map lq_e0m2 --map lq_e0m3 --map lq_e0m4 \
            --map lq_e0m5 --map lq_e0m6 --map lq_e0m7 --map lq_e0m8 \
            -- -basedir "$QS_TEST_ASSETS/librequake-lite"

  # P2-09 and P2-10: the compiler differential's nightly run, 128 rounds of calls to every
  # function of one codebase as its oracle compiles it (id's qcc for id 1.01, the pinned FTEQCC
  # for the rerelease and the corpus mods at the bar), against qc-codegen with fold off and on
  # (DIFF-12, DIFF-12.6, DIFF-12.14, DIFF-12.18); one job per codebase, since one takes up to
  # an hour.
  # P2-153 (DIFF-14.3): 10000 generated programs of seed 1, each compiled by the pinned FTEQCC
  # and by qc-codegen and compared as a codebase is.
  generated:
    name: Compiler differential (generated programs)
    needs: night
    runs-on: ubuntu-latest
    # 10,000 programs, each compiled by both FTEQCCs and qc-codegen and called, ran past two
    # hours on a hosted runner (run 41877684070).
    timeout-minutes: 300
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: differential-${{ runner.os }}
          save-if: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/oracles/src
            target/oracles/bin
          key: oracles-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('oracles/**', 'xtask/src/oracles.rs', 'xtask/src/oracles/**') }}
      - name: Build and check the oracles
        run: cargo xtask oracles
      - name: Run the compiler differential on generated programs
        run: cargo xtask compiler-diff --generated 10000 --seed 1

  compiler-diff:
    name: Compiler differential (${{ matrix.codebase }})
    needs: night
    runs-on: ubuntu-latest
    # Arcane Dimensions' 128 rounds, with the accessor and extra rounds (DIFF-12.16,
    # DIFF-12.24), ran past five hours on a hosted runner (run 41830900852); six is the
    # hosted runners' limit.
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        codebase:
          - id-1.01
          - rerelease
          - rerelease-hipnotic
          - rerelease-rogue
          - rerelease-mg1
          - rerelease-mg3
          - rerelease-ctf
          - arcane-dimensions
          - copper
          - librequake
          - qc-conduit
          - swab
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: differential-${{ runner.os }}
          save-if: false
      - name: Point QS_TEST_ASSETS outside the source tree
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: echo "QS_TEST_ASSETS=$RUNNER_TEMP_DIR/test-assets" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-assets/downloads
          key: test-assets-${{ runner.os }}-${{ hashFiles('corpus/manifest.toml') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/oracles/src
            target/oracles/bin
          key: oracles-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('oracles/**', 'xtask/src/oracles.rs', 'xtask/src/oracles/**') }}
      - name: Build and check the oracles
        run: cargo xtask oracles
      # The codebase's sources, its `progs.src` included, in the asset cache for the compiler
      # differential to compile them with its oracle and with qc-codegen.
      - name: Write the codebase to the asset cache
        env:
          CODEBASE: ${{ matrix.codebase }}
        run: cargo xtask corpus fetch "$CODEBASE"
      - name: Run the full compiler differential
        env:
          CODEBASE: ${{ matrix.codebase }}
        run: cargo xtask compiler-diff --full "$CODEBASE"
      # DIFF-12.14: the results table, published even when the codebase fails.
      - name: Publish the compiler differential's results table
        if: ${{ !cancelled() }}
        env:
          CODEBASE: ${{ matrix.codebase }}
        run: |
          if [[ -f "target/compiler-diff/$CODEBASE/summary.md" ]]; then
            cat "target/compiler-diff/$CODEBASE/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  # DIFF-15: each function of each codebase the pinned FTEQCC compiles, cut into a program of
  # its own and called alone, the statements the runs reach held to DIFF-12.5's bar, crmod7 to
  # its accepted 87.7%.
  functions:
    name: Per-function differential (${{ matrix.codebase }})
    needs: night
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        codebase:
          - rerelease
          - rerelease-hipnotic
          - rerelease-rogue
          - rerelease-mg1
          - rerelease-mg3
          - rerelease-ctf
          - copper
          - crmod7
          - librequake
          - qc-conduit
          - swab
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: differential-${{ runner.os }}
          save-if: false
      - name: Point QS_TEST_ASSETS outside the source tree
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: echo "QS_TEST_ASSETS=$RUNNER_TEMP_DIR/test-assets" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-assets/downloads
          key: test-assets-${{ runner.os }}-${{ hashFiles('corpus/manifest.toml') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/oracles/src
            target/oracles/bin
          key: oracles-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('oracles/**', 'xtask/src/oracles.rs', 'xtask/src/oracles/**') }}
      - name: Build and check the oracles
        run: cargo xtask oracles
      - name: Write the codebase to the asset cache
        env:
          CODEBASE: ${{ matrix.codebase }}
        run: cargo xtask corpus fetch "$CODEBASE"
      - name: Run each function on its own
        env:
          CODEBASE: ${{ matrix.codebase }}
        run: cargo xtask compiler-diff --functions "$CODEBASE"
      - name: Upload the logs of refused cuts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: per-function-${{ matrix.codebase }}
          path: target/compiler-diff/functions/${{ matrix.codebase }}/failed/
          if-no-files-found: ignore

  # DIFF-15.10: Arcane Dimensions' per-function run takes more than one job's six hours, so it
  # runs as four shards, each holding every fourth group of functions, and a last job holds
  # the statements they reached together to DIFF-15.6's bar.
  functions-shards:
    name: Per-function differential (arcane-dimensions, shard ${{ matrix.shard }}/4)
    needs: night
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: bash
    env:
      CODEBASE: arcane-dimensions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: differential-${{ runner.os }}
          save-if: false
      - name: Point QS_TEST_ASSETS outside the source tree
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: echo "QS_TEST_ASSETS=$RUNNER_TEMP_DIR/test-assets" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-assets/downloads
          key: test-assets-${{ runner.os }}-${{ hashFiles('corpus/manifest.toml') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/oracles/src
            target/oracles/bin
          key: oracles-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('oracles/**', 'xtask/src/oracles.rs', 'xtask/src/oracles/**') }}
      - name: Build and check the oracles
        run: cargo xtask oracles
      - name: Write the codebase to the asset cache
        run: cargo xtask corpus fetch "$CODEBASE"
      - name: Run this shard's functions on their own
        env:
          SHARD: ${{ matrix.shard }}
        run: cargo xtask compiler-diff --functions "$CODEBASE" --shard "$SHARD/4"
      - name: Upload the statements the shard reached
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: executed-arcane-dimensions-${{ matrix.shard }}
          path: target/compiler-diff/functions/arcane-dimensions/executed.tsv
          if-no-files-found: error
      - name: Upload the logs of refused cuts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: per-function-arcane-dimensions-${{ matrix.shard }}
          path: target/compiler-diff/functions/arcane-dimensions/failed/
          if-no-files-found: ignore

  functions-merge:
    name: Per-function differential (arcane-dimensions, coverage)
    needs: [night, functions-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CODEBASE: arcane-dimensions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: differential-${{ runner.os }}
          save-if: false
      - name: Point QS_TEST_ASSETS outside the source tree
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: echo "QS_TEST_ASSETS=$RUNNER_TEMP_DIR/test-assets" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-assets/downloads
          key: test-assets-${{ runner.os }}-${{ hashFiles('corpus/manifest.toml') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/oracles/src
            target/oracles/bin
          key: oracles-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('oracles/**', 'xtask/src/oracles.rs', 'xtask/src/oracles/**') }}
      - name: Build and check the oracles
        run: cargo xtask oracles
      - name: Write the codebase to the asset cache
        run: cargo xtask corpus fetch "$CODEBASE"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: executed-arcane-dimensions-*
          path: ${{ runner.temp }}/executed
      - name: Hold the shards' statements together to the bar
        env:
          EXECUTED: ${{ runner.temp }}/executed
        run: cargo xtask compiler-diff --functions "$CODEBASE" --merge "$EXECUTED"/*/executed.tsv
