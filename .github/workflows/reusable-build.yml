name: Reusable build

# The release's build (P4-18, #129) and its signing (P0-23, #23), called by
# .github/workflows/release.yml. It builds every package, signs and notarizes the macOS app
# and its installer package (#850), and attests each
# package in the job that made it. The attestations are made here, in a reusable workflow,
# so each names this file as its signer whatever workflow calls it, and a check holds the
# build to this file:
#   gh attestation verify <file> --repo quakecstudio/editor \
#     --signer-workflow quakecstudio/editor/.github/workflows/reusable-build.yml
# The secrets are the repository-level ones docs/releasing.md lists, passed by name. On a tag,
# the Windows executables are signed with Azure Artifact Signing (formerly Trusted Signing)
# through skeeto/aas-sign, which signs PE files only, and each MSI around them with
# Azure/artifact-signing-action after azure/login; Azure trusts only tag runs of the `release`
# workflow, so a run by hand leaves both unsigned.
# Each rpm is signed with the key of packages.quakecstudio.com before it is attested (P4-40),
# so the file a release publishes, the file dnf checks and the attested file are one.
on:
  workflow_call:
    outputs:
      version:
        description: The workspace version the packages carry
        value: ${{ jobs.version.outputs.version }}
    secrets:
      APPLE_APPLICATION_CERTIFICATE_PEM:
        required: true
      APPLE_APPLICATION_KEY_PEM:
        required: true
      APPLE_APPLICATION_IDENTITY:
        required: true
      APPLE_INSTALLER_CERTIFICATE_PEM:
        required: true
      APPLE_INSTALLER_KEY_PEM:
        required: true
      APPLE_INSTALLER_IDENTITY:
        required: true
      APPLE_KEYCHAIN_PASSWORD:
        required: true
      APPLE_NOTARY_KEY_ID:
        required: true
      APPLE_NOTARY_ISSUER_ID:
        required: true
      APPLE_NOTARY_KEY:
        required: true
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      TRUSTED_SIGNING_ENDPOINT:
        required: true
      TRUSTED_SIGNING_ACCOUNT:
        required: true
      CERTIFICATE_PROFILE:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  secrets:
    name: Signing secrets are set
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check each secret docs/releasing.md lists is set, printing no value
        env:
          APPLE_APPLICATION_CERTIFICATE_PEM: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_PEM }}
          APPLE_APPLICATION_KEY_PEM: ${{ secrets.APPLE_APPLICATION_KEY_PEM }}
          APPLE_APPLICATION_IDENTITY: ${{ secrets.APPLE_APPLICATION_IDENTITY }}
          APPLE_INSTALLER_CERTIFICATE_PEM: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PEM }}
          APPLE_INSTALLER_KEY_PEM: ${{ secrets.APPLE_INSTALLER_KEY_PEM }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          CERTIFICATE_PROFILE: ${{ secrets.CERTIFICATE_PROFILE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          missing=0
          for name in APPLE_APPLICATION_CERTIFICATE_PEM APPLE_APPLICATION_KEY_PEM \
            APPLE_APPLICATION_IDENTITY APPLE_INSTALLER_CERTIFICATE_PEM APPLE_INSTALLER_KEY_PEM \
            APPLE_INSTALLER_IDENTITY APPLE_KEYCHAIN_PASSWORD APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID APPLE_NOTARY_KEY AZURE_CLIENT_ID AZURE_TENANT_ID TRUSTED_SIGNING_ENDPOINT \
            TRUSTED_SIGNING_ACCOUNT CERTIFICATE_PROFILE GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              echo "::error::the secret $name is not set"
              missing=1
            else
              echo "ok    $name is set"
            fi
          done
          exit "$missing"

  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The packages carry the workspace's version; a tag must name it, with a pre-release
      # suffix or without.
      - name: Read the workspace version and check the tag names it
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "the packages are version $version"
          if [ "$REF_TYPE" = tag ]; then
            case "$REF_NAME" in
              "v$version" | "v$version"-*) echo "ok    the tag $REF_NAME names $version" ;;
              *)
                echo "::error::the tag $REF_NAME does not name the workspace version $version"
                exit 1
                ;;
            esac
          fi

  macos:
    name: Package, sign and notarize on macOS
    needs: [secrets, version]
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin
      # Apple silicon only: the app ships for arm64 Macs.
      - name: Build for Apple silicon
        run: |
          cargo build --release --locked --target aarch64-apple-darwin \
            -p quakec-studio -p quakec-engine -p quakec-ide -p quakec-lsp
          mkdir -p dist/bin
          for name in quakec-studio quakec-engine quakec-ide quakec-lsp; do
            cp "target/aarch64-apple-darwin/release/$name" dist/bin/
            lipo "dist/bin/$name" -verify_arch arm64
          done
      - name: Write the third-party notices
        run: cargo xtask notices --target aarch64-apple-darwin --out packaging/THIRD-PARTY.txt
      - name: Lay out the app
        run: packaging/macos/package.sh app dist/bin "$VERSION" dist
      # Both Developer ID identities, from the PEM certificates and keys smoketurner-infra's
      # apple root makes (docs/releasing.md), into a keychain the job makes and deletes, with
      # Apple's Developer ID G2 intermediate so each identity's chain validates. The system's
      # /usr/bin/openssl (LibreSSL) bundles each into a PKCS#12 file `security` reads. The key
      # files are removed however the step ends.
      - name: Import the Developer ID identities
        env:
          APPLE_APPLICATION_CERTIFICATE_PEM: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_PEM }}
          APPLE_APPLICATION_KEY_PEM: ${{ secrets.APPLE_APPLICATION_KEY_PEM }}
          APPLE_APPLICATION_IDENTITY: ${{ secrets.APPLE_APPLICATION_IDENTITY }}
          APPLE_INSTALLER_CERTIFICATE_PEM: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PEM }}
          APPLE_INSTALLER_KEY_PEM: ${{ secrets.APPLE_INSTALLER_KEY_PEM }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
          # https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer, valid to 2031-09-17.
          INTERMEDIATE_SHA256: f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a
        run: |
          set -o pipefail
          work="$RUNNER_TEMP_DIR/identities"
          mkdir -p "$work"
          chmod 700 "$work"
          trap 'rm -rf "$work"' EXIT
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          curl -fsSL -o "$work/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "$INTERMEDIATE_SHA256  $work/DeveloperIDG2CA.cer" | shasum -a 256 -c -
          security import "$work/DeveloperIDG2CA.cer" -k build.keychain
          for kind in APPLICATION INSTALLER; do
            certificate="APPLE_${kind}_CERTIFICATE_PEM"
            key="APPLE_${kind}_KEY_PEM"
            printf '%s\n' "${!certificate}" >"$work/$kind.crt"
            printf '%s\n' "${!key}" >"$work/$kind.key"
            /usr/bin/openssl pkcs12 -export -inkey "$work/$kind.key" -in "$work/$kind.crt" \
              -out "$work/$kind.p12" -passout env:APPLE_KEYCHAIN_PASSWORD
            security import "$work/$kind.p12" -k build.keychain -P "$APPLE_KEYCHAIN_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productsign
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          # Each identity must be there and valid, named by its fingerprint.
          valid=$(security find-identity -v build.keychain)
          for kind in APPLICATION INSTALLER; do
            identity="APPLE_${kind}_IDENTITY"
            fingerprint=$(printf '%s' "${!identity}" | tr -d ' :\n' | tr 'a-f' 'A-F')
            if ! grep -q "$fingerprint" <<<"$valid"; then
              echo "::error::the Developer ID $kind identity is not a valid identity in build.keychain"
              exit 1
            fi
            echo "ok    the Developer ID $kind identity is valid"
          done
      # Each executable is signed on its own, the preview host among them, then the app. The
      # identity is the certificate's SHA-1 fingerprint, which codesign accepts.
      - name: Code sign the app
        env:
          APPLE_APPLICATION_IDENTITY: ${{ secrets.APPLE_APPLICATION_IDENTITY }}
        run: |
          APPLE_APPLICATION_IDENTITY=$(printf '%s' "$APPLE_APPLICATION_IDENTITY" | tr -d ' :\n' | tr 'a-f' 'A-F')
          app="dist/QuakeC Studio.app"
          for name in quakec-engine quakec-ide quakec-lsp quakec-studio; do
            /usr/bin/codesign --force --sign "$APPLE_APPLICATION_IDENTITY" \
              --options runtime --timestamp "$app/Contents/MacOS/$name"
          done
          /usr/bin/codesign --force --sign "$APPLE_APPLICATION_IDENTITY" \
            --options runtime --timestamp "$app"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
      # notarytool signs in with an App Store Connect API key, not an Apple ID.
      - name: Store the notarization credentials
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          key="$RUNNER_TEMP_DIR/notary.p8"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$APPLE_NOTARY_KEY" >"$key")
          xcrun notarytool store-credentials "notarytool-profile" \
            --key "$key" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID"
      # The app is notarized and stapled itself, so it carries its ticket once installed and
      # opens on a Mac that is offline the first time.
      - name: Notarize and staple the app
        run: |
          app="dist/QuakeC Studio.app"
          ditto -c -k --keepParent "$app" dist/app-notarize.zip
          xcrun notarytool submit dist/app-notarize.zip --keychain-profile "notarytool-profile" --wait
          rm dist/app-notarize.zip
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
      # productsign takes the Installer identity by its name, read from the keychain by the
      # certificate's SHA-1 fingerprint.
      - name: Make, sign, notarize and staple the installer package
        env:
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: |
          pkg="dist/quakec-studio-$VERSION-macos-arm64.pkg"
          set -o pipefail
          packaging/macos/package.sh pkg "dist/QuakeC Studio.app" "$VERSION" dist/unsigned.pkg
          fingerprint=$(printf '%s' "$APPLE_INSTALLER_IDENTITY" | tr -d ' :\n' | tr 'a-f' 'A-F')
          name=$(security find-identity -v build.keychain \
            | sed -n "s/.*$fingerprint \"\(.*\)\"/\1/p" | head -n 1)
          if [ -z "$name" ]; then
            echo "::error::the Developer ID Installer identity is not in build.keychain"
            exit 1
          fi
          productsign --sign "$name" --timestamp --keychain build.keychain dist/unsigned.pkg "$pkg"
          rm dist/unsigned.pkg
          pkgutil --check-signature "$pkg"
          xcrun notarytool submit "$pkg" --keychain-profile "notarytool-profile" --wait
          xcrun stapler staple "$pkg"
          xcrun stapler validate "$pkg"
      - name: Attest the installer package
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/*.pkg
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-macos
          path: dist/*.pkg
          if-no-files-found: error
      - name: Cleanup macOS keychain
        if: ${{ always() }}
        run: security delete-keychain build.keychain 2>/dev/null || true

  windows:
    name: Package on Windows (${{ matrix.arch }})
    needs: version
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      # The C runtime linked into each executable, so none needs the Visual C++
      # Redistributable's vcruntime140.dll on the machine.
      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked --target "$TARGET" \
            -p quakec-studio -p quakec-engine -p quakec-ide -p quakec-lsp
      # Azure's federated credential trusts `...:workflow:release:ref_type:tag` alone
      # (docs/releasing.md), so only a tag's run signs. If the OIDC login fails, the subject
      # in Azure's error goes to Justin, not worked around.
      - name: Code sign the executables
        if: ${{ github.ref_type == 'tag' }}
        uses: skeeto/aas-sign@v1.1.1
        with:
          version: v1.1.0
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          account: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          profile: ${{ secrets.CERTIFICATE_PROFILE }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          files: |
            target/${{ matrix.target }}/release/quakec-studio.exe
            target/${{ matrix.target }}/release/quakec-engine.exe
            target/${{ matrix.target }}/release/quakec-ide.exe
            target/${{ matrix.target }}/release/quakec-lsp.exe
      - name: Check the signatures
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          foreach ($name in 'quakec-studio', 'quakec-engine', 'quakec-ide', 'quakec-lsp') {
            $signature = Get-AuthenticodeSignature "target/$env:TARGET/release/$name.exe"
            if ($signature.Status -ne 'Valid') { throw "$name.exe: the signature is $($signature.Status)" }
            "ok    $name.exe signed by $($signature.SignerCertificate.Subject)"
          }
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Write the third-party notices
        run: cargo xtask notices --target "$TARGET" --out packaging/THIRD-PARTY.txt
      - name: Make the zip and the MSI
        run: |
          packaging/windows/package.sh zip "$ARCH" "target/$TARGET/release" "$VERSION" dist
          packaging/windows/package.sh msi "$ARCH" "target/$TARGET/release" "$VERSION" dist
      # aas-sign signs PE files only, so the MSI is signed by Azure's own action, which signs
      # through SignTool ("You can sign all file types that SignTool supports", Artifact
      # Signing's FAQ) with the Azure CLI's login. The same app registration and federated
      # credential as aas-sign's, with no subscription; only a tag's run signs.
      - name: Log in to Azure for the MSI
        if: ${{ github.ref_type == 'tag' }}
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Code sign the MSI
        if: ${{ github.ref_type == 'tag' }}
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          # The Azure CLI's login above, and no other credential.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Check the MSI's signature
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        run: |
          foreach ($msi in Get-ChildItem dist/*.msi) {
            $signature = Get-AuthenticodeSignature $msi.FullName
            if ($signature.Status -ne 'Valid') { throw "$($msi.Name): the signature is $($signature.Status)" }
            "ok    $($msi.Name) signed by $($signature.SignerCertificate.Subject)"
          }
      - name: Attest the zip and the MSI
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  linux:
    name: Package on Linux (${{ matrix.arch }})
    needs: [secrets, version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # ALSA's headers for the preview host's sound; musl-gcc for the static command line; rpm, flatpak-builder and the
      # Freedesktop runtime and SDK the Flatpak is built on; desktop-file-utils to check the
      # desktop entry; and librsvg's gdk-pixbuf loader, with which flatpak-builder checks the
      # SVG icon on export.
      - name: Install the packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev rpm flatpak flatpak-builder desktop-file-utils librsvg2-common \
            musl-tools
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --arch="$ARCH" flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Set up the Rust toolchain
        run: |
          rustup toolchain install
          rustup target add "$ARCH-unknown-linux-musl"
      # The app and the engine link glibc, since the display and GPU libraries they open at run
      # time cannot be opened by a static binary; the command line and the language server are
      # static musl binaries, which run on any Linux.
      - name: Build
        run: |
          cargo build --release --locked -p quakec-studio -p quakec-engine
          cargo build --release --locked --target "$ARCH-unknown-linux-musl" \
            -p quakec-ide -p quakec-lsp
          mkdir -p dist/bin
          cp target/release/quakec-studio target/release/quakec-engine dist/bin/
          for name in quakec-ide quakec-lsp; do
            cp "target/$ARCH-unknown-linux-musl/release/$name" dist/bin/
            file "dist/bin/$name"
            file "dist/bin/$name" | grep -q "static"
          done
      - name: Validate the desktop entry and the rpm's spec
        run: |
          desktop-file-validate packaging/linux/com.quakecstudio.QuakeCStudio.desktop
          rpmspec --define "pkg_version $VERSION" --define "tree /nonexistent" \
            -P packaging/linux/quakec-studio.spec > /dev/null
      - name: Write the third-party notices
        run: cargo xtask notices --target "$ARCH-unknown-linux-gnu" --out packaging/THIRD-PARTY.txt
      - name: Make the deb, the rpm, the AppImage and the Flatpak
        run: |
          for format in deb rpm appimage flatpak; do
            packaging/linux/package.sh "$format" "$ARCH" dist/bin "$VERSION" dist
          done
          rm -r dist/bin
          ls -l dist
      # dnf checks an rpm's own signature (`gpgcheck=1`), so the rpm is signed with the key
      # packages.quakecstudio.com publishes, and before the attestation, which then names the
      # signed file. APT checks the repository's signed metadata, so the deb needs none.
      - name: Sign the rpm
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: packaging/linux/sign-rpm.sh dist/*.rpm
      - name: Attest the Linux packages
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
