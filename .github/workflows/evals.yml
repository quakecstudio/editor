name: Evals

# P4-15 (QA-5): the agent's evals on a real model (cargo xtask evals --run, evals/README.md).
# Each run of a task stops at its cost cap; the results are appended to a history kept in the
# Actions cache from one run to the next, and the report and history are uploaded. It runs
# weekly and by hand, only with the QS_EVAL_API_KEY secret set; CI checks the tasks' scenarios
# on every change without a model (cargo xtask evals --check, in Test Assets (linux)).
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Only this task (empty: every task)"
        required: false
        default: ""
  schedule:
    - cron: "17 5 * * 1"

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  evals:
    name: Agent evals
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check that the model's key is set, printing no value
        id: key
        env:
          QS_EVAL_API_KEY: ${{ secrets.QS_EVAL_API_KEY }}
        run: |
          if [ -z "$QS_EVAL_API_KEY" ]; then
            echo "::notice::the secret QS_EVAL_API_KEY is not set; no eval runs"
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.set == 'true'
        with:
          persist-credentials: false
      - name: Set up the Rust toolchain
        if: steps.key.outputs.set == 'true'
        run: rustup toolchain install
      - name: Point QS_TEST_ASSETS outside the source tree
        if: steps.key.outputs.set == 'true'
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: echo "QS_TEST_ASSETS=$RUNNER_TEMP_DIR/test-assets" >> "$GITHUB_ENV"
      - name: Fetch the game and the starters' QuakeC
        if: steps.key.outputs.set == 'true'
        run: |
          cargo xtask assets fetch
          cargo xtask corpus fetch id-1.01 rerelease
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.key.outputs.set == 'true'
        with:
          path: target/evals/history.jsonl
          key: evals-history-${{ github.run_id }}
          restore-keys: evals-history-
      - name: Run the evals
        if: steps.key.outputs.set == 'true'
        env:
          QS_EVAL_API_KEY: ${{ secrets.QS_EVAL_API_KEY }}
          TASK: ${{ inputs.task }}
        run: |
          # Each run stops at 2 US dollars (cargo xtask evals --max-usd).
          status=0
          if [ -n "$TASK" ]; then
            cargo xtask evals --run --task "$TASK" --max-usd 2 --history target/evals/history.jsonl || status=$?
          else
            cargo xtask evals --run --max-usd 2 --history target/evals/history.jsonl || status=$?
          fi
          cat target/evals/report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.key.outputs.set == 'true'
        with:
          path: target/evals/history.jsonl
          key: evals-history-${{ github.run_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.key.outputs.set == 'true'
        with:
          name: evals
          path: |
            target/evals/report.md
            target/evals/history.jsonl
          if-no-files-found: warn
