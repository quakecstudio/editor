equivalent_mutants = { "crates/qc-vm/src/exec.rs: replace Builtins::engine_string -> Option<&[u8]> with None" = "the Builtins trait default body is `let _ = value; None`, so replacing it with None is the same value; a dispatch that makes no engine strings resolves every out-of-table string value to the VM-7.3 runtime error whether the default is the original or the mutant", "crates/qc-vm/src/ops.rs: replace match guard offset < numstrings with true in resolve_string" = "resolve_string matches `usize::try_from(value)` with the guard `Ok(offset) if offset < numstrings` (PROGS-11.6); dropping the guard sends offset == numstrings and above to `progs.string(value)`, which returns None because no NUL is reachable at or past the table end, so `.ok_or(())` gives the same error the `_` arm's engine_string lookup gives for a value with no engine string (VM-7.3)", "crates/qc-vm/src/ops.rs: replace < with <= in resolve_string" = "the same PROGS-11.6 guard `offset < numstrings`: `<=` differs only at offset == numstrings, which is one past the last byte, so `progs.string(numstrings)` finds no terminated string and returns None, the same error the `<` form produces by routing it to engine_string (VM-7.3)", "crates/qc-vm/src/ops.rs: delete match arm (None, None) in strcmp" = "strcmp's `(None, None) => return 0` arm is redundant: when both bytes are None the `_` arm sets va = vb = 0 (unwrap_or(0)), so `va != vb` is false and the following `if ca.is_none() && cb.is_none() { return 0 }` returns 0, the same value (VM-7.2)", "crates/qc-vm/src/ops.rs: replace && with || in strcmp" = "the terminal `if ca.is_none() && cb.is_none() { return 0 }` is reached only when va == vb; a string is a byte slice with no interior NUL exposed here, so the only way two equal bytes are both the end is ca and cb both None, where `&&` and `||` agree; when exactly one is None the other byte is non-zero (differs from the None side's 0) and `va != vb` already returned, so the `||` case never fires differently (VM-7.2)", "crates/qc-vm/src/ops.rs: replace < with == in float_to_int" = "the lower bound `truncated < NEG_TWO_POW_31` returns VM_FLOAT_TO_INT_INVALID (= i32::MIN) for a value below -2^31 (VM-9.1); `==` differs only at truncated == -2^31, where the `<` form instead casts -2^31 to i32 = i32::MIN, the identical value, so the result is the same", "crates/qc-vm/src/ops.rs: replace < with <= in float_to_int" = "same VM-9.1 lower bound: `<=` differs only at truncated == -2^31, where it returns VM_FLOAT_TO_INT_INVALID = i32::MIN, equal to the `<` form's cast of -2^31 to i32, so the converted value is identical", "crates/qc-vm/src/ops.rs: replace < with <= in load_target" = "load_target filters the field index with `*f < entityfields` (VM-11.1); `<=` accepts field == entityfields, which EdictStore::field then reads with `.get(field)` and returns None, so load_scalar raises the same out-of-range divergence the `<` form raises here (VM-11.4)", "crates/qc-vm/src/ops.rs: replace < with <= in load_vector" = "load_vector's field filter `*f < entityfields` (VM-11.1): `<=` accepts field == entityfields, but the three field reads through EdictStore::field return None for a slot the edict does not hold, so the load errors downstream the same way (VM-11.4)", "crates/qc-vm/src/ops.rs: replace < with <= in address" = "the ADDRESS field filter `field < entityfields` (VM-10.1): `<=` accepts field == entityfields, but the pointer it would form names a slot EdictStore rejects on the following STOREP/LOAD, so no in-bounds access results (VM-10.3)", "crates/qc-vm/src/ops.rs: replace < with == in pointer_target" = "pointer_target's final `number < num_edicts && field < entityfields` (EDICT-1.6); the `number < num_edicts` to `==` mutant accepts only number == num_edicts, but that edict is not in use and its field access through the store still returns None, so STOREP/LOAD raises the same error (VM-12.5)", "crates/qc-vm/src/ops.rs: replace < with <= in pointer_target" = "the same `number < num_edicts` bound: `<=` adds number == num_edicts, whose field access the store rejects (EdictStore::field/set_field returns None/false), so the caller errors downstream exactly as with `<` (VM-12.5)", "crates/qc-vm/src/ops.rs: replace || with && in pointer_target" = "pointer_target returns None when `from_fields < 0 || from_fields % 4 != 0` (EDICT-1.6); the two conditions never both decide a borderline case the same input could expose: a negative from_fields is never a multiple of 4 boundary that `&&` would let through, and a non-multiple of 4 is caught, so both forms reject exactly the pointers that do not land on a field slot", "crates/qc-vm/src/ops.rs: replace && with || in pointer_target" = "the final `number < num_edicts && field < entityfields` (EDICT-1.6); `||` would accept a pointer in range on only one axis, but the subsequent EdictStore::field/set_field access rejects an out-of-range number or field with None, so the STOREP/LOAD errors downstream and QuakeC observes the same failure (VM-12.5)", "crates/qc-vm/src/ops.rs: replace < with <= in storep_vector" = "storep_vector's field bound `field < entityfields` for the three slots (VM-12.4): `<=` accepts field == entityfields, but EdictStore::set_field returns false for a slot the edict does not hold, so the store raises the same out-of-range divergence (VM-12.5)" }
