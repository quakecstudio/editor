ge_yaw" = "change_yaw clamps the turn with `if mv > 0.0 { if mv > yaw_speed { mv = yaw_speed } }` (BUILTIN-15.4); the three `>` to `>=` sites each differ only at an equality (mv == 0, mv == yaw_speed) where the assignment sets mv to the value it already holds, a no-op, and the `mv == 0` case cannot arise because exact_eq(current, ideal) returns before the turn when the yaw is already ideal, so new_y is unchanged in every case", "crates/qc-builtins/src/dispatch.rs: replace < with <= in MockBuiltins<MockEngine>::change_yaw" = "the negative-turn clamp `else if mv < -yaw_speed { mv = -yaw_speed }` (BUILTIN-15.4): `<=` differs only at mv == -yaw_speed, where mv is set to -yaw_speed, the value it already holds, a no-op, so the resulting angle is identical", "crates/qc-builtins/src/math.rs: replace > with >= in rint" = "rint chooses the rounding offset with `if f > 0.0 { f + 0.5 } else { f - 0.5 }` (BUILTIN-6.7); `>=` differs only at f == 0, where `0 + 0.5` and `0 - 0.5` both truncate toward zero to 0, so rint(0) is +0 either way, matching the spec's '0 and -0 give +0'", "crates/qc-builtins/src/math.rs: replace < with <= in ftos" = "this `<` is the infinity-sign test `if f < 0.0 { \" -inf\" } else { \"  inf\" }`, reached only after `f.is_infinite()` is true (BUILTIN-7.6); an infinite f is never 0, the only value where `<` and `<=` differ, so the sign chosen is identical for +inf and -inf", "crates/qc-builtins/src/math.rs: replace < with <= in component_5_1" = "the same infinity-sign test in a vtos component, reached only when the component is infinite (BUILTIN-7.7); an infinite value is never 0, so `<` and `<=` pick the same sign for +inf and -inf" }

# qc-vm (L1 VM): the P1-65 (#393) work raised mutation to 92% (211 of 230
# viable caught) with new tests for the error Display, the accessors, the
# bitwise and string opcodes and the trace observer. The fifteen keys below are
# equivalent on every input a loaded progs can produce: the engine_string trait
# default already returns None, strcmp's two terminal checks are redundant, the
# float-to-int boundary returns the same i32::MIN either way, and every field
# or edict bounds guard whose equal case is accepted is caught again by the
# store's own bounds check downstream. Measured mutation is above the 90% bar,
# so no exception is needed. The P1-R1 readiness re-run adds the minimums and
# `readiness`.
[crates.qc-vm]
