# qs-install (L0 formats): of its twelve survivors (P1-R0, P1-57), the link_dir
# NotFound guard is killed by a new test; the rest are equivalent on the Linux
# Readiness runner. A later review adds the minimums and `readiness`.
[crates.qs-install]
readiness = "P1-R0"
lines = 96
branches = 94
mutation = 93
spec = 100
reason = "P1-57: the remaining survivors are in Windows-only code (dead on the Linux Readiness runner), are the MD5 selection-function identity where OR and XOR agree on disjoint operands, or are the find_installs wrapper whose result depends on the real machine"
equivalent_mutants = { "crates/qs-install/src/lib.rs: replace find_installs -> Vec<Install> with vec![]" = "find_installs only constructs a Finder from StdFs, SystemRegistry, the current platform and the current store dirs and calls find(); on a Readiness runner with no Quake installed it returns an empty Vec, so an empty result is not distinguishable, and the finder's logic is tested with mock Fs and Registry", "crates/qs-install/src/link.rs: replace is_link -> bool with true" = "this is_link is the `#[cfg(windows)]` definition (junctions); it is not compiled on the Linux Readiness runner, so the mutation cannot change behaviour there", "crates/qs-install/src/link.rs: replace is_link -> bool with false" = "the `#[cfg(windows)]` is_link is not compiled on the Linux Readiness runner", "crates/qs-install/src/link.rs: replace || with && in is_link" = "the `#[cfg(windows)]` is_link (`is_symlink() || junction::exists(...)`) is not compiled on the Linux Readiness runner", "crates/qs-install/src/link.rs: replace remove_link -> io::Result<()> with Ok(())" = "this remove_link is the `#[cfg(windows)]` definition, not compiled on the Linux Readiness runner", "crates/qs-install/src/link.rs: replace create_link -> io::Result<()> with Ok(())" = "this create_link is the `#[cfg(windows)]` definition, not compiled on the Linux Readiness runner", "crates/qs-install/src/md5.rs: replace | with ^ in compress" = "the F and G selection functions `(b & c) | (!b & d)` and `(b & d) | (c & !d)` combine disjoint operands (one bit of the selector routes each bit to exactly one side), and `p | q == p ^ q` whenever p & q == 0, so OR and XOR give the same 32-bit result for every input (RFC 1321 section 3.4)", "crates/qs-install/src/registry.rs: replace <impl Registry for SystemRegistry>::string -> Option<String> with None" = "SystemRegistry::string begins `if !cfg!(windows) { return None; }`, so on the Linux Readiness runner it already returns None for every input; the mutant is the same value", "crates/qs-install/src/registry.rs: delete ! in <impl Registry for SystemRegistry>::string" = "the two `!` are in `!cfg!(windows)` and `!output.status.success()`; on the Linux Readiness runner removing the first still returns None (the reg command is absent, so `.ok()?` is None), and the second is only reached on Windows, so neither changes behaviour on the runner" }

# qs-bsp (L0 formats): twelve surviving mutants that no test can kill, recorded
# while working P1-57 (#358). The run killed three more with new tests (the
# BspError Display, the `||` suffix guard in sequence_animations, and the `>`
# to `==` in mod_load_submodels that changes a model's radius); these twelve
# are equivalent to the original on every realisable input. The measured
# mutation is 393 of 405 viable (97%), above the 90% bar, so no exception is
# needed. A later review adds the minimums and `readiness`.
[crates.qs-bsp]
readiness = "P1-R0"
lines = 99
branches = 94
mutation = 97
spec = 100
reason = "P1-57 (#358): the remaining survivors are an f64::from(f32) comparison that never hits the double literal exactly (BSP-8.6), OR over disjoint SURF_* bits where OR equals XOR (BSP-20.6, BSP-20.11), equal-value reassignments in calc_surface_extents and the radius bound that are no-ops (BSP-9.10, BSP-15.4), and Option filters that never change when the count is already positive (BSP-4.9)"
equivalent_mutants = { "crates/qs-bsp/src/lib.rs: replace < with <= in Bsp<'a>::mod_load_texinfo" = "the mip-bias thresholds compare `f64::from(mean)` with the double literals 0.32, 0.49 and 0.99 (BSP-8.6: 'The lengths and their mean are single-precision floats, compared with the constants as doubles'); mean is an f32, so f64::from(mean) is a value with at most 24 significant bits and can never equal 0.32, 0.49 or 0.99 (none of which is exactly representable in f32), so `<` and `<=` agree on every input", "crates/qs-bsp/src/lib.rs: replace | with ^ in Bsp<'a>::mod_load_faces" = "the `*` and `sky` branches OR disjoint single-bit SURF_* flags (SURF_DRAWSKY=4, SURF_DRAWTILED=0x20, SURF_DRAWTURB=0x10); the operands never share a bit, so `a | b == a ^ b` for every input (BSP-20.6)", "crates/qs-bsp/src/lib.rs: replace < with <= in Bsp<'a>::calc_surface_extents" = "the WinQuake extent loop does `if value < *min { *min = value }`; replacing `<` with `<=` only adds the case value == *min, which reassigns the same value, a no-op, so the computed texturemins and extents are identical (BSP-9.10)", "crates/qs-bsp/src/lib.rs: replace > with >= in Bsp<'a>::calc_surface_extents" = "the companion `if value > *max { *max = value }`; `>=` only adds value == *max, which reassigns the same value, a no-op, so the extents are identical (BSP-9.10)", "crates/qs-bsp/src/lib.rs: replace > with >= in Bsp<'a>::mod_load_submodels" = "RadiusFromBounds takes the larger absolute value per axis with `if min.abs() > max.abs() { min.abs() } else { max.abs() }` (BSP-15.4); when the two absolute values are equal the two branches return the same number, so `>` and `>=` give the same radius on every input, while the `>` to `==` mutant that does differ is killed by model_radius_prefers_larger_abs_mins", "crates/qs-bsp/src/lib.rs: replace > with >= in sequence_animations" = "the two alternate links pass `altanims.first()...filter(|_| altmax > 0)` and `anims.first()...filter(|_| max > 0)`; altmax and max are usize counts set to at least one whenever a frame of that kind exists, and the filtered Option is None whenever no such frame exists (then first() is already None), so the filter changes nothing and `> 0` and `>= 0` never differ (BSP-4.9)", "crates/qs-bsp/src/lib.rs: replace | with ^ in fitz_face_flags" = "fitz_face_flags ORs disjoint single-bit SURF_* flags (SURF_DRAWSKY|SURF_DRAWTILED for sky, SURF_DRAWTURB|SURF_DRAWTILED for `*`/`!`); the operands never share a bit, so `a | b == a ^ b` for every input (BSP-20.6, BSP-20.11)" }

