# qc-preproc (L2 syntax): the P1-R2 readiness review (docs/readiness/p1-r2.md)
# found nine survivors on the case-fold comparison (P1-58, #360). Seven are
# killed by new tests (the trait default's Some(Default) answer, and the
# least-of-two-case-variants tie-break in FsLoader::stored_name and
# MemoryLoader::folded, now written with Iterator::min so the comparison has no
# operator to flip). The two below are equivalent on every realisable input.
# The P1-R2 re-run (run 39020739388) measures the layer ready and sets the
# minimums below; the two equivalent mutants hold the measured mutation at 98%.
[crates.qc-preproc]
readiness = "P1-R2"
lines = 98
branches = 91
mutation = 98
spec = 100
reason = "P1-58 (#360): the trait default already returns None, and no lexical diagnostic can start at a conditional skip region's end, so neither survivor has a distinguishing input"
equivalent_mutants = { "crates/qc-preproc/src/lib.rs: replace < with <= in Preprocessor<L>::finish_cursor" = "the guard `s.start <= d.span.start && d.span.start < s.end` suppresses a lexical diagnostic inside a skipped conditional region [start, end); a skip region's end is always either the file length (no byte starts there) or the start of the `#else`/`#endif` that re-enables output (a `#`, which lexes as Punct(Hash) and is never a lexical error, QC-9.6), so no diagnostic's span starts at s.end and `<` and `<=` agree on every input", "crates/qc-preproc/src/source.rs: replace Loader::stored_name -> Option<OsString> with None" = "the Loader trait's default stored_name body is `let _ = path; None`, so returning None is the unmutated value; a loader that lists no directory cannot tell the stored name (PRJ-7.2), which a_loader_without_a_directory_has_no_stored_name pins, while the Some(Default::default()) mutant of the same default is killed by it" }

# qs-map (L0 formats): nine surviving mutants recorded while working P1-57
# (#358). The run killed the geometry plane and texvecs arithmetic, the number
# parser, Face::set qbsp_differs, both texture limits and the entity line and
# entity-string boundary with new tests; these nine are equivalent on every
# realisable input. Measured mutation is 548 of 561 viable, above the 90% bar,
# so no exception is needed. A later review adds the minimums and `readiness`.
[crates.qs-map]
readiness = "P1-R0"
lines = 96
branches = 93
mutation = 97
spec = 100
reason = "P1-57 (#358): the survivors are two redundant comparisons rescued by the second disjunct of the texture-limit check (MAP-4.7), a lone-dot guard whose advance is discarded (MAP-3.3), a whole-number format threshold where both branches print the same text (MAP-3.3), the best-row dot sum over unit base axes and its min/max tie that land on the same s and t axes (MAP-4.2)"
equivalent_mutants = { "crates/qs-map/src/check.rs: replace > with == in MapFile::check" = "this is `textures.len() > MAP_MAX_TEXINFO` (MAP-4.7); whenever the distinct name count passes 4096 the second disjunct `faces > 4096 && qbsp overflows` is already true (more than 4096 names forces qbsp's miptex table over 4096, TooManyMiptex, and faces >= names > 4096), so changing `>` to `==` on the first disjunct never changes the OR result; the faces-and-qbsp disjunct is itself pinned by too_many_textures_by_texinfo_not_names and many_duplicate_faces_do_not_overflow", "crates/qs-map/src/check.rs: replace > with >= in MapFile::check" = "same first disjunct `textures.len() > MAP_MAX_TEXINFO` (MAP-4.7): the second disjunct is already true whenever the first fires, so `>=` on the first comparison does not change the result (a name count below 4096 makes both `>` and `>=` false, so there is no spurious positive either)", "crates/qs-map/src/cnum.rs: replace > with >= in c_strtod" = "in C89 strtod the guard `if whole > 0 || fraction > 0` advances `len` past a `.` (MAP-3.3); `whole >= 0` (resp `fraction >= 0`) differs only when the count is 0, i.e. a lone `.`, but then `whole == 0 && fraction == 0` is reached and returns `(0.0, 0)`, discarding the advanced `len`, so both forms give the identical (value, used)", "crates/qs-map/src/document.rs: replace < with <= in number" = "the formatter uses `value.fract() == 0.0 && value.abs() < 1e15` to choose `format!(\"{value:.0}\")` over `format!(\"{value}\")` (MAP-3.3); the branch is only reached for whole numbers (fract == 0), and Rust prints a whole f64 identically in both forms at every magnitude, so the 1e15 threshold never changes the output and `<`, `<=`, `==` and `>` all format the same string", "crates/qs-map/src/document.rs: replace < with == in number" = "same whole-number format threshold (MAP-3.3): `{value:.0}` and `{value}` are byte-identical for every whole f64, so which branch a value takes is not observable and `==` cannot differ from `<`", "crates/qs-map/src/document.rs: replace < with > in number" = "same whole-number format threshold (MAP-3.3): the two format branches produce the same text for whole numbers, so `>` cannot differ from `<`", "crates/qs-map/src/geometry.rs: replace + with - in qbsp_texvecs" = "the best-row dot `normal[0]*axis[0] + normal[1]*axis[1] + normal[2]*axis[2]` uses axis = base_axis(row, 0), one of the six signed unit base axes (MAP-4.2) with exactly one non-zero component, so two of the three products are 0 and flipping a `+` between them to `-` cannot change the sum", "crates/qs-map/src/geometry.rs: replace + with - in standard_texvecs" = "same dot over the unit base axes (MAP-4.2): each has a single non-zero component, so the two zero products make the `+` to `-` flip a no-op", "crates/qs-map/src/geometry.rs: replace > with < in best_row" = "best_row keeps the row with the largest dot (MAP-4.2); the six base axes are the signed unit vectors +-x, +-y, +-z, so the smallest dot is always the negation of the largest and falls on the paired opposite row, which shares its s and t axes and its sv/tv indices, so picking the smallest instead of the largest yields identical texture axes" }

# qc-builtins (L1 VM): the P1-65 (#393) work raised line coverage to 91% and
# mutation to 97% (724 of 743 viable caught) with new tests. The nineteen
# survivors below are equivalent on every input the mock dispatch can receive:
# guards pre-empted by an earlier check, OR over disjoint flag bits where OR
# equals XOR, comparison boundaries whose equal case reassigns the same value,
# and the float-to-int sign split at zero. Measured mutation is above the 90%
# bar, so no exception is needed. The P1-R1 readiness re-run adds the minimums
# and `readiness`.
[crates.qc-builtins]
reason = "P1-65 (#393): each survivor is equivalent to the original on every realisable input: a guard whose only distinguishing value is already rejected downstream (BUILTIN-1.2, BUILTIN-2.5, BUILTIN-2.7, BUILTIN-8.3), OR over disjoint FL_* bits where `|` equals `^` (DIFF-7.7), a system-vector field write that always succeeds (BUILTIN-6.1), the ChangeYaw clamp whose boundary reassigns the same value with the equal case pre-empted by exact_eq (BUILTIN-15.4), the checkclient health test overridden by checkclient's own health<=0 rule (DIFF-7.3), and the float-to-int sign split that gives +0 at zero either way (BUILTIN-6.7, BUILTIN-7.1, BUILTIN-7.2)"
equivalent_mutants = { "crates/qc-builtins/src/dispatch.rs: replace || with && in MockBuiltins<MockEngine>::dispatch" = "the gap guard is `table::is_fixme(number) || table::lookup(number).is_none()` (BUILTIN-1.2); the VM only dispatches a builtin number in 1..=78 (it rejects 0 and numbers above the table before the call, VM-14.4, LIMIT-5), and for every number in that range a PF_Fixme gap has both disjuncts true while a real builtin has both false, so `&&` gives the same result as `||` for every number that can reach dispatch", "crates/qc-builtins/src/dispatch.rs: replace match guard number >= 0 with true in checked_edict" = "checked_edict matches `EntityRef(value).number(edict_size)` with the guard `Some(number) if number >= 0` (BUILTIN-2.7); `number()` only returns Some for a whole multiple of the edict size, and a negative whole multiple (the sole case the guard rejects) then fails `usize::try_from(number)` and returns invalid_entity, exactly what the `_` arm returns, so dropping the guard gives the same invalid_entity error", "crates/qc-builtins/src/dispatch.rs: replace match guard slot < fields with true in checked_field" = "checked_field matches `usize::try_from(value)` with the guard `Ok(slot) if slot < fields` (BUILTIN-8.3); a slot at or above entityfields (the only case the guard rejects) is still rejected downstream, because the caller reads that slot with EdictStore::field, which returns None for a slot the edict does not hold and yields invalid_field, so dropping the guard gives the same invalid_field result", "crates/qc-builtins/src/dispatch.rs: replace < with <= in checked_field" = "same BUILTIN-8.3 guard `slot < fields`: `<=` differs only at slot == entityfields, which is not a field the edict holds, so the caller's EdictStore::field returns None and yields invalid_field, the same result the `<` form gives (it rejects the slot directly)", "crates/qc-builtins/src/dispatch.rs: replace && with || in write_field_vector" = "write_field_vector returns Ok on