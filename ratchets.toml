# Per-crate readiness minimums (TEST-10, ADR-0009, docs/testing.md).
#
# A readiness review that passes records its crates' numbers here, and
# `cargo xtask ratchet` (run by the Readiness workflow) fails any crate that
# measures below its minimums or below the bar.
#
# One table per crate, the whole percentage measured, rounded down:
#
#   [crates.qs-example]
#   readiness = "P1-R1"   # plan key of the readiness issue that set these numbers
#   lines = 94            # line coverage, bar 90
#   branches = 83         # branch coverage, bar 80
#   mutation = 92         # mutants caught, bar 90
#   spec = 100            # active spec statements cited, bar 100
#   reason = "..."        # required whenever a minimum goes down
#   exceptions = { branches = "why; also stated in the crate README" }
#   equivalent_mutants = { "src/lib.rs: replace f -> u8 with 0" = "why it cannot be killed" }
#
# Before any review has passed, a table may hold only `exceptions` and their
# `reason`, or only `equivalent_mutants` and their `reason`: no `readiness` key
# and no minimums, which the first passing review adds. A check under
# `exceptions` with no minimum passes even when no tool measures it.
#
# Changing a crate's numbers needs a new `readiness` key; lowering one, or
# adding an exception or equivalent mutant, also needs a new `reason`.
# `cargo xtask ratchet` checks this over the file's whole git history.

# The C tools layer's own C (`cargo xtask readiness <check> oracles`): the bar
# applies to it as to a crate, except mutation, which oracles/README.md explains.
[crates.oracles]
readiness = "P1-RG"
lines = 95
branches = 88
mutation = 0
spec = 100
reason = "P1-35: no mutation tool of the bar runs on the oracles' C"
exceptions = { mutation = "cargo mutants, the bar's mutation tool (docs/testing.md, TEST-2), mutates Rust only, and the oracles are C; every vector, probe and scenario test states the trace or exit status the spec gives, written without the C, so a fault in the C fails an expectation (oracles/README.md, Readiness)" }

# The build-automation tool (`xtask`, the tooling layer): one surviving mutant
# that no test can kill, found by the P1-RG readiness review (P1-55). `xtask`
# has not had a full readiness review, so this table holds only the justified
# survivor; a later review adds the minimums and `readiness`.
[crates.xtask]
reason = "P1-55: fn main is the process entry point, which no test can run in cargo mutants"
equivalent_mutants = { "xtask/src/main.rs: replace main -> ExitCode with Default::default()" = "fn main reads the process arguments and returns the exit code; cargo mutants builds the crate's tests with `cargo test --no-run`, which never builds the binary, and CARGO_BIN_EXE_xtask is unset for a bin crate's own unit tests, so no test can invoke main; its one line of logic (map the bool from the tested `run` to SUCCESS or FAILURE) is covered by the tests of `run`, and Default::default() is ExitCode::SUCCESS" }

# qc-lno (L0 formats): four surviving mutants that no test can kill through the
# public API, found by the P1-R0 readiness review (P1-57, docs/readiness/p1-r0.md).
# The review killed five of the nine survivors with new tests; these four remain.
# Recording them as equivalent leaves the measured mutation at 34 of 38 (89%),
# one point under the 90% bar only because of these unkillable mutants, so the
# mutation bar is waived by an exception with the same reason (also in
# crates/qc-lno/README.md). A later review adds the minimums and `readiness`.
[crates.qc-lno]
readiness = "P1-R0"
lines = 98
branches = 92
mutation = 89
spec = 100
reason = "P1-57: four mutants in LnoFile::write have no distinguishing input observable through the public API (a line table of LNO_MAX_STATEMENTS = i32::MAX entries cannot be allocated, and a Vec::with_capacity hint does not change the bytes written)"
exceptions = { mutation = "P1-57: the four equivalent mutants below hold the measured mutation at 89%, one point under the 90% bar; every other mutant is caught, so the bar is waived rather than lowered (stated in crates/qc-lno/README.md)" }
equivalent_mutants = { "crates/qc-lno/src/write.rs: replace > with == in LnoFile::write" = "the LNO-6.3 guard `self.lines.len() > LNO_MAX_STATEMENTS` rejects an oversized line table; distinguishing `>` from `==` needs a line table of exactly LNO_MAX_STATEMENTS = i32::MAX = 2_147_483_647 entries (over 8 GiB of i32), which cannot be allocated in a test, so the two forms agree on every realisable input", "crates/qc-lno/src/write.rs: replace > with >= in LnoFile::write" = "same LNO-6.3 guard: distinguishing `>` from `>=` needs a line table of exactly LNO_MAX_STATEMENTS = i32::MAX entries, which cannot be allocated, so the two forms agree on every realisable input", "crates/qc-lno/src/write.rs: replace LnoFile::size_hint -> usize with 0" = "size_hint only feeds Vec::with_capacity to pre-size the output buffer; the bytes written are identical whatever the capacity, so a wrong hint is not observable through the public API (LNO-6.1, LNO-6.2)", "crates/qc-lno/src/write.rs: replace LnoFile::size_hint -> usize with 1" = "size_hint only feeds Vec::with_capacity; a hint of 1 changes the initial capacity, not the bytes written, so it is not observable through the public API (LNO-6.1, LNO-6.2)" }

