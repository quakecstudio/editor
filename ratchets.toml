# Per-crate readiness minimums (TEST-10, ADR-0009, docs/testing.md).
#
# A readiness review that passes records its crates' numbers here, and
# `cargo xtask ratchet` (run by the Readiness workflow) fails any crate that
# measures below its minimums or below the bar.
#
# One table per crate, the whole percentage measured, rounded down:
#
#   [crates.qs-example]
#   readiness = "P1-R1"   # plan key of the readiness issue that set these numbers
#   lines = 94            # line coverage, bar 90
#   branches = 83         # branch coverage, bar 80
#   mutation = 92         # mutants caught, bar 90
#   spec = 100            # active spec statements cited, bar 100
#   reason = "..."        # required whenever a minimum goes down
#   exceptions = { branches = "why; also stated in the crate README" }
#   equivalent_mutants = { "src/lib.rs: replace f -> u8 with 0" = "why it cannot be killed" }
#
# Before any review has passed, a table may hold only `exceptions` and their
# `reason`, or only `equivalent_mutants` and their `reason`: no `readiness` key
# and no minimums, which the first passing review adds. A check under
# `exceptions` with no minimum passes even when no tool measures it.
#
# Changing a crate's numbers needs a new `readiness` key; lowering one, or
# adding an exception or equivalent mutant, also needs a new `reason`.
# `cargo xtask ratchet` checks this over the file's whole git history.

# The C tools layer's own C (`cargo xtask readiness <check> oracles`): the bar
# applies to it as to a crate, except mutation, which oracles/README.md explains.
[crates.oracles]
readiness = "P1-RG"
lines = 95
branches = 88
mutation = 0
spec = 100
reason = "P1-35: no mutation tool of the bar runs on the oracles' C"
exceptions = { mutation = "cargo mutants, the bar's mutation tool (docs/testing.md, TEST-2), mutates Rust only, and the oracles are C; every vector, probe and scenario test states the trace or exit status the spec gives, written without the C, so a fault in the C fails an expectation (oracles/README.md, Readiness)" }

# The build-automation tool (`xtask`, the tooling layer): one surviving mutant
# that no test can kill, found by the P1-RG readiness review (P1-55). `xtask`
# has not had a full readiness review, so this table holds only the justified
# survivor; a later review adds the minimums and `readiness`.
[crates.xtask]
reason = "P1-55: fn main is the process entry point, which no test can run in cargo mutants"
equivalent_mutants = { "xtask/src/main.rs: replace main -> ExitCode with Default::default()" = "fn main reads the process arguments and returns the exit code; cargo mutants builds the crate's tests with `cargo test --no-run`, which never builds the binary, and CARGO_BIN_EXE_xtask is unset for a bin crate's own unit tests, so no test can invoke main; its one line of logic (map the bool from the tested `run` to SUCCESS or FAILURE) is covered by the tests of `run`, and Default::default() is ExitCode::SUCCESS" }

# qc-lno (L0 formats): four surviving mutants that no test can kill through the
# public API, found by the P1-R0 readiness review (P1-57, docs/readiness/p1-r0.md).
# The review killed five of the nine survivors with new tests; these four remain.
# Recording them as equivalent leaves the measured mutation at 34 of 38 (89%),
# one point under the 90% bar only because of these unkillable mutants, so the
# mutation bar is waived by an exception with the same reason (also in
# crates/qc-lno/README.md). A later review adds the minimums and `readiness`.
[crates.qc-lno]
reason = "P1-57: four mutants in LnoFile::write have no distinguishing input observable through the public API (a line table of LNO_MAX_STATEMENTS = i32::MAX entries cannot be allocated, and a Vec::with_capacity hint does not change the bytes written)"
exceptions = { mutation = "P1-57: the four equivalent mutants below hold the measured mutation at 89%, one point under the 90% bar; every other mutant is caught, so the bar is waived rather than lowered (stated in crates/qc-lno/README.md)" }
equivalent_mutants = { "crates/qc-lno/src/write.rs: replace > with == in LnoFile::write" = "the LNO-6.3 guard `self.lines.len() > LNO_MAX_STATEMENTS` rejects an oversized line table; distinguishing `>` from `==` needs a line table of exactly LNO_MAX_STATEMENTS = i32::MAX = 2_147_483_647 entries (over 8 GiB of i32), which cannot be allocated in a test, so the two forms agree on every realisable input", "crates/qc-lno/src/write.rs: replace > with >= in LnoFile::write" = "same LNO-6.3 guard: distinguishing `>` from `>=` needs a line table of exactly LNO_MAX_STATEMENTS = i32::MAX entries, which cannot be allocated, so the two forms agree on every realisable input", "crates/qc-lno/src/write.rs: replace LnoFile::size_hint -> usize with 0" = "size_hint only feeds Vec::with_capacity to pre-size the output buffer; the bytes written are identical whatever the capacity, so a wrong hint is not observable through the public API (LNO-6.1, LNO-6.2)", "crates/qc-lno/src/write.rs: replace LnoFile::size_hint -> usize with 1" = "size_hint only feeds Vec::with_capacity; a hint of 1 changes the initial capacity, not the bytes written, so it is not observable through the public API (LNO-6.1, LNO-6.2)" }

# qs-vfs (L0 formats): one surviving mutant on the Readiness mutation job,
# which runs on Linux (.github/workflows/readiness.yml), found by the P1-R0
# readiness review (P1-57). A later review adds the minimums and `readiness`.
[crates.qs-vfs]
reason = "P1-57: the surviving mutant is in a `cfg!(windows)`-guarded branch, dead code on the Linux Readiness runner, so no input can distinguish it there"
equivalent_mutants = { "crates/qs-vfs/src/host.rs: replace == with != in is_separator" = "is_separator is `c == '/' || (cfg!(windows) && c == '\\\\')`; the mutated comparison `c == '\\\\'` is inside the `cfg!(windows)` conjunction, so on the Linux Readiness runner `cfg!(windows)` is false and `false && _` is false whatever that comparison yields, leaving no input that tells `==` from `!=`; the backslash separator it guards is Windows-only behaviour (FS: `\\` is a separator only where the host filesystem treats it as one)" }

# qc-progs (L0 formats): one surviving mutant found by the P1-R0 readiness
# review (P1-57). A later review adds the minimums and `readiness`.
[crates.qc-progs]
reason = "P1-57: crc_value XORs with PROGS_CRC_XOR, which PROGS-4.1 fixes at 0x0000, so XOR and OR give the same result for every input"
equivalent_mutants = { "crates/qc-progs/src/crc.rs: replace ^ with | in crc_value" = "crc_value is `crc ^ PROGS_CRC_XOR`; PROGS-4.1 states the final XOR is 0x0000 (CRC-16/CCITT-FALSE), and `crc ^ 0 == crc | 0 == crc` for every 16-bit crc, so no input distinguishes `^` from `|` here" }

# qs-log (L0 formats): three of its four survivors (P1-R0, P1-57) are killed by
# new tests; the fourth is equivalent. A later review adds the minimums and `readiness`.
[crates.qs-log]
reason = "P1-57: the `self.len > 0` rotation guard mutated to `self.len >= 0` is unreachable as a difference, because len is a u64 and the empty-file case it guards gives the same result either way"
equivalent_mutants = { "crates/qs-log/src/writer.rs: replace > with >= in RotatingFile::write_record" = "the guard is `self.len > 0 && self.len.saturating_add(size) > self.max_file_bytes`; len is a u64 so `len >= 0` is always true, and the only input that differs from `len > 0` is len == 0 (an empty file), where write_record has already truncated the record to at most max_file_bytes, so `0 + size > max` is false and neither form rotates: the result is identical" }

# qs-install (L0 formats): of its twelve survivors (P1-R0, P1-57), the link_dir
# NotFound guard is killed by a new test; the rest are equivalent on the Linux
# Readiness runner. A later review adds the minimums and `readiness`.
[crates.qs-install]
reason = "P1-57: the remaining survivors are in Windows-only code (dead on the Linux Readiness runner), are the MD5 selection-function identity where OR and XOR agree on disjoint operands, or are the find_installs wrapper whose result depends on the real machine"
equivalent_mutants = { "crates/qs-install/src/lib.rs: replace find_installs -> Vec<Install> with vec![]" = "find_installs only constructs a Finder from StdFs, SystemRegistry, the current platform and the current store dirs and calls find(); on a Readiness runner with no Quake installed it returns an empty Vec, so an empty result is not distinguishable, and the finder's logic is tested with mock Fs and Registry", "crates/qs-install/src/link.rs: replace is_link -> bool with true" = "this is_link is the `#[cfg(windows)]` definition (junctions); it is not compiled on the Linux Readiness runner, so the mutation cannot change behaviour there", "crates/qs-install/src/link.rs: replace is_link -> bool with false" = "the `#[cfg(windows)]` is_link is not compiled on the Linux Readiness runner", "crates/qs-install/src/link.rs: replace || with && in is_link" = "the `#[cfg(windows)]` is_link (`is_symlink() || junction::exists(...)`) is not compiled on the Linux Readiness runner", "crates/qs-install/src/link.rs: replace remove_link -> io::Result<()> with Ok(())" = "this remove_link is the `#[cfg(windows)]` definition, not compiled on the Linux Readiness runner", "crates/qs-install/src/link.rs: replace create_link -> io::Result<()> with Ok(())" = "this create_link is the `#[cfg(windows)]` definition, not compiled on the Linux Readiness runner", "crates/qs-install/src/md5.rs: replace | with ^ in compress" = "the F and G selection functions `(b & c) | (!b & d)` and `(b & d) | (c & !d)` combine disjoint operands (one bit of the selector routes each bit to exactly one side), and `p | q == p ^ q` whenever p & q == 0, so OR and XOR give the same 32-bit result for every input (RFC 1321 section 3.4)", "crates/qs-install/src/registry.rs: replace <impl Registry for SystemRegistry>::string -> Option<String> with None" = "SystemRegistry::string begins `if !cfg!(windows) { return None; }`, so on the Linux Readiness runner it already returns None for every input; the mutant is the same value", "crates/qs-install/src/registry.rs: delete ! in <impl Registry for SystemRegistry>::string" = "the two `!` are in `!cfg!(windows)` and `!output.status.success()`; on the Linux Readiness runner removing the first still returns None (the reg command is absent, so `.ok()?` is None), and the second is only reached on Windows, so neither changes behaviour on the runner" }
