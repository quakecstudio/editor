#
# What docs/compatibility.md says of each corpus codebase beyond what
# `cargo xtask compatibility` measures (P4-21, COMP-9): why one is not compared
# in the compiler differential, or is compared below the bar, and the issues
# that track it. A codebase not listed here has no known gap. The build status
# is measured each time; the behaviour status is the nightly differential's.

