# SPDX-License-Identifier: GPL-3.0-or-later
#
# The conformance corpus: QuakeC codebases and maps the differential and
# conformance tests run against. Nothing listed here is committed to this
# repository; entries are fetched at the pinned commit and checked against the
# recorded SHA-256 (LIC-7). corpus/README.md explains the fields and the policy,
# and `cargo xtask corpus verify` checks this file. The [[asset]] entries at
# the end are the open game data CI runs engine scenarios with (QA-4); see
# docs/test-assets.md and `cargo xtask assets`.
#
# Every license below was read from the item's own files at the pinned commit;
# `evidence` names those files and [source.checksums] pins their contents.
# Licenses were recorded on 2026-10-15.

schema = 1

# Never fetched by any tool and never committed (LIC-4, LIC-5). The ids here
# must also appear as `use = "never"` entries below.
never = ["quakec-1.06", "quoth", "id1-paks"]

# Directories whose tracked Quake content files are this project's own test
# fixtures, written for its tests and carrying its SPDX line, not corpus files.
fixture_dirs = [
  "crates/qc-syntax/src/tests/",
]

# Never fetch from these hosts or repositories: they carry QuakeC 1.06.
blocked_urls = [
  "https://github.com/maddes-b/QuakeC-releases",
]

# ---------------------------------------------------------------------------
# Sources: a repository at a pinned commit, and the files in it whose content
# is pinned by SHA-256 (license evidence and maps).
# ---------------------------------------------------------------------------

