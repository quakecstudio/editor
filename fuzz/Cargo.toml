# Fuzz targets, run with cargo-fuzz on nightly: `cargo xtask fuzz` or `make test-fuzz`.
# Outside the workspace (docs/conventions.md), so it has its own lock file.

[package]
name = "qs-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "=0.4.13", default-features = false, features = ["link_libfuzzer"] }
qc-engines = { path = "../crates/qc-engines" }
qc-lexer = { path = "../crates/qc-lexer" }
qc-progs = { path = "../crates/qc-progs", features = ["fte"] }
qc-preproc = { path = "../crates/qc-preproc" }
qc-project = { path = "../crates/qc-project" }
qc-sema = { path = "../crates/qc-sema" }
qc-syntax = { path = "../crates/qc-syntax" }
qc-trace = { path = "../crates/qc-trace" }
qc-types = { path = "../crates/qc-types" }
qc-vm = { path = "../crates/qc-vm" }
qs-bsp = { path = "../crates/qs-bsp" }
qs-commands = { path = "../crates/qs-commands" }
qs-differential = { path = "../crates/qs-differential" }
qs-map = { path = "../crates/qs-map" }
qs-mdl = { path = "../crates/qs-mdl" }
qs-pak = { path = "../crates/qs-pak" }
qs-settings = { path = "../crates/qs-settings" }
qs-wad = { path = "../crates/qs-wad" }
qs-wav = { path = "../crates/qs-wav" }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qc-progs"
path = "fuzz_targets/qc_progs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qc-vm"
path = "fuzz_targets/qc_vm.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qc-preproc"
path = "fuzz_targets/qc_preproc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qc-project"
path = "fuzz_targets/qc_project.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qc-sema"
path = "fuzz_targets/qc_sema.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qs-bsp"
path = "fuzz_targets/qs_bsp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qs-map"
path = "fuzz_targets/qs_map.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qs-mdl"
path = "fuzz_targets/qs_mdl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qs-pak"
path = "fuzz_targets/qs_pak.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qs-settings"
path = "fuzz_targets/qs_settings.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qs-wad"
path = "fuzz_targets/qs_wad.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qs-wav"
path = "fuzz_targets/qs_wav.rs"
