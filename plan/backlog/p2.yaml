- key: P2-130
  title: Read an FTEQCC extern block as QCC_PR_ParseDefs reads it, nested to any depth
  labels:
  - L2-syntax
  - area:language
  - type:feature
  size: S
  reqs:
  - LANG-5
  - QA-2
  summary: |
    Found by the fifth P2-R2 readiness review (docs/readiness/p2-r2.md), at commit 40f42b0, against the pinned FTEQCC (fte-team/fteqw@f937b9d88f71fc4429db5fe56c6a98d922711b2e, `fteqcc -Tid`). `QCC_PR_ParseDefs` reads an `extern` block (`qcc_pr_comp.c`, the branch `if (!hadmodifier && pr_token_type == tt_immediate && pr_immediate_type==type_string)`) by comparing `pr_token` with `strcasecmp(pr_token, "C")` and `"QC"`, then `if (!QCC_PR_CheckToken ("{")) QCC_PR_ParseDefs(NULL, false); else for(;;) { if (QCC_PR_CheckToken("}")) break; if (pr_token_type == tt_eof) { QCC_PR_Expect ("}"); break; } QCC_PR_ParseDefs(NULL, false); }`, and `QCC_PR_ParseDefs` starts with `while (QCC_PR_CheckToken(";"))` and then reads a type. The profile's parser (`Parser::extern_block`, `crates/qc-syntax/src/parser/mod.rs`) differs in three ways. (1) It recurses with no nesting level: `extern_block` calls `block_item`, which calls `item` or `extern_block` again, and never `Parser::enter`, so 5000 nested `extern "C" { ` blocks overflow a 2 MiB test thread's stack (`fatal runtime error: stack overflow`), as do 100000 of the unbraced `extern "C" extern "C" ... float x;` at file level and in a body, and 500 report no "nesting too deep" (QC-27.15, FTEF-18.26). (2) It takes a block with no definition where FTEQCC reads one: `extern "C"`, `extern "C";`, `extern "C" ;;;` and `extern "C" "QC"` at the end of a file, which FTEQCC refuses with `"" is not a type`, and `extern "C" { ; }`, which it refuses with `"}" is not a type`, all accepted with no error. (3) It compares more of the string than `strcasecmp` does: `pr_token` ends at its first NUL, so `extern "C\x00x" { ... }` and, under `#pragma flag enable qccx`, `extern "C":"x" { ... }` are `"C"` blocks to FTEQCC (it refuses `string s = "\9";` in them, "Bad character code \9"), and it is the one string token the lexer read, so with `#define C "C"` FTEQCC reads `extern C C { ... }` as the block `"C"` and the definition `"C" ...`, `"C" is not a type`, where the profile joins the two strings. Each program was a case of the builtin differential (`cargo xtask oracles builtins --record` with the review's cases) on macOS arm64, where the profile accepted it and FTEQCC refused it.
  depends:
  - P2-121
  deliverable:
  - 'crates/qc-syntax (`parser/mod.rs`, `Parser::extern_block` and `block_item`) and docs/spec/dialect-fteqcc.md FTEF-21.2 and FTEF-18.26: each `extern` block one nesting level (`Parser::enter` and `leave`), so no nesting of blocks, braced or not, at file level or in a body, exhausts the stack; the block''s definitions read as `QCC_PR_ParseDefs` reads one, its `;`s skipped and then a definition required, so a block or a one-definition `extern "STRING"` that reaches the end of the file or a `}` with no definition is the error FTEQCC gives; and the linkage compared as `strcasecmp` compares `pr_token`, up to its first NUL and over only the string token the lexer joined, not a string from another macro expansion; each a spec statement and a citing test'
  acceptance:
  - 'Under the FTEQCC profile 100000 nested `extern "C" { `, closed and unclosed, and 100000 unbraced `extern "C" ` before a definition, at file level and in a body, parse on a 2 MiB thread with E0509 "nesting too deep", every byte kept and the tree within the depth the other nesting tests allow'
  - '`extern "C"`, `extern "C";` and `extern "C" "QC"` at the end of a file and `extern "C" { ; }` are errors; `extern "C\x00x" { string s = "\9"; }`, the same under `qccx` with `"C":"x"`, and `#define C "C"` then `extern C C { string s = "\9"; }` are refused as the pinned FTEQCC refuses them'
  - 'The builtin differential (`cargo xtask oracles builtins`) holds these programs as cases with 0 unexplained differences'
  verify:
  - cargo test -p qc-syntax
  - cargo xtask oracles builtins
- key: P2-131
