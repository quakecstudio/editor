  - 'crates/qc-engines: once P2-66 parses `#"NAME"` and `:NAME`, a builtin declared so is keyed by `NAME` as `#0:NAME` is (ENGT-4.5), since FTEQCC sets `fname` from the string and leaves `binum` 0'
  acceptance:
  - 'Under the FTEQCC profile `#123456789` is keyed 123456792, the `(int)` of its `f32` value, and a number whose `f32` is outside `int` follows a stated rule; the vanilla rule for numbers above 2^24 is a spec statement with its quote and a test; `#"ex_bprint"` and `:ex_bprint` are keyed by name and give the W0311 of ENGT-4.5 for an engine without it; each test cites its statement'
  verify:
  - cargo test -p qc-engines
