  title: 'Spec: FTEQCC features used by the rerelease QuakeC'
  labels:
  - L2-syntax
  - area:language
  - type:spec
  - clean-room:spec
  size: M
  reqs:
  - COMP-3
  - LANG-5
  - LIC-2
  depends:
  - P1-06
  deliverable:
  - 'docs/spec/dialect-fteqcc-rerelease.md: inventory of every non-vanilla construct in the rerelease codebases (from the rerelease source and public FTEQCC documentation), with syntax, semantics and progs
