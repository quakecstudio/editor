  - 'xtask/src/oracles/builtins.rs and xtask/fixtures/oracles/builtin-outcomes.json (FTE-23.8): a differential of every builtin-initialiser form in a cross product against the pinned FTEQCC and id''s qcc, run by `cargo xtask oracles`, with the oracles'' outcomes recorded so `cargo test -p xtask` checks the profiles on every host'
  acceptance:
  - 'Under the FTEQCC profile `= #16d;`, `= #16.0d;`, `= :16d;`, `= # 5;`, `= # "x";` and `= #''a'';` are E0209 and `builtin_binum` gives `16d` no number; `= #"ab" "cd";` and `= :"x" "y";` parse with no error and `engine_name` gives `abcd` and `xy`; `= :''a'';`, `= : "nmr";` and the vanilla `= # 5;`, which id''s `qcc` binds as 5, stay as they are; each with a test citing the statement it pins'
  verify:
  - cargo test -p qc-syntax
