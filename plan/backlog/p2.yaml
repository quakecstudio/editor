  deliverable:
  - 'crates/qc-syntax: under the FTEQCC profile every construct that nests counts towards QC_MAX_NESTING as QC-27.15 requires ("this compiler bounds the depth of its syntax tree so that no input can exhaust its stack"). The P2-R2 review (docs/readiness/p2-r2.md) found, at commit 58c060c, that `parse_with(.., Dialect::Fteqcc)` overflows the test thread''s stack and aborts the process on 100000 repeats of a prefix `-`, `+`, `++` or `--` (`a = ----...a;`), of `()` after a type (`float()()()... f;`), of `*` after a type (`float***... p;`), and of a leading `-` in a state frame (`void() f = [---...1, f] {};`) or a parameter default (`void(float a = ---...1) f;`); the type forms give no diagnostic at all at 2000 repeats (tree depth 2003). The tree also grows past the limit for nested `struct {` (depth 773 at 2000) and C-style parameter lists (774), where it should stop near 3 x QC_MAX_NESTING as the vanilla forms do'
  - 'crates/qc-preproc and docs/spec/dialect-fteqcc.md: the `#if` nesting limit (`MAX_DEPTH = 64` in src/cond.rs, under which a deeper expression is false) stated as a deliberate divergence, with its reason, in FTEF-14.11 or a new statement, since FTEF-14.11 now says only that the errors FTEQCC reports are false, and the test `fteqcc_errors_are_false` cites it for 100 nested parentheses, which is not one of those errors'
  acceptance:
  - 'A qc-syntax test, the FTEQCC counterpart of `deep_input_does_not_overflow`, parses 100000 repeats of each form above under the FTEQCC profile, gets back every byte and reports E0509; a second asserts each form at the limit and one past it, as `nesting_limit` does for vanilla'
  - 'A qs-tests case resolves each of those inputs through qc_sema::Db under the FTEQCC profile without exhausting the test thread''s stack'
  - The `#if` depth limit has a spec statement, cited by the test that pins it
  verify:
  - cargo test -p qc-syntax -p qc-preproc -p qs-tests
