  - 'xtask/src/oracles/builtins.rs and xtask/fixtures/oracles/builtin-outcomes.json (FTE-23.8): a differential of every builtin-initialiser form in a cross product against the pinned FTEQCC and id''s qcc, run by `cargo xtask oracles`, with the oracles'' outcomes recorded so `cargo test -p xtask` checks the profiles on every host'
  acceptance:
