- key: P2-74
  title: Keep the spacing of a macro's body when the semantic model renders its expansion
  labels:
  - L3-semantics
  - area:language
  - type:feature
  size: S
  reqs:
  - LANG-4
  - LANG-5
  depends:
  - P2-32
  - P2-69
  deliverable:
  - 'crates/qc-sema/src/expand.rs `render` and `adjacent`, and docs/spec/language.md QC-9.7 (or a new statement beside it): the semantic model renders a module''s expansion as text and puts a space between every two tokens a macro made (`adjacent` is false whenever either token has an `expansion`), so the parser never sees two of them touching. Since P2-69 (#473) made the FTEQCC `#` a builtin only when the byte right after it is `"`, `-`, a digit, `)` or `,` (FTE-23.1), a builtin initialiser from an object-like macro is E0209 under the FTEQCC profile: `#define B #5` then `void() f = B;`, and the same with `#-5`, `#"ex_a"` and `#5:ex_a`, each reaching the parser as `# 5` and so on. The pinned FTEQCC (fte-team/fteqw@f937b9d88f71fc4429db5fe56c6a98d922711b2e, `-Tid`) compiles each with no error and binds `#5` as builtin 5 named `f` and `#5:ex_a` as builtin 5 named `ex_a`; before #473 the profile accepted them. The same rendering breaks a C label from a macro (FTEF-18.23, a name with its `:` right after it): `#define L lbl:` then `void() f = { L goto lbl; };` gives W0313, E0204 and E0301, where FTEQCC compiles it. Found by the fourth P2-R3 review (docs/readiness/p2-r3.md) at commit bdfebf5'
  - 'crates/qc-sema/README.md: the **Spec statements** line lists FTE-23.7, which `LiteralValue::builtin_function` and `Resolver::same_value` implement since #473, so the Readiness `spec` job counts it against qc-sema (the same review found it missing)'
  acceptance:
  - 'Through `Db::analyze_module` under the FTEQCC profile, `void() f = B;` with `B` defined as `#5`, `#-5`, `#"ex_a"` or `#5:ex_a` gives no error and lowers to the builtin number and engine name the pinned FTEQCC binds, `#define L lbl:` used as a statement is a label, and two tokens of one expansion that are apart in the macro body (or come from different macros or arguments) still render apart; every adjacency rule the parser applies (FTE-23.1, FTE-23.4, FTEF-18.23) is checked with a macro-made case; each with a test citing the statement it pins'
  - 'qc-sema''s README lists FTE-23.7, and the Readiness `spec` job counts it for qc-sema'
  verify:
  - cargo test -p qc-sema
- key: P2-75
  title: Read FTEQCC's character-constant escapes as its string escapes
  labels:
  - L2-syntax
  - area:language
  - type:feature
  size: S
  reqs:
  - LANG-5
  depends:
  - P2-72
  deliverable:
  - 'crates/qc-lexer (`character`, `escape_code`, `braced_code`) and docs/spec/dialect-fteqcc.md (a statement replacing FTEF-13.12): `QCC_PR_LexVector` (qcc_pr_lex.c, fte-team/fteqw@f937b9d88f71fc4429db5fe56c6a98d922711b2e) reads a character constant''s escape with `QCC_PR_LexEscapedCodepoint`, as a string does (FTEF-13.11), so "Unknown escape char", "Bad character code" for `\{` with a byte that is no digit or `\x` with no hex digit, and "Unicode character terminated unexpectedly" for `\u` and `\U` are errors there too. The FTEQCC lexer reads a character constant with the old `escape_code`, which takes any other escape as its byte and reports none of these (FTEF-13.12). Found while writing FTEF-13.11 for P2-72'
  acceptance:
  - 'Under the FTEQCC dialect every escape of FTEF-13.11 in a character constant gives the code and the error FTEQCC gives, recorded against the pinned FTEQCC for each escape (a differential or the spec''s test vectors); each with a test citing the statement it pins'
  verify:
  - cargo test -p qc-lexer
- key: P2-76
  title: Expand an FTEQCC macro only where FTEQCC's macro check ends its word
  labels:
  - L2-syntax
  - area:language
  - type:feature
  size: S
  reqs:
  - LANG-5
  depends:
  - P2-71
  deliverable:
  - 'crates/qc-preproc (`try_expand`) and docs/spec/dialect-fteqcc.md FTEF-14 (a new statement): `QCC_PR_Lex` (qcc_pr_lex.c, fte-team/fteqw@f937b9d88f71fc4429db5fe56c6a98d922711b2e) looks a name up as a macro with `QCC_PR_CheckCompConst`, whose word runs to the first white space or one of `)(+-*/|&=^~[]"{};:<>,.#`, not to the end of the name. So a name followed directly by another byte, such as `!`, `''`, `?`, `@`, `$`, `%` or a byte of 0x80 or more, is no macro use: with `#define N 5`, the pinned FTEQCC reports `if (N!=5)` as "Unknown value \"N\"". The FTEQCC preprocessor expands every name that is a macro; FTE-23.10 already reads the word this way after a `#`. Found while writing FTE-23.10 for P2-71'
  acceptance:
  - 'Under the FTEQCC dialect a macro name followed directly by a byte that does not end `QCC_PR_CheckCompConst`''s word stays a name, for each such byte, and one followed by a byte that ends it expands; the vanilla dialect expands as before; recorded against the pinned FTEQCC; each with a test citing the statement it pins'
  verify:
  - cargo test -p qc-preproc
- key: P2-77
  title: Render a macro argument against the body token it is written next to
  labels:
  - L3-semantics
  - area:language
  - type:feature
  size: S
  reqs:
  - LANG-4
  - LANG-5
  depends:
  - P2-74
  deliverable:
  - 'crates/qc-sema/src/expand.rs `adjacent` (and the span `qc-preproc` gives a substituted argument, if needed) and docs/spec/language.md (a statement replacing QC-9.14): FTEQCC substitutes a function-like macro''s argument into the body as text (`QCC_PR_ExpandPreProcessorMacro`, qcc_pr_lex.c, fte-team/fteqw@f937b9d88f71fc4429db5fe56c6a98d922711b2e), so an argument written against a body token touches it: `#define L(x) x:` used as the statement `L(lbl)` is the label `lbl:` (FTEF-18.23), and `#define B(n) #n` would be a builtin if `#` did not stringize. The semantic model keeps an argument''s tokens apart from the body''s (QC-9.14), so `L(lbl)` renders as `lbl :`. Found by the self-review of P2-74 (#478)'
  acceptance:
  - 'Through `Db::analyze_module` under the FTEQCC profile, an argument and a body token that touch in the body (`x:` with `x` a parameter) render touching, and ones apart in the body stay apart; `#define L(x) x:` then `L(lbl)` used as a statement is a label, recorded against the pinned FTEQCC; each with a test citing the statement it pins'
  verify:
  - cargo test -p qc-sema
- key: P2-78
  title: "Render a token a macro's `##` makes against the body token written next to it"
  labels:
  - L3-semantics
  - area:language
  - type:feature
  size: S
  reqs:
  - LANG-4
  - LANG-5
  depends:
  - P2-77
  deliverable:
  - 'crates/qc-preproc (`paste`, and what a token `##` or `#` makes is `glued` to) and crates/qc-sema/src/expand.rs `adjacent`, and docs/spec/language.md (a statement replacing QC-9.15): `QCC_PR_ExpandPreProcessorMacro` (qcc_pr_lex.c, fte-team/fteqw@f937b9d88f71fc4429db5fe56c6a98d922711b2e) joins `a ## b` and writes `#param` into the expansion as text, so the token it makes touches the body token written next to it: with `#define P(a,b) a##b:`, the statement `P(l,bl)` is the label `lbl:` (FTEF-18.23) under the pinned FTEQCC. QC-9.15 says a token the preprocessor made touches nothing, so it renders as `lbl :`, no label. A built-in constant (FTEF-14.7) stays apart: `QCC_PR_CheckCompConst` includes its value as a chunk of its own. Found by the self-review of P2-75 to P2-77'
  acceptance:
  - 'Through `Db::analyze_module` under the FTEQCC profile, a `##` paste and a `#` string written against a body token render touching it and ones apart stay apart, a built-in constant touches nothing, and `#define P(a,b) a##b:` then `P(l,bl)` used as a statement is a label, recorded against the pinned FTEQCC (`cargo xtask oracles builtins`); each with a test citing the statement it pins'
  verify:
  - cargo test -p qc-sema
  - cargo xtask oracles builtins
