- key: P2-88
  title: Fix the defects the codebase mapping found in the L0 format crates
  labels:
  - L0-formats
  - area:preview
  - type:bug
  size: S
  reqs:
  - ENG-16
  - MAP-6
  - FND-6
  summary: |
    Found by the codebase mapping at c706ef0 (the per-file sweep of the L0 crates) and confirmed by reading the code:
    1. Two readers size an allocation by a count the file gives, with no bound from the input. `Md5Anim::frame` allocates from an unchecked count. `Md5Anim::read` reads `numAnimatedComponents` as an unchecked `u64` (crates/qs-mdl/src/md5.rs:637-638) and accepts a tiny file with `numJoints 0` and no `frame` blocks; `frame(0)` then runs `vec![0.0; len]` with that count (md5.rs:693-701), which aborts on allocation failure or panics on capacity overflow. MD5-3.6 says a frame never given is all zero and sets no bound on the count. Neither the proptest (crates/qs-mdl/src/md5/tests.rs:736-743) nor the fuzz target (fuzz/fuzz_targets/qs_mdl.rs, which calls `pose` but not `frame`) reaches it. In the same class, `Bsp::leaf_pvs` sizes the PVS row from model 0's `visleafs` (crates/qs-bsp/src/lib.rs:1699-1721), so a small BSP with `visleafs` near `i32::MAX` makes every call allocate about 268 MB; it is bounded and does not panic, and the fuzz target checks PVS only for rows of at most 65,536 bits (fuzz/fuzz_targets/qs_bsp.rs:50-54).
    2. The qs-map `DuplicateKey` diagnostic says "qbsp and the game use the first, ericw-tools the last" (crates/qs-map/src/check.rs:36-37, :82). MAP-2.5 says qbsp "looks a key up by its last occurrence", as `QbspEntity::value_for_key` does (crates/qs-map/src/qbsp.rs:196-204), and MAP-2.6 says the game sees the first occurrence of a map qbsp compiled. The qbsp half of the message is wrong.
    3. The qc-lno property `reading_arbitrary_bytes_never_panics` cannot fail: it asserts `matches!(.., Ok(_) | Err(_))`, which always holds (crates/qc-lno/src/tests.rs:214). Its neighbour `an_accepted_file_round_trips_byte_for_byte` rereads the input bytes rather than the written ones, contrary to its comment (tests.rs:195-197); the assertion before it (tests.rs:194) already pins the round trip, so the reread is only redundant.
  environment: |
    main at c706ef0; found by reading the code (the codebase mapping), not by a failing run
  depends: []
  deliverable:
  - 'crates/qs-mdl/src/md5.rs and docs/spec/md5.md: a statement that bounds what `numAnimatedComponents` may make `Md5Anim::read` or `frame` allocate (by the input''s size or a named limit), implemented so a small file cannot abort or panic the process; fuzz/fuzz_targets/qs_mdl.rs calls `frame` on every animation it reads'
  - 'crates/qs-bsp/src/lib.rs and docs/spec/bsp.md: `leaf_pvs`''s allocation bounded the same way, or a statement that records why a row sized by `visleafs` is id''s behaviour and the bound the caller relies on; fuzz/fuzz_targets/qs_bsp.rs checks PVS rows of any size it can afford'
  - 'crates/qs-map/src/check.rs: the `DuplicateKey` message and rustdoc say what MAP-2.5 and MAP-2.6 say'
  - 'crates/qc-lno/src/tests.rs: the never-panics property asserts something about the result that can fail (for an accepted file, that its counts match its tables), and the round-trip property drops its redundant reread or rereads what `write` returned'
  acceptance:
  - 'A test citing the new MD5 statement reads an animation of a few bytes with `numJoints 0` and `numAnimatedComponents` near `u64::MAX`, and `read` and `frame(0)` give the stated error or a bounded result; the test aborts or panics before the fix'
  - 'A test citing MAP-2.5 and MAP-2.6 pins the `DuplicateKey` message'
  - 'A test citing the BSP statement shows `leaf_pvs` on a small file with a huge `visleafs` stays within the stated bound'
  - 'The rewritten never-panics property fails against a deliberately broken `LnoFile::read`, recorded in the PR'
  - 'cargo xtask fuzz qs-mdl --time 10m and cargo xtask fuzz qs-bsp --time 10m run clean, recorded in the PR'
  verify:
  - cargo test -p qs-mdl -p qs-bsp -p qs-map -p qc-lno; cargo xtask fuzz qs-mdl --time 10m; cargo xtask fuzz qs-bsp --time 10m
- key: P2-89
  title: Keep the call depth after a host error and fix the differential host's departures from id
  labels:
  - L1-vm
  - area:vm
  - type:bug
  size: M
  reqs:
  - FND-3
  - FND-5
  - FND-8
  summary: |
    Found by the codebase mapping at c706ef0 (the per-file sweep of the L1 crates and qs-differential), each checked against id's source at id-Software/Quake@bf4ac424ce754894ac8f1dae6a3981954bc9852d:
    1. Host errors reset the call depth. id's `PF_error` (WinQuake/pr_cmds.c) prints and calls `Host_Error ("Program error");` directly; only `PR_RunError` (WinQuake/pr_exec.c) first sets `pr_depth = 0;` ("dump the stack so host_error can shutdown functions"). BUILTIN-3.2 says a host error does not reset the depth, and DIFF-8.4 that the shutdown's `ClientDisconnect` runs start at it, so after `error` 30 calls deep the first QC call fails with `stack overflow`; the oracle scenario at xtask/src/oracles/scenarios/errors.rs:294 pins that. QuakeC Studio collapses every `BuiltinError` into `ErrorKind::Builtin` (`to_run_error`, crates/qc-builtins/src/dispatch.rs:648-657) and `qc_vm::exec::execute` clears the call stack after every error (crates/qc-vm/src/exec.rs:214-237), so its shutdown runs at depth 0 and would diverge from the oracle on any scenario that reaches this. The same holds for VM-2.1: id's `PR_ExecuteProgram` raises `Host_Error ("PR_ExecuteProgram: NULL function");` (WinQuake/pr_exec.c), not `PR_RunError`, and DIFF-8.4 names VM-2.1 beside BUILTIN-3.2, but `execute` clears the stack after `ErrorKind::NullRunFunction` too.
    2. The map spawner reports a full edict array as `ED_ParseEdict: parse error` (crates/qs-differential/src/host/spawner.rs:44-48). id's `ED_Alloc` calls `Sys_Error ("ED_Alloc: no free edicts");` (WinQuake/pr_edict.c), the error EDICT-6.2 and DIFF-8.1 name, and a fatal error ends the scenario with no shutdown (DIFF-8.6).
    3. The spawner stores `atoi(value)` for an `ev_entity` key (crates/qs-differential/src/edict8.rs:298-302); id's `ED_ParseEpair` stores `*(int *)d = EDICT_TO_PROG(EDICT_NUM(atoi (s)));` (WinQuake/pr_edict.c). The two agree only for 0, and id's `EDICT_NUM` raises `Sys_Error ("EDICT_NUM: bad number %i", n);` for a number below 0 or from `sv.max_edicts` on (EDICT-1.7), a fatal error the spawner does not raise.
    4. DIFF-11.2 counts statement coverage over "only the records before the first divergence"; `records_up_to` counts up to and including the diverging change-carrying record (crates/qs-differential/src/suite.rs:202-216), and the test pins the including count (crates/qs-differential/src/suite/tests.rs:208-215).
    5. The test `message_dest_variants` cannot fail: it asserts `dest == dest` for each `MessageDest` under a DIFF-6.6 citation (crates/qc-builtins/src/tests.rs:1530-1548).
  environment: |
    main at c706ef0; found by reading the code and id's source (the codebase mapping), not by a failing run
  depends: []
  deliverable:
  - 'crates/qc-builtins (`to_run_error`) and crates/qc-vm (exec.rs, error.rs): a host error a builtin raises reaches the VM as a host error, and after every host error, VM-2.1''s `PR_ExecuteProgram: NULL function` included, the outermost run leaves the call depth where the error left it (BUILTIN-3.2, VM-2.1); a runtime error still resets it (VM-19.1)'
  - 'crates/qs-differential/src/host.rs: after a host error the shutdown''s `ClientDisconnect` runs start at that depth (DIFF-8.4)'
  - 'crates/qs-differential/src/host/spawner.rs: a full edict array while the map spawns is `ED_Alloc: no free edicts`, a fatal error with no shutdown (EDICT-6.2, DIFF-8.1, DIFF-8.6)'
  - 'crates/qs-differential/src/edict8.rs: an `ev_entity` key stores the entity value of edict `atoi(value)`, as `ED_ParseEpair` does (EDICT-8.2), and a number out of range is the fatal `EDICT_NUM: bad number` error (EDICT-1.7, DIFF-8.6)'
  - 'crates/qs-differential/src/suite.rs, or docs/spec/differential.md with DIFF-11.2 withdrawn and replaced (docs/spec/README.md): the coverage count and the statement agree on the diverging record'
  - 'crates/qc-builtins/src/tests.rs: the `dest == dest` loop of `message_dest_variants` replaced by an assertion that can fail, keeping its BUILTIN-4.4 `EngineOnly` message assertion'
  acceptance:
  - 'A test citing BUILTIN-3.2 and DIFF-8.4 runs `error` 30 calls deep with one entered client and shows the shutdown''s first QC call fail with `stack overflow`, as the oracle scenario does, and a test citing VM-2.1 shows the same after a NULL-function run started 30 calls deep; both fail before the fix; a test citing VM-19.1 still shows depth 0 after a runtime error'
  - 'Tests citing EDICT-6.2 and EDICT-8.2 pin the spawner''s error text and an `ev_entity` key of `1` and of `-1`, each failing before the fix'
  - 'A test citing DIFF-11.2 pins the boundary the statement states'
  - '`cargo xtask differential --fast` still reports zero divergences, recorded in the PR'
  verify:
  - cargo test -p qc-vm -p qc-builtins -p qs-differential; cargo xtask oracles; cargo xtask differential --fast
- key: P2-90
  title: Fix the defects the codebase mapping found in the repository checks and corpus tooling
  labels:
  - repo
  - area:process
  - type:bug
  size: L
  reqs:
  - QA-1
  - TEST-3
  - LIC-7
  - PM-6
  summary: |
    Found by the codebase mapping at c706ef0 (the per-file sweep of qs-tests, xtask and plan/) and confirmed by reading the code:
    1. The spec-citation ratchet counts every line whose first non-blank text is `// spec ` in any `.rs` file under `crates/`, `apps/` and `xtask/` (crates/qs-tests/tests/it/spec_coverage.rs:137-157), and so does the per-crate spec check of `cargo xtask readiness` (xtask/src/readiness.rs:876, :1132). TEST-3 asks that every statement "has a test citing it" (docs/testing.md:33). Such lines exist outside tests, for example crates/qs-differential/src/scenario.rs:670 and :688, crates/qc-edict/src/store.rs:296 and crates/qc-builtins/src/dispatch.rs:251, so a statement can count as cited with no test.
    2. License rule H4 requires each cited upstream's copyright line to come before any other Copyright line (xtask/src/ported.rs:141-151), so a file citing both id-Software/Quake and fte-team/fteqw, which ADR-0017 allows, can never pass: the second upstream's line always follows the first's.
    3. plan/check.py records an unknown milestone as a problem and then raises `ValueError` from `PHASE_ORDER.index` (plan/check.py:196), so the user gets a traceback instead of the problem list.
    4. `cargo xtask sema-corpus` checks that every listed difference was used once per module (xtask/src/sema_corpus.rs:115-121, :375-381), so a codebase with several modules fails every module a listed difference does not belong to.
    5. The corpus cache check is lexical: `dest.starts_with(root)` after joining the current directory, without resolving `..` or symlinks (xtask/src/corpus.rs:172-184), so a `--dest` that reaches the tree through `..` or a symlink passes LIC-7's rule that the corpus is never kept in the source tree.
    6. `corpus fetch` checks each archive member with `safe_member` just before writing it (xtask/src/corpus/fetch.rs:195-202), so the files written before an unsafe member stay on disk when it aborts.
    7. `cargo xtask ratchet` reads every past version of ratchets.toml with `git show` and treats a failure as the file being absent (`.ok()`, xtask/src/ratchet.rs:322), so a version it cannot read silently skips the history check for that commit.
  environment: |
    main at c706ef0; found by reading the code (the codebase mapping), not by a failing run
  depends: []
  deliverable:
  - 'crates/qs-tests/tests/it/spec_coverage.rs and xtask/src/readiness.rs: a `// spec` line outside test code in `crates/` (outside `#[cfg(test)]` modules and `tests` directories and files, as in crates/qc-vm/src/ops.rs, crates/qc-edict/src/store.rs, crates/qc-builtins/src/dispatch.rs and crates/qs-differential/src/scenario.rs) no longer counts; xtask''s oracle scenarios (xtask/src/oracles/scenarios/), which are differential tests, and test vector modules keep counting; the rule is written in docs/spec/README.md; each statement left without a citation gets a test citing it, and those `// spec` comments become plain comments'
  - 'xtask/src/ported.rs: H4 accepts a header that carries the copyright line of every cited upstream above ours, in the order of the `Ported from` lines, and docs/porting.md shows such a header'
  - 'plan/check.py: an unknown milestone is reported in the problem list and the run exits 1 without a traceback'
  - 'xtask/src/sema_corpus.rs: listed differences are counted across a codebase''s modules'
  - 'xtask/src/corpus.rs and xtask/src/corpus/fetch.rs: the cache check resolves the path through its nearest existing ancestor before comparing, so a cache that does not exist yet is still accepted, and an archive is checked in full before any file of it is written'
  - 'xtask/src/ratchet.rs: a `git show` failure for a commit that touched ratchets.toml is an error, not an absent file'
  acceptance:
  - 'A test shows a `// spec` line in non-test code no longer counts, and the ratchet passes with docs/spec/coverage-baseline.tsv not grown'
  - 'A licenses test passes a header citing id-Software/Quake and fte-team/fteqw with both copyright lines, and fails it with either missing'
  - 'A test in plan/test_check.py shows an unknown milestone reported as a problem, with no exception'
  - 'Tests show a two-module codebase with a difference listed for one module passes sema-corpus, a cache path through `..` or a symlink into the tree is refused, an archive with an unsafe member writes no file, and an unreadable ratchets.toml version fails `cargo xtask ratchet`; each fails before the fix'
  verify:
  - cargo test -p qs-tests -p xtask; python3 plan/check.py; (cd plan && python3 -m unittest discover -p 'test_*.py')
