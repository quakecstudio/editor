  deliverable:
  - 'crates/qc-preproc (`collect_args`, `fte_macro.rs`) and docs/spec/dialect-fteqcc.md FTEF-14.18 and FTEF-14.20 (or new statements beside them): `QCC_PR_ExpandPreProcessorMacro` (qcc_pr_lex.c, fte-team/fteqw@f937b9d88f71fc4429db5fe56c6a98d922711b2e) finds an argument''s end by scanning bytes, skipping only a `"` string (`do { pr_file_p++; } while( (pr_file_p[-1] == ''\\'' || pr_file_p[0] != ''\"'') && *pr_file_p && *pr_file_p != ''\n'' );`), so a `,` or `)` inside a character constant or a comment ends the argument, and a string whose last byte before its `"` is a `\` does not end there. The fourth P2-R2 review compared the profile at commit 2a48d73 with the pinned FTEQCC (`-Tid`, as cases of `cargo xtask oracles builtins` of the form `void() f = USE;`): with `#define E(n) :n`, FTEQCC refuses `E('','')`, `E('')'')` and `E(''('')` ("Bad vector"), which the profile binds as builtins 44, 41 and 40; with `#define M(x) x`, FTEQCC refuses `M(#5 /* ) */)` ("EOF inside comment"), `M(#5 /* , */)` and `M(#5 // )` then a line break and `)`, which the profile binds as builtin 5; with `#define E(n) n`, FTEQCC refuses `E(:"ex\\")` and `E(:"ex\\") ")"` and `E(#5:ex_a\` then a line break and `)`, which the profile accepts; with `#define S(a) #a`, FTEQCC binds `:S(e''x)` by the name `e''x`, which the profile refuses (its lexer opens a character constant at the `''`). And a built-in constant an argument copies as its value replaces the white space and `//` comment before it as well (`end = QCC_PR_CheckBuiltinCompConst(...)` is written in place of `argstart` to `argend`): with `#define E(n) n`, FTEQCC binds `E(# __LINE__)` as builtin 2, and `E(#//` then a line break and `__LINE__)`, and with `#define K(x) x`, `K(#` then a line break and `__LINE__)`, as builtin 3, where the profile refuses all three'
  acceptance:
  - 'Under the FTEQCC dialect each case above preprocesses and binds as the pinned FTEQCC does, and the cases are added to the macro family of `cargo xtask oracles builtins` with 0 unexplained differences; the vanilla dialect is unchanged; each with a test citing the statement it pins'
  verify:
  - cargo test -p qc-preproc
  - cargo xtask oracles builtins
- key: P2-81
  title: Store an FTEQCC macro's body as FTEQCC's `#define` reader does
  labels:
