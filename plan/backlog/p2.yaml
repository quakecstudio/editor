- key: P2-50
  title: Bound the FTEQCC profile's nesting so no input exhausts the parser's stack
  labels:
  - L2-syntax
  - area:language
  - type:feature
  size: S
  reqs:
  - LANG-5
  - QA-2
  depends:
  - P2-26
