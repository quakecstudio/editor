- key: P2-118
  title: Honour FTEQCC's warning settings and lexer flags on the definitions path
  labels:
  - L3-semantics
  - area:language
  - type:feature
  size: M
  reqs:
  - LANG-4
  - LANG-5
  summary: |
    What the L2 port (P2-116, #547) and the L3 port (P2-117, #546) left on the L3 side, since #546 merged before #547:
    1. The definition warnings W0207 to W0226 and W0314 do not pass through FTEQCC's warning settings (`-W` flags, `#pragma warning`, `-Werror`): they need `FteWarning::of_code` entries and `WarningSettings::reported_code`, as the L2 warnings have.
    2. `Db::parse` does not call `qc_syntax::parse_module_source`, so a module's source-form root is not read past a `#!` line (PRJ-4.10).
    3. `fteqcc_string_bytes` lexes a string with the default lexer flags, not the file's (`FileOutput::lex_flags`), so under `utf8`, or with `qcfuncs` off, a string's value differs.
    4. The parser reads `@` (a `qccx` unary in `QCC_PR_Term`) and `^^` as no operator.
    5. The `assumeint`, `assumedouble` and `caseinsensitive` flags (FTEF-12.14) do not change the types and keywords the semantic model reads.
  depends:
  - P2-116
  - P2-117
  deliverable:
