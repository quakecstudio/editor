- key: P2-105
  title: The FTEQCC preprocessor reads a directive after a `\` that ends a line of code
  labels:
  - L2-syntax
  - area:language
  - type:bug
  size: S
  reqs:
  - LANG-1
  - LANG-5
  summary: |
    In code, FTEQCC's `QCC_PR_LexPunctuation` (engine/qclib/qcc_pr_lex.c, fte-team/fteqw@f937b9d88f71fc4429db5fe56c6a98d922711b2e) passes over a `\` and the line break after it (`pr_file_p+=2;`) without calling `QCC_PR_NewLine`, so a `#` at the start of the next line is no directive: the pinned FTEQCC refuses `float g; \`, a line break and `#define N 1` with "Explicit precompiler usage when not defined define". The FTEQCC preprocessor (crates/qc-preproc/src/lib.rs, `fte_file_directive` with `fte_directive::starts_line`) takes that `#` to start a line and runs the directive, and so does the project graph, which reads code with the same lexer (PRJ-5.13).
  environment: |
    feat/518-graph-fte-directives; found by the self-review of P2-101 against the pinned FTEQCC
  depends:
  - P2-101
  deliverable:
  - 'crates/qc-preproc (and qc-lexer where its tokens need it): under an FTEQCC dialect a `#` after a `\` and a line break in code starts no directive, for the preprocessor and the graph reader alike; docs/spec/dialect-fteqcc.md states it'
  acceptance:
  - 'The builtin differential holds `float g; \` before `#define`, `#undef` and `#include` lines, and the profile and the project graph agree with the recorded FTEQCC on each, with a test citing the statement it pins; a regression test fails before the fix'
  verify:
  - cargo test -p qc-preproc
  - cargo test -p xtask
- key: P2-106
