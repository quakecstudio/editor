  deliverable:
  - 'crates/qc-preproc (the `#define` reader, `fte_opens_arguments`) and docs/spec/dialect-fteqcc.md FTEF-14 (new statements, and FTEF-14.18 corrected): `QCC_PR_PreProcessor_Define` (qcc_pr_lex.c, fte-team/fteqw@f937b9d88f71fc4429db5fe56c6a98d922711b2e) stores a body with each `/* */` comment and each `\` before a line break dropped and the white space around them kept, so a function-like macro''s name and its `(` written apart only by those in a body are apart only by spaces when the body is read: with `#define M(x) x`, the pinned FTEQCC (`-Tid`) binds `void() f = K;` as builtin 5 for each of `#define K M /**/ (#5)`, `#define K M/**/ (#5)`, `#define K M \` then a line break and `(#5)`, and `#define K M\` then a line break and ` (#5)`, where the profile at commit 2a48d73 leaves `M` a name and refuses `f` (FTEF-14.18 says a comment before the `(` leaves the name, which holds for the source but not for a stored body). The reader also toggles its `quote` flag at every `"`, an escaped one included (`if (*s == ''\"'') quote=!quote;`), and ends the body at a `//` outside it, so `#define N :"ex\"_a//"` stores `:"ex\"_a` and FTEQCC refuses `void() f = N;`, which the profile binds by the name `ex"_a//`. And a parameter list naming one parameter twice is an error ("duplicate macro paramter name"), so FTEQCC refuses `#define E(n, n) n`, which the profile accepts. Found by the fourth P2-R2 review'
  acceptance:
  - 'Under the FTEQCC dialect each case above preprocesses and binds as the pinned FTEQCC does, a duplicate parameter name is a diagnostic, and the cases are added to the macro family of `cargo xtask oracles builtins` with 0 unexplained differences; the vanilla dialect is unchanged; each with a test citing the statement it pins'
