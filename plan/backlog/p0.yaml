milestone: P0
issues:
- key: P0-01
  title: Scaffold the Cargo workspace with the vouch conventions
  labels:
  - repo
  - area:process
  - type:chore
  size: S
  reqs:
  - ARCH-3
  - PRIN-7
  - CONV-1
  - CONV-2
  - CONV-3
  - CONV-4
  - CONV-5
  - CONV-6
  - CONV-14
  - CONV-15
  - CONV-16
  deliverable:
  - docs/conventions.md (drafted 2026-10-15) adopted, with every 'differs from vouch' item confirmed or changed
  - Cargo.toml workspace (resolver 3, crates/*, apps/*, xtask) with [workspace.package], the vouch [workspace.lints.rust] and [workspace.lints.clippy] sets, [workspace.dependencies] policy, release and
    ci profiles
  - rust-toolchain.toml (exact channel), .rustfmt.toml and .clippy.toml as in docs/conventions.md
  - deny.toml with targets, [advisories], [licenses] (confidence-threshold 0.8), [bans] and [sources] (unknown-registry deny, unknown-git warn, crates.io only, git sources pinned to a rev)
  - 'crates/qs-paths: the single paths module; docs/adr/ entry choosing XDG everywhere or native per-OS dirs'
  - README.md, CONTRIBUTING.md, SECURITY.md, CODE_OF_CONDUCT.md, .gitattributes, .gitignore (license files land with P0-08)
  - 'Test modules opt out of the no-panic lints with a module-level inner expect attribute naming each lint and reason = "test code: ...", as in vouch; qs-tests keeps [lints] workspace = true'
  - 'crates/qs-tests: the single cross-crate integration test binary (tests/it/)'
  acceptance:
  - cargo build and cargo test pass on an empty workspace on macOS, Windows and Linux
  - 'Fixture code using unwrap, indexing, unchecked arithmetic, an as-cast, println! and an #[allow] without reason each fails clippy'
  - cargo deny check fails when a dependency license incompatible with GPL-3.0-or-later or a wildcard version is added
  - Every config value matches docs/conventions.md (checked by a script, not by eye)
  - 'Whether unsafe is needed for windowing/wgpu is settled; if so it is confined to one crate with `#[expect(unsafe_code, reason)]`'
  - Release builds of the app binaries use panic = "unwind" so the command guard works (differs from vouch)
  verify:
  - make lint, make test and make audit on all three OSes; conventions conformance script output attached
- key: P0-02
  title: 'Build the Makefile and cargo xtask: ci, layers, licenses, attribution'
  labels:
  - repo
  - area:process
  - type:chore
  size: M
  reqs:
  - ARCH-1
  - QA-1
  - CONV-8
  - LIC-2
  depends:
  - P0-01
  - P0-09
  deliverable:
  - xtask/ crate (started by P0-01 with conventions, clippy-fixtures and deny-fixtures, and P0-07 with adr) gains subcommands ci, layers, licenses, attribution
  - layers.toml mapping every crate to L0-L7 or apps, with the rule that a crate may depend only on lower layers
  - ATTRIBUTION.md format and checker for bundled assets
  - docs/layers.md explaining the layer model with the architecture diagram
  - Makefile with fmt, lint, check, test, test-integration, test-fuzz, test-coverage (cargo-llvm-cov), test-mutants (cargo-mutants), audit, docs-build, bench, ci and help targets, calling cargo and xtask
  acceptance:
  - cargo xtask ci runs fmt --check, clippy -D warnings, tests, conventions, adr, clippy-fixtures, deny-fixtures, layers, licenses, attribution and exits non-zero on any failure
  - Adding a dependency from an L1 crate to an L3 crate fails cargo xtask layers with a message naming both crates
  - A crate missing from layers.toml fails the check
  - An asset file not listed in ATTRIBUTION.md fails cargo xtask attribution
  - Every committed file is license-scanned (e.g. askalono) and carries an allowed SPDX header; a file without one fails
  - 'cargo xtask licenses enforces the ported-file header rule in docs/porting.md: a file that says it is ported from id''s code but lacks id''s copyright line, or does not cite the file, function
    and commit, fails; fixtures are the passing and failing headers in docs/porting.md'
  - make ci runs exactly what CI runs
  verify:
  - xtask self-tests with fixture workspaces for each failure case
- key: P0-03
  title: Set up CI on macOS, Windows and Linux and protect main
  labels:
  - repo
  - area:process
