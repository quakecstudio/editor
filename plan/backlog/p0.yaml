  - P0-02
  - P0-17
  deliverable:
  - .github/workflows/ci.yml with separate Format, Clippy (--locked --all-targets --all-features -D warnings), Unit Tests (Linux, macOS, Windows), Build (every target, --profile ci --locked), cargo-deny
    and dependency-review jobs
  - 'Build targets: aarch64-apple-darwin, x86_64-apple-darwin and a lipo''d universal macOS binary, x86_64 and aarch64 Windows, x86_64 and aarch64 Linux'
  - '.github/workflows/secure_workflows.yml failing any unpinned third-party action; zizmor lint; least-privilege permissions and persist-credentials: false'
  - .pre-commit-config.yaml for prek, SHA-pinned, pre-commit and pre-push hooks as in docs/conventions.md
  - 'Branch protection on main: PR required, all CI jobs required, squash merge only, no force push'
  - A Test Assets job on Linux, macOS and Windows running python3 corpus/assets.py fetch and precache (P0-17), with the download cache keyed on the SHA-256 of corpus/manifest.toml
  acceptance:
  - A PR that breaks fmt, clippy, tests, layering, licenses or deny cannot be merged
  - A PR adding an action pinned by tag instead of SHA fails
  - All six targets and the universal macOS binary build on every PR
  - The Test Assets job fetches and checks the test assets on all three OSes
  verify:
  - A deliberately failing test PR is blocked; screenshot of the protection settings attached
