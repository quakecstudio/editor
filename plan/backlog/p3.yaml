  - TEST-5
  summary: |
    Found by the P2-RA re-review (#88) of #718 (P2-165, whose deliverable asks the target to check "one answer per request id, and positions inside the documents"). `fuzz/fuzz_targets/quakec_lsp.rs` counts the answers that arrive and fails on two for one id, but never fails when a request gets none. Its `didChange` text is drawn from `b' ' + byte % 95`, printable ASCII only, so no edit ever adds or removes a line break or a multi-byte character, the cases that move positions and that P2-161 fixed in `LineIndex`. And its position check allows any line up to the source's lines plus the input's length plus 2, which no answer of the five-line project can exceed. The target has not yet run in the nightly Fuzz workflow (#718 is not merged).
  environment: |
    fix/p2ra-apps-findings at 1abc2984; fuzz/fuzz_targets/quakec_lsp.rs
  depends: []
  deliverable:
  - 'fuzz/fuzz_targets/quakec_lsp.rs: every request id sent answered exactly once; `didChange` text drawn to include line breaks and multi-byte characters; each answered position checked against the open document''s text as the target tracks it from the edits'
  acceptance:
  - 'The target runs in the nightly Fuzz workflow with no crash, linked in the PR, and fails when the server is made to drop one answer by hand, recorded in the PR'
  verify:
  - cargo xtask fuzz quakec-lsp --time 10m
- key: P3-39
  title: The qc-preproc fuzz target finds a stored body's diagnostic reported at every use
  labels:
  - L2-syntax
  - area:language
  - type:bug
  size: S
  reqs:
  - TEST-5
  summary: |
    The nightly Fuzz workflow on main has failed since 2026-11-06 (runs 42210171534, 42364796608 and 42613642874; the 2026-11-08 run failed to install cargo-fuzz). The qc-preproc target panics at fuzz_targets/qc_preproc.rs:68, "diagnostic reported twice: E0106 Unknown frame macro $-", on a 177-byte input whose `#append` body holds `$-` and is used twice. The preprocessor places a diagnostic found in a macro's stored body at the body's bytes, the same place for every use, and only a chunk's lexical errors were kept to one report there (FTEF-14.77); `E0106` for a frame macro reference in the body and `W0117` for a `#` before a word that names no parameter (FTEF-14.61, "for each expansion") were given once per use at that one place, against QCD-1.5.
  environment: |
    main at a6a5bfd; the nightly Fuzz workflow, run 42613642874
  depends: []
  deliverable:
  - 'crates/qc-preproc/src/lib.rs: `Run::report` gives nothing for a diagnostic whose code and span one already in the file''s output has (QCD-1.5), so every report site, not only a chunk''s lexical errors, gives a rule broken at one place once there; `Run::report_also` keeps a directive''s further warnings of other texts at that span (FTEF-14.58, FTEF-12.11) until P3-40 decides'
  - 'docs/spec/dialect-fteqcc.md: FTEF-14.61 withdrawn for FTEF-14.78 (W0117 once at the body''s `#`), and FTEF-14.79 (any diagnostic placed in a stored body is given once there)'
  - 'crates/qc-preproc/src/tests/fteqcc.rs: the crash input as a regression test, and a test of each statement'
  acceptance:
  - 'The crash input preprocesses with no diagnostic reported twice, in a test that fails without the fix'
  - 'cargo xtask fuzz qc-preproc --time 10m runs clean, or a nightly or dispatched Fuzz run on the fix is green, linked in the PR'
  verify:
  - cargo test -p qc-preproc
  - cargo xtask fuzz qc-preproc --time 10m
- key: P3-40
  title: Decide how two distinct preprocessor warnings at one span meet QCD-1.5
  labels:
  - L2-syntax
  - area:language
  - type:decision
  - needs:human
  size: S
  reqs:
  - TEST-5
  summary: |
    Found while fixing P3-39. QCD-1.5 says no two diagnostics of one input have the same code and the same span, with W0227 the one exception, and the qc-preproc fuzz target asserts exactly that. Two FTEQCC statements give two different warnings of one code at one span: FTEF-14.58 puts both W0115 warnings of an `#append` with other parameters ("arguments differ in macro append" or "different number of macro arguments in macro append", then "Alternate precompiler definition of NAME (OLD -> NEW)") at the macro's name, and FTEF-12.11's `#pragma flag` gives a W0113 for each NAME, all at the pragma's span, so `#pragma flag enable foo bar` names two unknown flags at one place. The fuzz target has not found either yet, but nothing stops it. The options: give each warning its own span (the parameter list or the `#append` word for the first W0115, each NAME's word for W0113, which needs the pragma's words kept with their source offsets); add the two to QCD-1.5's exceptions, as W0227 is; or report one of each pair.
  depends: []
  deliverable:
  - 'docs/adr/0022-distinct-warnings-at-one-span.md, the ADR choosing among the options, with the replacing spec statements it needs (QCD-1.5, FTEF-14.58 or FTEF-12.11)'
  acceptance:
  - The ADR is Accepted, and the follow-up implementing it is filed in plan/
  verify:
  - ADR link
- key: P3-41
  title: The preview host pauses a single player game while the menu or the console is up
  labels:
  - L4-bridges
  - area:preview
  - type:bug
  size: S
  reqs:
  - ENG-15
  summary: |
    Found by the self-review of #772. id's engine pauses a single player game while the keys go to the console or a menu: `Host_ServerFrame` runs `SV_Physics` only `if (!sv.paused && (svs.maxclients > 1 || key_dest == key_game) )`, under the comment "always pause in single player if in console or menus", and `SV_RunClients` gates `SV_ClientThink` the same way (id-Software/Quake@bf4ac424, WinQuake/host.c and sv_user.c). The preview host runs the server's frame whatever its key destination, so with the menu or the console up its game goes on while id's stands, and qs-sim's frame-by-frame differential and the view differential's menu and console shots compare two clocks that have parted.
  environment: |
    main after #771; qs-sim World::frame, apps/preview-host headless.rs and window.rs
  depends: []
  deliverable:
  - 'crates/qs-sim: a statement PHYS-11.9 in docs/spec/engine/physics.md and the world reading where the client''s keys go, a frame with them elsewhere than the game reading the move but running neither the think nor the physics, as `pause` does (PHYS-11.8)'
  - 'apps/preview-host: the window and the headless view scripts give the world the key destination before each frame'
  acceptance:
  - 'A qs-sim test pins PHYS-11.9: with the keys elsewhere, time and entities stand and the move is still read; a preview-host test that a view script''s menu stops the game''s time'
  - 'A Differential run on the PR passes the view differential with the menu and console shots, linked in the PR'
  verify:
  - cargo test -p qs-sim -p preview-host
- key: P3-42
  title: Dock the game beside the IDE on a monitor whose origin is not the desktop's
  labels:
  - L5-commands
  - area:preview
  - type:bug
  size: S
  reqs:
  - ENG-9
  summary: |
    Found by the self-review of #774. `DockFrame::placement` (crates/qs-workbench/src/preview/dock.rs) reckons the room right of the IDE as `screen_width - (x + width) - GAP`, the monitor's width taken as an absolute right edge, while `x` is in desktop coordinates. On a second monitor 2560 wide at x 2560, the IDE at x 2660 and 1200 wide, the room comes out negative and the game overlaps the IDE's corner with 1300 points free beside it; on a monitor left of the primary, at negative x, it errs the other way. Its tests put the IDE on the primary monitor only.
  environment: |
    main after #742; crates/qs-workbench/src/preview/dock.rs, apps/desktop/src/shell.rs (the frame from egui's viewport)
  depends: []
  deliverable:
  - 'crates/qs-workbench/src/preview/dock.rs and apps/desktop: the frame carries the monitor''s origin as well as its size, as far as egui and the window system report it, and the room beside the IDE is reckoned from the monitor''s right edge in desktop coordinates'
  acceptance:
  - 'Tests place the IDE on a monitor right of the primary, left of it (negative x) and on the primary, each docking beside the IDE when there is room and overlapping its corner when there is not'
  verify:
  - cargo test -p qs-workbench -p quakec-studio
