milestone: P3
issues:
- key: P3-01
  title: 'Spec: IDE bridge protocol'
  labels:
  - L4-bridges
  - area:preview
  - type:spec
  size: M
  reqs:
  - ENG-2
  - ENG-1
  - ENG-14
  depends:
  - P0-12
  deliverable:
  - 'docs/spec/bridge-protocol.md: versioned JSON messages over a local socket; handshake and version negotiation; events (progs loaded, map loaded, edict spawned/changed/removed, QC error, breakpoint hit,
    console line); commands (reload, pause, resume, step, set breakpoint, inspect, set field, pick at screen point, spawn, remove and edit entity, console, screenshot, spawn player at), each capability-flagged'
  - JSON Schemas under docs/spec/bridge-schema/
  acceptance:
  - Every EngineAdapter operation maps to a protocol command
  - Compatibility rules for adding fields and messages are stated
  verify:
  - Schema validation tests in both repos
- key: P3-02
  title: Fork the preview host and add the bridge module
  labels:
  - gpl-tools
  - area:preview
  - type:feature
  size: L
  reqs:
  - ENG-2
  - PLAT-3
  - ARCH-2
  depends:
  - P3-01
  - P0-14
  deliverable:
  - Separate repo quakecstudio/preview-host (GPL), forked from the engine chosen in ADR-0004, with a bridge module implementing docs/spec/bridge-protocol.md events
  - Builds for macOS universal, Windows x64/arm64, Linux x86_64/aarch64 as CI artifacts with checksums
  acceptance:
  - Loads id1 and rerelease from the user's install and streams events to a test client
  - Every change outside bridge/ is listed in PATCHES.md with its reason
  - 'Implements every command in bridge-protocol.md except reload (P3-03) and debugging (P3-04): pause, resume, step, set field, pick, inspect, console, screenshot, spawn player at; each with a conformance
    test'
  verify:
  - Protocol conformance tests in the host repo CI on all three OSes
