- key: P3-06
  title: Implement the engine bridge client for the preview host
  labels:
  - L4-bridges
  - area:preview
  - type:feature
  size: M
  reqs:
  - ENG-1
  - ENG-14
  depends:
  - P3-01
  - P0-22
  - P1-19
  deliverable:
  - 'crates/qs-engine: the bridge client for our preview host, the only engine the IDE runs (ADR-0005): launch, reload, set_breakpoint, step, inspect, console, screenshot plus capability-flagged pause, resume,
    set_field, pick, spawn, remove and edit_entity, speaking the bridge protocol'
  - The preview host binary is located from the app bundle (shipped with the app, P4-18) or a configured path; no runtime download
  - 'Run roots (ADR-0008): before every launch the client creates and repairs <project>/build/run/original and <project>/build/run/rerelease, each holding id1, a directory link to the install''s id1 or
    rerelease/id1 found by qs-install (P1-19), and <mod>, a directory link to ../../<mod> (the build output in <project>/build/<mod>/), made with qs-install''s directory-link function; on macOS and Linux
    the rerelease run root also links QuakeEX.kpf. It launches the preview host with -basedir <run root> -game <mod>, adding -kpf <install>/rerelease/QuakeEX.kpf on Windows, where a junction cannot link
    a file; nothing is written inside the install or copied out of it'
  acceptance:
  - The bridge client test suite runs against the real host in headless mode
  - A missing, broken or wrongly targeted run-root link is repaired before the next launch, in tests on fixture installs
  - 'Recorded launches moved here from P0-22 by ADR-0008: the preview host launched through the run roots plays the original game (id1) and the rerelease from a Steam install and from a GOG install on
    macOS, Windows and Linux, and the install is unchanged afterwards'
  verify:
  - cargo test -p qs-engine
  - Recorded launches per OS and store attached to the issue
