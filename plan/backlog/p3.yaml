  - 'Lightmaps are RGB throughout, as .lit already needs, and each texture may carry its own palette (Half-Life''s BSP version 30 and WAD3, P5-11 and P5-12, MAP-24), so the renderer assumes neither one global palette nor greyscale lightmaps'
