  - 'Command line (ADR-0008): -basedir PATH (the game root holding id1), -game NAME (a single directory name under it) and -kpf PATH (the rerelease''s QuakeEX.kpf, read from that path instead of the basedir)'
  - Builds for macOS universal, Windows x64/arm64, Linux x86_64/aarch64 as CI artifacts with checksums
  acceptance:
  - Loads id1 and the rerelease from the user's install, plays e1m1 from start to exit with keyboard and mouse on all three OSes, and streams events to a test client
  - 'Implements every command in bridge-protocol.md except reload (P3-03) and debugging (P3-04): pause, resume, step, set field, pick, inspect, console, screenshot, spawn player at; each with a conformance
    test'
  - Started with -basedir, -game and -kpf against a fixture game root, it loads the mod from the named directory and the rerelease's localization from the -kpf file, and rejects a -game value that is a path
  verify:
  - Protocol conformance tests in CI on all three OSes
