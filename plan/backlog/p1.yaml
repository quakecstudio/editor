milestone: P1
issues:
- key: P1-01
  title: 'Spec: progs.dat format and QC type layout'
  labels:
  - L0-formats
  - area:vm
  - type:spec
  size: M
  reqs:
  - FND-1
  - FND-2
  - FND-7
  - LIC-2
  depends:
  - P0-09
  deliverable:
  - 'docs/spec/progs.md: header, version numbers, statements, globaldefs, fielddefs, functions, string table, CRC; the eight types and their global-slot sizes; FTE v7 differences in a separate section'
  - 'docs/spec/limits.md: every format and engine limit as a named constant with file and function citation'
  - Hand-written test vectors (hex dumps with expected decoded values) under docs/spec/vectors/progs/
  acceptance:
  - Every field of every on-disk structure is described with offset, size, type and meaning
  - Each section cites the id source file and function it describes
  verify:
  - Checked against id's source; the vectors pass against the id VM oracle once P1-11 lands
