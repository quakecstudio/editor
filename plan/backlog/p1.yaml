  - '.github/workflows/ci.yml, Test Assets (linux): the single-token deletion check of id 1.01 (cargo xtask parse-corpus --deletions), the one step that takes minutes, runs only in the merge group, and the corpus parses run from an optimized xtask build; every other step and job still runs on the pull request'
