- key: P1-52
  title: The walk example fails a map whose .lit QuakeSpasm ignores
  labels:
  - L0-formats
  - area:map
  - type:bug
  size: S
  reqs:
  - MAP-6
  - FND-11
  summary: |
    Running `cargo run --release -p qs-vfs --example walk` on the 2021 rerelease with `-game hipnotic`, `rogue`, `dopa` or `mg1` (P1-30, #277) prints `failed: maps/start.bsp: maps/start.lit: Outdated .lit file (maps/start.lit should be N bytes, not M)`, so each of those runs fails. QuakeSpasm (sezero/quakespasm@c9c8ee98, `Quake/gl_model.c`, `Mod_LoadLighting`) only prints that message with `Con_Printf` and lights the map from the BSP's own lighting lump (BSP-18.2, BSP-18.5), so the map loads. The walk also pairs a BSP that a lookup never reaches (shadowed by the mod's copy) with the mod's `.lit`, and never applies BSP-18.4, so a mod's map is checked against the base game's `.lit`, which QuakeSpasm ignores.
  environment: |
    macOS, main at 1f4c187, Justin's GOG Quake Enhanced (2021 rerelease) folder; results in https://github.com/quakecstudio/editor/issues/277#issuecomment-6221264809
  deliverable:
  - 'crates/qs-bsp/src/lit.rs: `mod_load_lighting`, the choice QuakeSpasm''s `Mod_LoadLighting` makes for a map: the `.lit` it uses, or why it ignores one (lower priority, corrupt, unknown version, outdated) with its message, falling back to the BSP''s own light, never an error; `BspLoader::WinQuake` and `BspLoader::GlQuake` never read a `.lit` (BSP-18.6)'
  - 'docs/spec/bsp.md: statements quoting `Mod_LoadLighting` for the order of its checks and for the map loading whatever the `.lit` holds; docs/spec/vectors/bsp/README.md: `.lit` vectors, checked against `Mod_LoadLighting` copied unchanged from the pinned commit'
  - 'crates/qs-vfs/examples/walk.rs: a BSP a lookup reaches is paired with the `.lit` it finds, with BSP-18.4 applied by game directory; an ignored `.lit` is a `warning:` line, not `failed:`'
  acceptance:
  - A test citing the new statements shows an outdated, corrupt, unknown-version and lower-priority `.lit` each leave the map loading with grey light and QuakeSpasm's message, and fails before the fix
  - WinQuake and GLQuake loaders never use a `.lit` (BSP-18.6), shown by a test
  - The `.lit` vectors give the same result from `mod_load_lighting` and from QuakeSpasm's `Mod_LoadLighting`, recorded in the PR
  - The walk example run on the rerelease with -game hipnotic, rogue, dopa and mg1 prints no `failed:` line for `maps/start.lit`
  verify:
  - cargo test -p qs-bsp; the walk runs posted on P1-30
