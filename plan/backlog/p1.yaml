- key: P1-14
  title: Build corpus fetch and build tooling
  labels:
  - repo
  - area:vm
  - type:test
  size: S
  reqs:
  - FND-9
  - LIC-5
  - LIC-7
  - QA-4
  - LIC-4
  depends:
  - P0-16
