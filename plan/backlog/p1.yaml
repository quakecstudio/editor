    local stack save and restore; builtin dispatch; runaway loop limit; error behaviour'
  - 'Test vectors: small programs with expected global state after each statement'
  acceptance:
  - All vanilla opcodes covered with at least one vector each
  verify:
  - Vectors later run against the id VM oracle (P1-11) and must pass
