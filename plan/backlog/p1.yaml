    Every rerelease run of the walk example (P1-30, #277) prints about 48 lines like `failed: tactile/dualsense/player/axhit1_vb.wav: is a stereo sample`, 246 over the five runs. These are the rerelease's DualSense haptics clips, not sounds: id's `S_LoadSound` (WinQuake/snd_mem.c) loads a sound only from `sound/<name>` (`Q_strcpy(namebuffer, "sound/"); Q_strcat(namebuffer, s->name);`), and QuakeSpasm does the same. qs-wav rejects stereo as id's code does (WAV-3.1), so the reader is right and the walk is wrong to load every `.wav` as a sound.
  environment: |
    macOS, main at 1f4c187, Justin's GOG Quake Enhanced (2021 rerelease) folder; results in https://github.com/quakecstudio/editor/issues/277#issuecomment-6221264809
  deliverable:
  - 'docs/spec/wav.md: a WAV-3 statement quoting `S_LoadSound`''s `sound/` prefix; crates/qs-wav: the path `S_LoadSound` loads a sound from, and the sound name of a path under `sound/`'
  - 'crates/qs-vfs/examples/walk.rs: decodes a `.wav` as a sound only under `sound/`, and reports the other `.wav` files on their own line, not as `failed:`'
  acceptance:
  - A test citing the new WAV-3 statement shows which paths `S_LoadSound` reaches
  - The walk example on the rerelease prints no `failed:` line for `tactile/`, and its count of `.wav` files outside `sound/`
