  - P1-26
  - P1-08
  deliverable:
  - 'cargo xtask corpus fetch|build|verify: downloads entries in corpus/manifest.toml by checksum into a cache outside the source tree; builds progs with the oracle qcc where needed'
  - cargo xtask corpus verify replaces corpus/verify.py and its tests, keeping every check (manifest rules, repository scan, online checksums); the Python script is removed
  - cargo xtask assets fetch|precache replaces corpus/assets.py and its tests, keeping every check (archive and member checksums, scenario minimum, stand-ins, rerelease precache coverage); the CI Test Assets job calls it and the Python script is removed
  acceptance:
  - Works offline from cache; refuses entries marked never
  - From Quake-Tools only qcc/v101qc/*.qc is extracted into the corpus; compiler and engine sources belong to the oracles build
  - Every oracle-built progs.dat in the corpus round-trips byte for byte through qc-progs (run here because this is where those files first exist)
  verify:
  - CI job on all three OSes
