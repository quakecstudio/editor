- key: P0-23
  title: Add the code-signing credentials to CI
  labels:
  - repo
  - area:release
  - type:chore
  size: S
  reqs:
  - QA-14
  summary: |
    Deferred to the post-MVP backlog on 2026-11-11 and brought back the same day, once Justin pointed at smoketurner-infra's environments/azure/code_signing.tf: Azure already trusts this repository, with a federated credential for exactly `repo:quakecstudio@343029298/editor@1420764495:workflow:release:ref_type:tag`. The first Sign run (42848352515, 2026-11-10) signed and notarized on macOS; its Windows job failed with AADSTS700213 only because that workflow was named Sign and ran from a branch. P4-18's `release` workflow signs the Windows executables on a tag, so the first tagged pre-release meets the last criterion.
  deliverable:
  - 'docs/releasing.md: the twelve repository-level secrets Justin entered on 2026-10-16, following vouch and quack (APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD, APPLE_CERTIFICATE_NAME, MACOS_KEYCHAIN_PASSWORD, APPLE_ID, APPLE_ID_PASSWORD, APPLE_TEAM_ID for codesign and notarytool; AZURE_CLIENT_ID, AZURE_TENANT_ID, TRUSTED_SIGNING_ENDPOINT, TRUSTED_SIGNING_ACCOUNT, CERTIFICATE_PROFILE for Azure Trusted Signing over OIDC), who owns each credential and when it renews; that they are repository-level by Justin''s choice, so only workflows that sign may reference them'
  - A signing workflow modelled on vouch's reusable-build.yml (temporary keychain, codesign with the hardened runtime, notarytool with the Apple ID; azure/login over OIDC and Trusted Signing), started by hand (workflow_dispatch) and reused by P4-18; agents never handle the secret values
  acceptance:
  - '`gh api repos/quakecstudio/editor/actions/secrets` lists every name in docs/releasing.md'
  - A test binary is signed and notarized on macOS and signed on Windows from CI
  - 'If the Azure login fails because no federated credential trusts quakecstudio/editor, the issue is escalated to Justin with the subject to add, not worked around'
  verify:
  - CI run link
  depends:
  - P0-02
  - P0-15
  - P4-18
