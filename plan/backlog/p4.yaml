- key: P4-28
  title: Export a mod for players
  labels:
  - L5-commands
  - area:release
  - type:feature
  size: M
  reqs:
  - QA-15
  - LIC-4
  - LIC-5
  depends:
  - P4-27
  - P4-17
  deliverable:
  - 'A `project.export` command, used by File > Export Mod and the agent: a zip of the mod folder named after the project, containing progs.dat (and csprogs.dat or menu.dat if built), maps and the project''s own assets, optionally packed into pak0.pak'
  - Reads the built mod from build/<mod>/ and never follows the run-root links under build/run/ (ADR-0008)
  - A generated README.txt with what the mod is, which game it needs (original or rerelease) and how to install and launch it in common engines; the project's license and the notices of everything it includes
  - Refuses to export id's game data, detected by checksum and by the files of the user's install, and lists any file whose license is unknown according to the project's attribution file
  acceptance:
  - An exported template mod, unzipped into a clean Quake folder, launches and plays in the preview host on each OS
  - An export that would include a file from id1 or the rerelease paks fails with a clear message
  - An export from a project whose build/run/ links point at a fixture install contains no file reached through those links
  - Exporting twice from the same sources produces the same zip
  verify:
  - Integration test in CI with open test assets; manual install-and-play check recorded on macOS
- key: P0-23
  title: Add the code-signing credentials to CI
  labels:
  - repo
  - area:release
  - type:chore
  size: S
  reqs:
  - QA-14
  deliverable:
  - 'docs/releasing.md: the twelve repository-level secrets Justin entered on 2026-10-16, following vouch and quack (APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD, APPLE_CERTIFICATE_NAME, MACOS_KEYCHAIN_PASSWORD, APPLE_ID, APPLE_ID_PASSWORD, APPLE_TEAM_ID for codesign and notarytool; AZURE_CLIENT_ID, AZURE_TENANT_ID, TRUSTED_SIGNING_ENDPOINT, TRUSTED_SIGNING_ACCOUNT, CERTIFICATE_PROFILE for Azure Trusted Signing over OIDC), who owns each credential and when it renews; that they are repository-level by Justin''s choice, so only workflows that sign may reference them'
  - A signing workflow modelled on vouch's reusable-build.yml (temporary keychain, codesign with the hardened runtime, notarytool with the Apple ID; azure/login over OIDC and Trusted Signing), started by hand (workflow_dispatch) and reused by P4-18; agents never handle the secret values
  acceptance:
  - '`gh api repos/quakecstudio/editor/actions/secrets` lists every name in docs/releasing.md'
  - A test binary is signed and notarized on macOS and signed on Windows from CI
  - 'If the Azure login fails because no federated credential trusts quakecstudio/editor, the issue is escalated to Justin with the subject to add, not worked around'
  verify:
  - CI run link
  depends:
  - P0-02
  - P0-15
