    labels:
    - L5-commands
    - area:map
    - type:feature
    size: M
    reqs:
    - MAP-16
    summary: |
      Found by L-40's trial on 2026-11-20, in which Claude Code built and reviewed a map through the MCP server. Three things slowed it or misled it and were not changed there. `map.play_from_here` answered no light warning for a room that was nearly black; only the screenshot showed it. A monster near the point played from was already attacking when the frame was taken, so a review picture shows a fight rather than the room. And a tool that hollows or cuts brushes changes the places of an entity's brushes without saying which brushes it made, so the agent lists them again after each one.
    depends:
    - L-40
    deliverable:
    - 'The map tools that light a map report how dark it is where it matters: each room, or the space around the player start and each entity, with its light level, so a room too dark to play is found without a picture'
    - 'A way to look at a map as the game draws it with its monsters asleep: a play option or a view that takes the frame before any monster acts'
    - 'The brush tools that add, cut or hollow brushes answer the places of the brushes they made'
    - 'The game the MCP server''s own session plays has no window and no sound, and its player is moved by the console''s buttons; `map.summary` can answer only the most used textures, with the count of them all (both done first, on 2026-11-20, in apps/cli, crates/qs-game and crates/qs-map-edit: an agent''s review opened the game on the person''s screen at every look, and a full summary named hundreds of textures)'
    - '`map.issues` finds the entity a `target` names: a second trial on 2026-11-20 was told nothing targets a door that a func_button of LibreQuake targets'
    - '`map.play_from_here` answers where the player is in the game, not where it was asked to be: asked for a point inside a button, it answered that point while the player stood at the start'
    acceptance:
    - 'A map with a lit room and an unlit room is reported with the unlit room dark, checked by a test'
    - 'A game started paused runs no frame until it is resumed, checked by a test of the host, and a frame of a map played paused with a monster beside the point shows the monster where the map put it, recorded in the PR'
    - 'A doorway is carved between two rooms using only the places the brush tools answered, with no `map.brushes` call, checked by a test'
    - 'A func_button whose target is a door''s targetname leaves no issue on the door, checked by a test on LibreQuake''s QuakeC or a fixture like it'
    - '`map.play_from_here` at a point where the player does not fit answers the origin the game reports, checked by a test'
    - 'The MCP server''s own preview is launched with `--headless`, checked by a test of the CLI; `+forward` typed at the headless host''s console moves the player, checked by `cargo xtask bridge-client`; `map.summary` with `most_textures` lists that many textures and counts them all, checked by a test'
    verify:
    - 'cargo nextest run -p qs-map-edit -p qs-workbench -p quakec-ide; cargo xtask bridge-client <game root>'
  - key: L-42
