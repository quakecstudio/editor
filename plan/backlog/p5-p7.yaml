  - key: P6-35
    title: The preview host panics drawing a map with no textured face
    labels:
    - L7-ui
    - area:preview
    - type:bug
    size: S
    reqs:
    - MAP-13
    - MAP-17
    depends:
    - P6-12
    summary: |
      The Phase 6 gate review (docs/gates/p6.md) compiled a new map built from brushes with qs-map-bsp, qs-map-vis and qs-map-light and no WAD, put it in a game's maps folder and ran `quakec-engine -basedir <game> --timerefresh -300 0 46 <map>`. The host stops with `buffer slice can not be empty` from wgpu-30.0.1 `src/api/buffer.rs:683`, exit 101, in `qs_render::gpu::MapRenderer::draw_world` (`crates/qs-render/src/gpu.rs:971`, `self.vertices.slice(..)`): no face has a texture, so the world's vertex buffer is empty. The same map compiled with a WAD holding its six textures draws, exit 0. New brushes take `__TB_empty` when no texture is chosen (`crates/qs-map-edit/src/brushes.rs:38`), which no WAD holds, so Play from here on a new map with no WAD reaches this panic. The CI tests of Play from here and of the compile profiles play the map in qs-sim only and never draw it.
    environment: |
      macOS (Apple M5), main at c702f4cc, release build; LibreQuake lite as the game; the map is the gate review's two rooms, a corridor with a func_door, a func_button, stairs and three lights, written with no WAD key
    deliverable:
    - 'qs-render draws a map in which no face, or only some faces, have texture data without a panic, as a spec statement it cites says such faces are drawn, and never binds an empty world buffer'
    acceptance:
    - 'A test draws offscreen a BSP compiled by qs-map-bsp from brushes whose textures no WAD holds, and fails before the fix'
    - 'quakec-engine --timerefresh on that map exits 0, recorded in the PR'
    verify:
    - 'cargo test -p qs-render; the timerefresh run recorded in the PR'
  - key: P6-36
    title: Offer the map tools over MCP
    labels:
    - L6-agent
    - area:agent
    - type:bug
    size: S
    reqs:
    - MAP-29
    - MAP-16
    depends:
    - P6-21
    summary: |
      P6-21's deliverable is the map's brush, shape and CSG commands "offered to the agent and MCP so they build level geometry", and its PR (#913) says they are "offered to the agent and MCP with their schemas". The built-in agent has them, but the MCP server has none: `quakec-ide mcp <project>` answers `tools/list` with the 26 tools of `qs_mcp::AGENT_TOOLS` (`crates/qs-mcp/src/lib.rs:65`), and no `map.*` tool among them, so an MCP client cannot open, inspect, edit, compile or check a map for leaks. `docs/mcp.md`'s tool table lists no map tool either.
    environment: |
      macOS (Apple M5), main at c702f4cc, release build of quakec-ide; a one-file project; MCP 2025-06-18 initialize, then tools/list
    deliverable:
    - 'crates/qs-mcp: the map commands the built-in agent may call (map.open, map.inspect, map.place, map.set_key, the brush, shape and CSG commands of P6-21, map.compile and map.leaks) served as tools with their schemas and the access each needs, map edits staged for review as the agent''s are'
    - 'docs/mcp.md: the map tools in its tool table'
    acceptance:
    - 'A test lists the tools and finds each map tool above with its schema'
    - 'A test builds a sealed room through MCP tool calls alone and compiles it with no leak'
    - 'A read-only server refuses the map tools that write'
    verify:
    - 'cargo test -p qs-mcp'
  - key: P6-37
    title: Play from here takes over 10 s on lq-e1m1 since the extended qbsp port
    labels:
    - L4-bridges
    - area:map
    - type:bug
    size: M
    reqs:
