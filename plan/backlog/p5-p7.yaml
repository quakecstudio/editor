  - key: P6-42
    title: 'Breakpoints in spawn functions stop the game when a level loads'
    labels:
    - L4-bridges
    - area:preview
    - type:bug
    size: M
    summary: |
      A breakpoint in a spawn function, such as func_door's in LibreQuake's doors.qc, does not stop the
      game when the level loads again with preview.restart (or changelevel). WORLD-9.1 runs the map's
      spawn functions without a debugger, and the host gives the next level its breakpoints only after it
      has loaded. A modder setting a breakpoint there expects it to stop; it will (Justin, 2026-11-14:
      the most intuitive choice, better than TrenchBroom, which cannot debug QuakeC at all).
    environment: |
      Found by the recorded run of #942 at 3dd3edea on macOS: the desktop app driven over its socket,
      LibreQuake's codebase and lq-e0m1, the LibreQuake lite assets.
    reqs:
    - ENG-4
    - GOAL-3
    depends:
    - P6-41
    deliverable:
    - 'crates/qs-sim: World::load running the map''s spawn functions with a debugger when given one; a stop in a spawn function returns the partly loaded world and where it stopped, and going on replays the load from its inputs, skipping the statements already run, as WORLD-9.2 replays a frame'
    - 'apps/quakec-engine: a level started by map, restart or changelevel gets the breakpoints before it loads, not after, and the game is paused at a stop during the load'
    - 'docs/spec/engine/world.md: WORLD-9.1 withdrawn (spawn functions run without a debugger) and replaced by statements that the load runs with the debugger and how a stop in it is gone on from; tests citing them'
    acceptance:
    - 'A breakpoint in a spawn function stops the game when the level loads after preview.restart and after changelevel, and the editor follows the stop, shown by a qs-sim test and a host test'
    - 'Going on from a stop in a spawn function finishes the load with the same world as a load with no breakpoint, shown by a test comparing the two'
    - 'A level with no breakpoints in spawn functions loads as before; the simulation and view differentials pass'
    verify:
    - cargo xtask ci; cargo xtask bridge-client on LibreQuake; the recorded run of #942 repeated with the breakpoint in func_door
  - key: P6-43
    title: 'Texture a new map from the game''s own levels'
    labels:
    - L5-commands
    - area:map
    - type:feature
    size: M
    reqs:
    - MAP-5
    - PLAT-6
    summary: |
      Found on 2026-11-18 building a map through the MCP tools for #135. Quake ships no texture WAD: each level's textures are inside its BSP (`maps/*.bsp` in `pak0.pak` and `pak1.pak`), and the only WAD in the game is `gfx.wad`, the HUD's. The texture browser lists the WADs the world names and the BSP a map was opened from, so a new map has no texture to choose until the modder finds a WAD elsewhere, and `map.compile` reports each face's texture missing. The run got its textures by copying `e1m1.bsp`'s out of the install into a WAD by hand.
    depends: []
    deliverable:
    - 'crates/qs-map-edit/src/textures.rs: the texture browser also lists the textures of the BSPs on the game''s search path, read in place and each once, with the level it came from as its origin (`TextureOrigin`), beside the WADs'' and the open BSP''s'
    - 'crates/qs-workbench/src/map_compile.rs: `map.compile`, `map.leaks` and `map.play_from_here` find a face''s texture among them when no WAD of the world has it, in memory; nothing is written into the install or the project'
    - 'The map view draws those textures on brushes as it draws a WAD''s'
    acceptance:
    - 'A test: a map with no `wad` key whose faces name textures of a BSP on the game''s search path compiles with no missing texture, and the BSP written holds them'
    - 'A test: `map.textures` on a new map lists a game BSP''s textures, each once, with its origin'
    - 'A recorded run on the reference Mac with a game install: a new map textured from the browser, compiled and played, and `find <install> -newer <marker>` printing nothing'
    verify:
    - 'cargo xtask ci; the recorded run in the PR'
  - key: P6-44
    title: 'An MCP agent can make, save and play a map'
    labels:
    - L6-agent
    - area:map
    - type:bug
    size: M
    reqs:
    - MAP-16
    - MAP-13
    summary: |
      Found on 2026-11-18 building a map through `quakec-ide mcp --connect` for #135, where the map was built, compiled and found sealed through the tools but three steps needed something else. (1) No tool makes a map: `map.open` takes a file that exists, so the empty `.map` was written by hand. (2) No tool saves one: `map.save` is a command of the app that the MCP server does not offer. (3) The map could not be played: `preview.play` with `{"map": "arena"}` stopped the preview host with "maps/arena.bsp is not on the search path", because `map.compile` writes the BSP beside the `.map` in the project and Play reads maps from the run root; `map.play_from_here` copies it there but is not offered either. Also, `preview.pick` answers the current selection when its ray hits nothing, so a miss reads as a hit on what was selected before.
    environment: |
      macOS (Apple M5), main at 30683ba7, release builds of quakec-studio and quakec-ide; a project made by `quakec-ide new rerelease`, GOG's Quake Enhanced extracted by innoextract
    depends: []
    deliverable:
    - 'crates/qs-mcp: `map.new` (a `.map` in the project with a world and the keys given), `map.save` and `map.play_from_here` among the agent''s tools, each with the access it needs, as the built-in agent has them'
    - 'crates/qs-workbench/src/preview.rs: `preview.play` of a map the project compiled finds its BSP, by the run root holding the project''s `maps/` or the BSP put there as `map.play_from_here` puts it'
    - '`preview.pick` answers no edict when its ray hits none'
    acceptance:
    - 'A test drives the MCP server alone: `map.new`, brushes, entities, `map.compile`, `map.save`, then a play of the map, each call answering without an error'
    - 'A test: `preview.play` of a map compiled in the project plays it'
    - 'A test: `preview.pick` at a point with no entity answers a null edict whatever was selected'
    verify:
    - 'cargo xtask ci'
