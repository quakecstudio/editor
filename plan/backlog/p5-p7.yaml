  - key: L-47
    title: Import, write and change models with commands
    labels:
    - L5-commands
    - area:editor
    - type:feature
    size: L
    reqs:
    - PRIN-6
    - MAP-4
    - FND-11
    summary: |
      Justin, 2026-11-20, after an agent added a monster to LibreQuake but could only reuse the soldier's model: "create an issue for model importing and manipulation by porting modelgen and FTE's tools and introducing new commands for such to broaden what can be modified". A monster's geometry, skin and animation are its `.mdl` (skins in the palette, triangles, a position for every vertex in every frame), and `qs-mdl` only reads one. The prior art: id's `modelgen` (`Quake-Tools/qutils/MODELGEN`, portable since ADR-0029) writes a `.mdl` from a script naming its triangles, skins and frames, and FTE's model converter (the `iqm/` directory of `fte-team/fteqw`) reads md5mesh, md5anim, iqe, smd, fbx and obj and writes a Quake `.mdl` among others. TrenchBroom only shows models. fteqw's `iqm/` is not yet a listed upstream: its files' own headers decide whether it may be ported, and an ADR records that before any of it is.
    depends:
    - L-45
    deliverable:
    - 'docs/adr/: fteqw''s `iqm/` as a portable upstream, or why not, from its files'' own license headers; docs/porting.md lists it with its commit'
    - 'crates/qs-mdl: a writer for `.mdl`, ported from id''s modelgen (`WriteModelFile` and what it calls), with its spec section in docs/spec/ and a round trip against the reader; frames, skins and triangles can be read, changed and written back'
    - 'crates/qs-mdl or a crate beside it: readers for the formats a model is made in (obj and iqe first, then md5mesh and md5anim, smd and fbx as the ADR allows), each to one model in memory that the writer takes'
    - 'Commands, offered to the UI, the command line, the agent and MCP: `model.inspect` (frames, skins, triangles, bounds, the `$frame` names its QuakeC needs), `model.import` (a source file to a `.mdl` in the project), `model.set_skin` and `model.export_skin` (a skin from and to a PNG, through the game''s palette), `model.scale`, `model.move`, `model.rename_frames`, `model.add_frames` and `model.remove_frames`; each with undo'
    - 'docs/agent-reference/: a `models` topic served by `project.reference`'
    acceptance:
    - 'Every `.mdl` of the test game read and written back is byte for byte the file read, checked by a test; a model written by our writer from modelgen''s inputs equals id''s modelgen''s output on the same inputs, by the oracle'
    - 'An obj and an iqe model import to a `.mdl` that the preview host draws, checked by a test of the imported model''s frames, triangles and skin and by a recorded run'
    - 'Claude Code, asked through the MCP server to give LibreQuake a new monster with a skin of its own and a changed shape, does so with the model commands, and the monster is drawn so in a played map, recorded in the PR'
    verify:
    - 'cargo nextest run -p qs-mdl -p qs-workbench -p qs-tests; cargo xtask oracles; the recorded runs in the PR'
  - key: L-48
