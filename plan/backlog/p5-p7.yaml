    - L-40
    deliverable:
    - 'Twenty-three command ids renamed to say what they act on and do: map.move_to to map.move_to_layer_or_group, map.move to map.move_entity, map.place to map.place_entity, map.delete to map.delete_entity, map.duplicate to map.duplicate_entity, map.entity to map.read_entity, map.inspect to map.list_entities, map.rotate to map.rotate_entity, map.turn to map.rotate_objects, map.filter to map.entities_removed_by_skill, map.link to map.link_target, map.separate to map.unlink_group, map.fix to map.apply_fix, map.leaks to map.find_leaks, map.textures to map.list_textures, map.staged to map.staged_hunks, map.accept to map.accept_hunks, map.reject to map.reject_hunks, map.resolve to map.resolve_disk_change, map.compare to map.compare_with_disk, edit.apply to edit.stage_change, preview.game to preview.game_files, compile to project.compile; no old id is kept'
    - 'crates/qs-mcp: the server''s instructions list the kinds of tools there are, since they are what an agent reads before it searches'
    acceptance:
    - 'No old id is left in the code, the generated references or the living docs, checked by a search recorded in the PR'
    - 'Every check and test passes with the new ids, the generated command and keymap references among them'
    - 'A test holds the server''s instructions to naming each kind of tool'
    verify:
    - 'cargo xtask ci; the search recorded in the PR'
