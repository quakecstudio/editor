    summary: |
      P6-12's acceptance is "Under 10 s from click to playing on an id1-sized map", met in PR #909 with lq-e1m1 "compiled in 1.05 s, 1.38 s with the light". PR #914 replaced the extended dialect, which Play from here and every workbench compile use (`crates/qs-workbench/src/map_compile.rs:121`), with the port of ericw-tools' qbsp. On main the same map takes 12.40 s to compile and 12.64 s with the fast light, before the host starts. The gate review measured both with the same program, release builds, on the same machine: at 80a05032 (#909) lq-e1m1 1.11 s and 1.45 s with the light, lq-e3m4 4.12 s and 4.25 s, lq-e1m2 0.32 s and 0.38 s; at c702f4cc (main) lq-e1m1 12.40 s and 12.64 s, lq-e3m4 15.75 s and 16.02 s, lq-e1m2 4.55 s and 4.60 s. lq-e2m5 compiles in 35.9 s.
    environment: |
      macOS, Apple M5 (10 cores), main at c702f4cc and 80a05032; LibreQuake's map sources from the pinned corpus; qs_map_bsp::Compiler in Dialect::Extended with no WAD, then qs_map_light::Light in Sampling::Fast
    deliverable:
    - 'qs-map-bsp''s extended dialect compiles lq-e1m1 fast enough that Play from here is again under 10 s from click to playing, with the map differential still agreeing on every corpus map'
    - 'A benchmark or test that times the Play from here compile of an id1-sized corpus map, so a change that takes it over budget is seen'
    acceptance:
    - 'Under 10 s from click to playing on lq-e1m1 on the reference Mac, recorded in the PR with the compile, light and host start times'
    - 'cargo xtask map-diff agrees on every corpus map after the change'
