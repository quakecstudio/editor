    - 'Refactoring issues in plan/backlog/p5-p7.yaml, filed with the plan-change skill and grouped so that one crate''s fixes fit one PR, each listing its findings and the baseline lines it removes'
    acceptance:
    - 'Every finding in docs/audits/conv-17-since-653.md is either filed in a refactoring issue or explicitly accepted with a reason; python3 plan/check.py passes with the new issues'
    - 'Each refactoring issue''s acceptance criteria require that behaviour is unchanged, every ratchet is not lowered, and P5-18''s baseline only shrinks'
    verify:
    - 'python3 plan/check.py --write-coverage; review of the audit against the filed issues'
