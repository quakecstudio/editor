  - key: P5-18
    title: 'Enforce CONV-17 with checks and a shrink-only baseline'
    labels:
    - repo
    - area:process
    - type:chore
    size: S
    reqs:
    - CONV-17
    depends: []
    deliverable:
    - 'xtask/src/conv17.rs, run by cargo xtask conventions over every shipped crate and app (layers.toml; test code left out), parsing the source with syn and failing on: a function taking a bool (bool-argument); a library crate function returning Result<_, String> (string-error); a free function whose first parameter is a type its crate defines (free-fn-on-type); a visible field or parameter named as an ID and typed as a raw integer (bare-id); and a numeric literal other than 0, 1 and 2 in a function body (magic-number)'
    - 'docs/audits/conv-17-baseline.tsv: each existing violation by rule, file and qualified name, written by cargo xtask conv17-baseline; a violation not listed fails, and a listed one the code no longer has fails until its line is removed'
    - 'docs/conventions.md, "Type design (CONV-17)", and CLAUDE.md say what the check covers and how the baseline shrinks'
    acceptance:
    - 'Fixture workspaces show each rule finding what it should and leaving out what it should (test code, receivers, foreign types, private items, newtypes, constants, types, patterns and macro arguments); the conv17 tests in xtask show it'
    - 'cargo xtask conventions passes on main with the baseline, and fixing a listed violation without removing its line fails'
    verify:
    - 'cargo xtask conventions; cargo nextest run -p xtask conv17'
  - key: P5-19
    title: 'Audit the code changed since the L3 refactor against CONV-17'
    labels:
