  - key: L-50
    title: Import binary fbx models, facing the way obj models do
    labels:
    - L0-formats
    - area:editor
    - type:feature
    size: M
    reqs:
    - PRIN-6
    - MAP-4
    summary: |
      Justin, 2026-11-21, of L-47's fbx import, which reads the text form alone as FTEQW's converter does: "if its not too much work to support binary fbx it seems like it would reduce steps for users needing to convert", and of a y-up fbx facing a quarter turn from the same model as an obj, "what is the most intuitive for users". Programs write binary fbx unless told not to. The binary form holds the same tree of nodes and properties as the text form, so one reader of the tree serves both. FTEQW has no binary reader: this one is written from the format's public description, nothing ported. The most intuitive facing is one rule for every format: a y-up model facing -z faces Quake's +x, as an obj does (MDL-9.1), where FTEQW's quarter turn about x leaves it facing left.
    depends:
    - L-47
    deliverable:
    - 'crates/qs-mdl: a reader of binary fbx (version 7), its arrays inflated with miniz_oxide, to the same tree the text reader makes, and `mesh::fbx` reading either form; its statements in docs/spec/mdl.md, written from the format''s description fetched and quoted'
    - 'crates/qs-mdl: a y-up fbx turned as a y-up obj is, stated as a difference from FTEQW''s converter, with the tests that hold the reader to the converter''s output kept'
    - 'crates/qs-workbench: `model.import` takes a binary fbx; docs/agent-reference/models.md says so'
    acceptance:
    - 'A model written as binary fbx and as text fbx imports to the same mesh, checked by a test with a binary fixture; a binary file that is cut short, or whose array does not inflate, is refused, and a property test feeds the reader arbitrary bytes'
    - 'A y-up model facing -z imports facing +x from fbx as it does from obj, checked by a test'
    verify:
    - 'cargo nextest run -p qs-mdl -p qs-workbench'
  - key: L-51
    title: A rigged fbx from Blender imports with its animation's poses wrong
    labels:
    - L0-formats
    - area:editor
    - type:bug
    size: M
    reqs:
    - PRIN-6
    - MAP-4
    depends:
    - L-50
    summary: |
      On 2026-11-21 two rigged files of assimp's test models, `huesitos.fbx` and `animation_with_skeleton.fbx`, both written by Blender, were posed by Blender 5.2.4 with each of its two fbx importers (`wm.fbx_import`, built on ufbx, and `import_scene.fbx`) at the times `qs_mdl::mesh::fbx` samples them, and every vertex compared. Blender's two importers agree with each other on every frame. Ours matches the first frame of `huesitos.fbx` and is then up to 105% of the model's size from the nearest vertex of Blender's, the model growing from 828 units to over 1300 while Blender's stays near 830; `animation_with_skeleton.fbx` is 9.5% off in its first frame. Both files have their bones under a `Model` of the kind `Null`, the armature, scaled by 100, turned -90 degrees about x and animated, and the reader makes joints of `LimbNode` models alone, as FTEQW's converter does, so a bone turns its vertices about the wrong point. The second file's bind pose is not its limbs' own values either: each cluster's `Transform` and `TransformLink` say where the mesh and the bone were when the mesh was bound, and MDL-10.7 leaves them unread. The fixtures did not show it: `samples.py` writes limbs with no model above them and a bind pose that is the limbs' own.
    environment: |
      macOS (Apple M5), main at 39f45bf6; assimp's `test/models/FBX/huesitos.fbx` and `animation_with_skeleton.fbx`; Blender 5.2.4 run with `-b`, the scene's rate as the file sets it, a pose every tenth of a second and at the last key
    deliverable:
    - 'crates/qs-mdl: every `Model` of an fbx is a node of one tree, a joint, whatever its kind, each posed in its parent''s space and animated by its curve nodes; a skinned geometry is bound by its clusters'' `Transform` and `TransformLink` where the file has them; a mesh model''s `GeometricRotation` and `GeometricScaling` are read; the statements in docs/spec/mdl.md, the changed ones withdrawn and restated'
    - 'crates/qs-mdl/src/mesh/fixtures: a model with its limbs under a scaled, turned and animated `Null` and a bind pose other than its limbs'' own, written by scripts/model-formats/rig.py as text and binary, with the poses Blender makes of it recorded beside it by scripts/model-formats/blender.py'
    acceptance:
    - 'The reader''s poses of the new fixture are Blender''s recorded poses of it, every vertex of every frame, checked by a test that fails before the fix'
    - 'Recorded in the PR: `huesitos.fbx` and `animation_with_skeleton.fbx` posed by the reader and by Blender at the same times, every vertex of every frame, with the greatest distance between them; and the six other files of assimp''s FBX test models used for L-50 compared at rest'
    - 'The tests that hold the reader to FTEQW''s converter on the fixtures of L-47 still pass'
