    summary: |
      Justin, 2026-11-20: asking Claude Code to build maps, over MCP from a terminal and over ACP in the agent panel, with the edits reviewed as hunks, and to review the LibreQuake maps and design a new one from the best of them. A trial on 2026-11-20, with the session as the agent driving `quakec-ide mcp`, built, compiled, played and screenshotted a two-room map with a carved corridor, a door, lights, monsters and items, every edit staged as a hunk. It also showed where an agent guesses: no tool lists an entity's brushes with their bounds, so the brush a tool takes by its place has to be counted by hand; reading a large map means its whole entity list, with nothing shorter to compare maps by; and the server's instructions do not say how a map is built.
