  - key: P6-38
    title: The map differential fails on lq-end in the id dialect
    labels:
    - L4-bridges
    - area:map
    - type:bug
    size: S
    reqs:
    - MAP-11
    depends:
    - P6-07
    summary: |
      The first run of `cargo xtask map-diff` on main, the Map tool oracles job of Differential run 43597129460 at c702f4cc (dispatched by the Phase 6 gate review), fails: `FAIL  lq-end (qbsp): both stop: .../lq-end.map: MAX_HULL_POINTS; exit status: 1: numtexinfo == MAX_MAP_TEXINFO`. id's qbsp stops on the texinfo limit and qs-map-bsp's id dialect on the hull-points limit, so `stop_alike` (`xtask/src/map_diff.rs`) does not match them. The same id-dialect compile of the map, with its WAD keys taken out as map-diff does, stops with `MAX_HULL_POINTS` at 60330adc (#914) too, though PR #914 records every map ok. Every other map agrees, among them the 26 ericw-tools comparisons.
    environment: |
      ubuntu-latest, Differential workflow run 43597129460, job Map tool oracles (132453984007), main at c702f4cc; reproduced locally on macOS at c702f4cc and 60330adc with Compiler::default().with_dialect(Dialect::Id)
    deliverable:
    - 'docs/spec/qbsp.md: a statement, quoted from the pinned qutils source, of what id''s qbsp does when a grown brush passes MAX_HULL_POINTS (its AddHullPoint writes the point and its corners before it tests the limit, undefined), fixing the answer as QBSP-5.6''s stop'
    - 'xtask/src/map_diff.rs: our MAX_HULL_POINTS stop taken as alike with any stop of id''s qbsp, citing that statement'
    acceptance:
    - 'cargo xtask map-diff prints ok for every map, lq-end (qbsp) included, in a Differential run on main'
    - 'A unit test of map-diff takes our MAX_HULL_POINTS stop as alike with qbsp''s unrelated stop on lq-end and no other stop, and fails before the change'
    verify:
    - 'cargo test -p xtask; the Differential run''s map-tools job'
