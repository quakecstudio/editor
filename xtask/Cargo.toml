[package]
name = "xtask"
description = "QuakeC Studio build automation, run as cargo xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cc = { workspace = true }
qc-codegen = { workspace = true }
miniz_oxide = { workspace = true, features = ["with-alloc"] }
qc-lexer = { workspace = true }
qc-lno = { workspace = true }
qc-preproc = { workspace = true }
qc-progs = { workspace = true, features = ["fte"] }
qc-project = { workspace = true }
qc-sema = { workspace = true }
qc-syntax = { workspace = true }
qc-trace = { workspace = true }
qc-types = { workspace = true }
qs-commands = { workspace = true }
qs-settings = { workspace = true }
qs-map = { workspace = true }
qs-pak = { workspace = true }
quakec-lsp = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
toml = { workspace = true, features = ["display", "parse", "serde", "std"] }

[lints]
workspace = true
